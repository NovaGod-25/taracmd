name: content

# Cheap, and runs on everything: no Java, no Gradle, no Android SDK. This is
# what catches a duplicate topic id or a quiz question pointing at a topic that
# no longer exists, which is the failure mode content edits actually have.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Validates content and writes all three targets. Dies on a duplicate
      # topic id, a quiz question aimed at an unknown topic, an answer-key
      # array that does not match the paper length, or an unsubstituted token.
      - name: Build
        run: python3 build.py

      # The validation only runs when content is already broken, so a bug in it
      # stays hidden until the day it was meant to help. This checks it fires.
      - name: Prove the validation fires
        run: python3 tools/check-validation.py

      # The checks above say the content is coherent. They say nothing about
      # whether the app behaves — the decay schedule, the merge on import, the
      # runtime year filter. These run against web/taracmd.html, the file a
      # phone actually opens, in a headless DOM.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test deps
        run: npm --prefix tests ci
      - name: Behaviour tests
        run: npm --prefix tests test

      # build.py is the only thing allowed to write the three targets. A dirty
      # tree here means one of them was hand-edited — which is exactly how the
      # Android assets once shipped a full rename behind the web build.
      - name: Fail if a generated target was hand-edited
        run: |
          if ! git diff --quiet; then
            echo "::error::a generated target differs from what build.py produces"
            git diff --stat
            exit 1
          fi
