,"A","D","A","A","A","D","C","A","A","B","D","B","A","B","C","D","B","C","B","C","B","B","D","D","B","B","B","B","B","A","A","C","B","D","C","A","D","B","C","C","B","A","A","A","C","D","C","B","A","B","D","A","A","C","D","B","B","C","A","C","D"],"B":["D","A","D","C","B","C","A","C","C","D","D","B","B","C","A","D","A","A","A","D","C","A","A","B","D","D","C","A","A","A","B","B","C","A","B","A","B","C","C","D","B","D","C","C","B","C","B","A","B","D","D","B","C","C","B","A","A","A","C","D","C","B","A","B","D","A","A","C","D","B","B","C","A","C","D","B","A","B","C","D","B","C","B","C","B","B","D","D","B","B","B","B","B","A","A","C","B","D","C","A"],"C":["D","B","C","C","B","A","A","A","C","D","C","B","A","B","D","A","A","C","D","B","B","C","A","C","D","B","A","B","C","D","B","C","B","C","B","B","D","D","B","B","B","B","B","A","A","C","B","D","C","A","D","C","A","A","A","B","B","C","A","B","A","B","C","C","D","B","D","C","C","B","C","B","A","B","D","D","A","D","C","B","C","A","C","C","D","D","B","B","C","A","D","A","A","A","D","C","A","A","B","D"],"D":["B","A","B","C","D","B","C","B","C","B","B","D","D","B","B","B","B","B","A","A","C","B","D","C","A","D","B","C","C","B","A","A","A","C","D","C","B","A","B","D","A","A","C","D","B","B","C","A","C","D","D","A","D","C","B","C","A","C","C","D","D","B","B","C","A","D","A","A","A","D","C","A","A","B","D","D","C","A","A","A","B","B","C","A","B","A","B","C","C","D","B","D","C","C","B","C","B","A","B","D"]}},{"code":"gs2","url":null,"keys":{}}]}]};
const QUIZ = {"questions":[{"id":"pol-basic-structure-1","topic":"polity-basic-structure","q":"The basic structure doctrine was first laid down by the Supreme Court in which case?","options":["Golaknath v. State of Punjab (1967)","Kesavananda Bharati v. State of Kerala (1973)","Indira Nehru Gandhi v. Raj Narain (1975)","Minerva Mills v. Union of India (1980)"],"answer":1,"why":"Kesavananda Bharati held that Parliament may amend any part of the Constitution but cannot damage its basic structure. Golaknath is the near-miss: it barred amendment of Fundamental Rights outright, and Kesavananda overruled it."},{"id":"geo-monsoon-1","topic":"geography-indian-monsoon-and-climate","q":"The withdrawal of the south-west monsoon from India begins in which region?","options":["Kerala and the southern peninsula","North-western India","The north-eastern states","The Konkan coast"],"answer":1,"why":"Retreat starts over north-west India in early September and moves south-east, the reverse of the onset, which begins over Kerala around 1 June."},{"id":"env-cbd-1","topic":"environment-cbd-cites-global-biodiversity","q":"The Nagoya Protocol, adopted in 2010, deals principally with which of the following?","options":["Liability and redress for damage from living modified organisms","Access to genetic resources and fair sharing of benefits from their use","Reduction of persistent organic pollutants","Trade in endangered species of wild fauna and flora"],"answer":1,"why":"Nagoya is the access-and-benefit-sharing protocol under the CBD. The first option describes the Nagoya–Kuala Lumpur Supplementary Protocol, which is the trap; the third is Stockholm and the fourth is CITES."},{"id":"pol-fundamental-rights-1","topic":"polity-fundamental-rights","q":"Which one of the following Fundamental Rights is available only to citizens of India?","options":["Equality before the law under Article 14","Freedom of speech and expression under Article 19","Protection of life and personal liberty under Article 21","Freedom of conscience and religion under Article 25"],"answer":1,"why":"Articles 14, 21 and 25 speak of 'any person' or 'all persons' and so extend to foreigners. Articles 15, 16, 19, 29 and 30 are the citizen-only set — Article 19 is the one usually tested."},{"id":"pol-anti-defection-1","topic":"polity-anti-defection","q":"Under the Tenth Schedule, who decides whether a member has incurred disqualification on the ground of defection?","options":["The President or the Governor, on the Election Commission's advice","The Speaker or Chairman of the House concerned","The Election Commission of India","The High Court of the State concerned"],"answer":1,"why":"The presiding officer decides. Kihoto Hollohan (1992) upheld that power but held the decision is a tribunal's and therefore open to judicial review — which is the distinction the question is really after."},{"id":"pol-emergency-1","topic":"polity-emergency-provisions","q":"President's Rule in a State is imposed under which Article of the Constitution?","options":["Article 352","Article 356","Article 360","Article 365"],"answer":1,"why":"356 is the proclamation. 352 is National Emergency and 360 is Financial Emergency. 365 is the trap: it makes failure to comply with a Union direction a ground on which 356 may be invoked, but it is not itself the provision for imposition."},{"id":"pol-constitutional-bodies-1","topic":"polity-constitutional-bodies","q":"Which one of the following is NOT a constitutional body?","options":["Union Public Service Commission","Finance Commission","NITI Aayog","Comptroller and Auditor General of India"],"answer":2,"why":"NITI Aayog was set up by an executive resolution in January 2015 — neither constitutional nor statutory. The others sit in Articles 315, 280 and 148. The Planning Commission it replaced was not a constitutional body either."},{"id":"geo-plate-tectonics-1","topic":"geography-earth-interior-and-plate-tectonics","q":"Which one of the following is an example of a divergent plate boundary?","options":["The Mid-Atlantic Ridge","The Himalayan mountain system","The San Andreas Fault","The Mariana Trench"],"answer":0,"why":"Sea-floor spreading along the Mid-Atlantic Ridge is the textbook divergent margin. The Himalayas are continental collision, the Mariana Trench is oceanic subduction, and San Andreas is transform — plates sliding past each other, neither made nor destroyed."},{"id":"geo-drainage-1","topic":"geography-indian-drainage-system","q":"Which of the following peninsular rivers flows westward through a rift valley?","options":["Godavari","Narmada","Krishna","Mahanadi"],"answer":1,"why":"The Narmada and the Tapi occupy rift valleys and drain west into the Arabian Sea. Because a rift valley confines the load, both form estuaries rather than deltas — the other three flow east and do build deltas."},{"id":"geo-pressure-winds-1","topic":"geography-pressure-belts-and-winds","q":"The equatorial belt of calms known as the doldrums corresponds to which pressure feature?","options":["The Inter-Tropical Convergence Zone","The subtropical high pressure belt","The sub-polar low pressure belt","The polar high pressure belt"],"answer":0,"why":"Doldrums are the ITCZ, where the trade winds converge and air rises. The horse latitudes are the near-identical trap: also a calm belt, but at roughly 30 degrees over the subtropical highs, where air descends instead."},{"id":"geo-oceanography-1","topic":"geography-oceanography","q":"Which cold ocean current flows along the western coast of South America?","options":["Benguela Current","Canary Current","Humboldt Current","Kuroshio Current"],"answer":2,"why":"Humboldt, or Peru, current — and the upwelling along it supports one of the world's great fisheries until El Nino suppresses it. Benguela and Canary are also cold but hug Africa; Kuroshio is warm, off Japan."},{"id":"env-ramsar-1","topic":"environment-ramsar-wetlands","q":"The Montreux Record is maintained under which of the following?","options":["The Ramsar Convention on Wetlands","The World Heritage Convention","The IUCN Red List assessment process","Appendix I of CITES"],"answer":0,"why":"It is the Ramsar register of listed wetlands where ecological character has changed, is changing or is likely to change. India's entries have included Keoladeo and Loktak. 'In Danger' lists belong to World Heritage — that is the confusion being tested."},{"id":"env-unfccc-1","topic":"environment-unfccc-paris-cop","q":"The principle of common but differentiated responsibilities was formally enshrined at which of the following?","options":["The Stockholm Conference, 1972","The Rio Earth Summit, 1992","The Kyoto Protocol, 1997","The Paris Agreement, 2015"],"answer":1,"why":"Rio 1992, in the Rio Declaration and the UNFCCC itself. Kyoto operationalised it through binding Annex I targets, and Paris restated it as CBDR-RC 'in the light of different national circumstances' — but the principle was already written by then."},{"id":"env-ozone-1","topic":"environment-ozone-montreal-protocol","q":"The Kigali Amendment to the Montreal Protocol provides for the phase-down of which substances?","options":["Chlorofluorocarbons","Hydrochlorofluorocarbons","Hydrofluorocarbons","Halons"],"answer":2,"why":"HFCs — and the point worth remembering is that they do not deplete ozone at all. They were adopted as substitutes for CFCs and HCFCs, then turned out to be powerful greenhouse gases, so an ozone treaty was extended to a climate purpose."},{"id":"env-protected-areas-1","topic":"environment-protected-areas-india","q":"With reference to the Wild Life (Protection) Act, 1972, which statement is correct?","options":["Grazing and human activity may be regulated but permitted in a Wildlife Sanctuary","A National Park may be created only by an Act of Parliament","Boundaries of a National Park may be altered by the Chief Wildlife Warden","A Wildlife Sanctuary cannot be upgraded to a National Park"],"answer":0,"why":"Sanctuaries admit regulated rights and grazing at the Chief Wildlife Warden's discretion; National Parks are the stricter category and extinguish them. Both are notified by the State Government, and boundary alteration needs a resolution of the State Legislature."},{"id":"his-mauryan-1","topic":"history-mauryan-empire","q":"The Maski and Gujarra minor rock edicts are significant because they","options":["record the Kalinga war in detail","mention Ashoka by his personal name","are written in the Kharoshthi script","were issued by Bindusara rather than Ashoka"],"answer":1,"why":"Most edicts call him only Devanampiya Piyadasi, 'the beloved of the gods'. Maski, Gujarra, Nettur and Udegolam give the name Ashoka, which is how the inscriptions were tied to the king of the literary tradition."},{"id":"his-revolt-1857-1","topic":"history-revolt-1857","q":"During the Revolt of 1857 the rebels at Delhi proclaimed as their sovereign","options":["Nana Sahib","Bahadur Shah II","Rani Lakshmibai","Kunwar Singh"],"answer":1,"why":"Bahadur Shah Zafar, the last Mughal, was proclaimed Shahenshah-e-Hindustan — a symbol rather than a commander. Nana Sahib led at Kanpur, Lakshmibai at Jhansi and Kunwar Singh in Bihar, each locally."},{"id":"his-gandhian-1","topic":"history-gandhian-mass-movements","q":"Gandhi's intervention at Champaran in 1917 was directed against","options":["the salt tax","the tinkathia system imposed on indigo cultivators","the enhancement of land revenue during a crop failure","wage cuts in the textile mills"],"answer":1,"why":"Tinkathia obliged tenants to plant indigo on three-twentieths of their holding for the European planters. The land-revenue option describes Kheda and the mill wages describe Ahmedabad — both also 1917-18, which is what makes them plausible."},{"id":"his-architecture-1","topic":"history-indian-architecture","q":"A temple whose sanctum is crowned by a stepped pyramidal tower of diminishing storeys belongs to which style?","options":["Nagara","Dravida","Vesara","Kalinga"],"answer":1,"why":"That tower is the vimana of the Dravida style, its storeys called talas, and the complex is walled with gopurams over the gateways. Nagara raises a curvilinear shikhara instead; Vesara blends the two in the Deccan."},{"id":"eco-monetary-policy-1","topic":"economics-monetary-policy","q":"In the event of a tie in the voting of the Monetary Policy Committee, the casting vote lies with","options":["the Union Finance Minister","the Governor of the Reserve Bank of India","the Deputy Governor in charge of monetary policy","the senior-most external member"],"answer":1,"why":"Six members — three from the RBI and three appointed by the Centre — and the Governor holds the second, casting vote. The Finance Minister has no vote at all; the government's representation is through the three external appointees."},{"id":"eco-gst-1","topic":"economics-taxation-and-gst","q":"A decision of the GST Council requires the support of what proportion of the weighted votes of members present and voting?","options":["A simple majority","Two-thirds","Three-fourths","Unanimity"],"answer":2,"why":"Three-fourths, with the Centre holding one-third of the weight and all States together two-thirds. So neither the Centre alone nor the States alone can carry a decision — the design is a mutual veto, not a majority."},{"id":"eco-inflation-1","topic":"economics-inflation","q":"Under India's flexible inflation targeting framework, the RBI's target is defined in terms of","options":["the Wholesale Price Index","the Consumer Price Index (Combined)","the GDP deflator","the Consumer Price Index for Industrial Workers"],"answer":1,"why":"CPI (Combined), at 4 per cent with a band of plus or minus 2. WPI carries no services at all and CPI-IW is used for dearness allowance — both are the standard distractors here."},{"id":"eco-bop-1","topic":"economics-external-sector-bop","q":"Which of the following is recorded in the current account of India's balance of payments?","options":["Foreign direct investment inflows","Foreign portfolio investment","Private remittances from Indians abroad","External commercial borrowings"],"answer":2,"why":"Remittances are secondary income and sit in the current account, alongside goods, services and primary income. FDI, FPI and ECBs are all financing flows and belong to the capital and financial account."},{"id":"sci-isro-1","topic":"scitech-isro-missions","q":"The Vikram lander of Chandrayaan-3 touched down in which region of the Moon?","options":["Close to the lunar equator","A high southern latitude near the south pole","The far side, never visible from Earth","The north polar region"],"answer":1,"why":"About 69 degrees south, between Manzinus C and Simpelius N, the site named Statio Shiv Shakti — the first landing at such a latitude. The far-side option describes China's Chang'e-4, which is the intended confusion."},{"id":"sci-nuclear-1","topic":"scitech-nuclear-energy-programme","q":"The third stage of India's nuclear power programme is based on","options":["natural uranium in pressurised heavy water reactors","plutonium-fuelled fast breeder reactors","thorium and uranium-233 in breeder reactors","enriched uranium in light water reactors"],"answer":2,"why":"Thorium-232 bred to uranium-233 — the point of the whole three-stage design, since India has large thorium reserves and little uranium. Stage one is the PHWR and stage two the fast breeder that makes the plutonium to get there."},{"id":"sci-dpi-1","topic":"scitech-digital-public-infrastructure","q":"The Unified Payments Interface is owned and operated by","options":["the Reserve Bank of India directly","the National Payments Corporation of India","the Securities and Exchange Board of India","the Institute for Development and Research in Banking Technology"],"answer":1,"why":"NPCI, an umbrella organisation set up by the RBI and the Indian Banks' Association but not the RBI itself. The RBI regulates it and licenses it as an authorised payment system operator, which is why the first option reads plausibly."},{"id":"sci-genomics-1","topic":"scitech-genomics-gene-editing","q":"In the CRISPR-Cas9 system, the function of the Cas9 protein is to","options":["cut the DNA double helix at the site specified by a guide RNA","transcribe the target gene into messenger RNA","repair the double-strand break once it has been made","add methyl groups to silence the promoter"],"answer":0,"why":"Cas9 is the nuclease — it makes the cut, and the guide RNA supplies the address. Repair is done afterwards by the cell's own machinery, and it is that repair, not Cas9, which determines whether a gene is knocked out or edited."},{"id":"sec-pmla-1","topic":"security-terror-financing-money-laundering","q":"Which agency is empowered to investigate offences of money laundering under the PMLA, 2002?","options":["The Central Bureau of Investigation","The Directorate of Enforcement","The National Investigation Agency","The Financial Intelligence Unit - India"],"answer":1,"why":"The Enforcement Directorate investigates and attaches property. FIU-IND is the trap: it receives and analyses suspicious transaction reports and passes them on, but it does not itself investigate or prosecute."},{"id":"sec-uapa-1","topic":"security-legal-framework","q":"The power to designate an individual — not merely an organisation — as a terrorist was introduced into the UAPA by the amendment of","options":["2004","2008","2013","2019"],"answer":3,"why":"The 2019 amendment added the Fourth Schedule for individuals. 2004 brought terrorist organisations in after POTA was repealed and 2008 tightened the law after the Mumbai attacks — both real amendments, which is what makes the dating hard."},{"id":"sec-certin-1","topic":"security-cyber-security-architecture","q":"CERT-In, the national nodal agency for computer security incidents, functions under","options":["the Ministry of Home Affairs","the Ministry of Electronics and Information Technology","the National Security Council Secretariat","the National Technical Research Organisation"],"answer":1,"why":"MeitY, under Section 70B of the IT Act. The NCIIPC, which protects critical information infrastructure, sits under NTRO instead — keeping the two apart is the usual difficulty."},{"id":"sec-borders-1","topic":"security-eastern-border-management","q":"India's longest land boundary is shared with","options":["China","Pakistan","Bangladesh","Nepal"],"answer":2,"why":"Bangladesh, at roughly 4,097 km across five States — longer than the boundary with China and about twice that with Pakistan. It is also the most riverine and densely settled, which is what makes fencing it so difficult."},{"id":"ir-quad-1","topic":"ir-quad-indo-pacific","q":"Which one of the following is NOT a member of the Quadrilateral Security Dialogue?","options":["Australia","Japan","Republic of Korea","United States"],"answer":2,"why":"The Quad is India, the United States, Japan and Australia. South Korea is a US treaty ally in the region and is periodically discussed as a partner, which is exactly why it reads like a member."},{"id":"ir-ndb-1","topic":"ir-brics","q":"The headquarters of the New Development Bank is located at","options":["Beijing","Shanghai","New Delhi","Johannesburg"],"answer":1,"why":"Shanghai, with the first regional centre in Johannesburg — which is the distractor. The NDB is the BRICS bank; the Asian Infrastructure Investment Bank, a separate institution, is the one headquartered in Beijing."},{"id":"ir-nathula-1","topic":"ir-india-china","q":"Nathu La, reopened for border trade in 2006, connects Tibet with which Indian State?","options":["Himachal Pradesh","Sikkim","Uttarakhand","Arunachal Pradesh"],"answer":1,"why":"Sikkim. Shipki La is in Himachal and Lipulekh in Uttarakhand — both also trade or pilgrimage passes, which is the difficulty. Bum La, in Arunachal, is a meeting point rather than a trade route."},{"id":"ir-g4-1","topic":"ir-un-reform","q":"Which one of the following is NOT a member of the G4 group seeking permanent seats on the UN Security Council?","options":["Brazil","Germany","Italy","Japan"],"answer":2,"why":"G4 is Brazil, Germany, India and Japan, each backing the others' claim. Italy leads Uniting for Consensus — the group formed precisely to oppose new permanent seats — so it is not a near-miss but the opposite camp."},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-1","topic":"polity-constitutional-evolution","q":"Consider the following statements regarding the Drafting Committee of the Constitution:\n1. It was constituted after independence.\n2. N. Gopalaswamy Ayyangar was the chairman of this committee.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-2","topic":"scitech-genomics-gene-editing","q":"With reference to Menkes disease, consider the following statements:\n1. It is a genetic disorder that affects the body's ability to absorb and distribute copper.\n2. It primarily leads to excessive accumulation of copper in vital organs like the liver and brain.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-3","topic":"polity-fundamental-rights","q":"With reference to the Fundamental Rights available in India, consider the following:\n1. Right to Privacy\n2. Protection against arrest and detention\n3. Right to freedom of speech and expression\nWhich of the above rights are available only to citizens?","options":["1 and 3 only","2 only","3 only","1, 2 and 3"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-4","topic":"polity-preamble-and-nature-of-state","q":"With reference to the Preamble of the Constitution of India, consider the following statements:\n1. It is based on the 'Objective Resolution' moved by Jawaharlal Nehru in 1946.\n2. It was enacted before the rest of the Constitution by the Constituent Assembly.\n3. It states that the Constitution derives its authority from the people of India.\nWhich of the statements given above is/are correct?","options":["1 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-5","topic":"polity-preamble-and-nature-of-state","q":"With reference to the Preamble of the Constitution of India, consider the following objectives:\n1. Political Justice\n2. Economic Liberty\n3. Equality of Status\n4. Unity and Integrity of the Nation\nHow many of the above objectives are stated in the Preamble?","options":["Only one","Only two","Only three","All four"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-6","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to laws enacted to implement the Directive Principles of State Policy, consider the following statements:\n1. 73rd Constitutional Amendment Act gives effect to Article 40.\n2. The Wildlife (Protection) Act, 1972 and the Forest (Conservation) Act, 1980, enactments give effect to Article 50.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-7","topic":"polity-emergency-provisions","q":"If the President of India exercises his power as provided under Article 359 of the Constitution, then","options":["the President can promulgate ordinance for any state.","the powers of High Courts are subsumed by the Supreme Court.","the President is empowered to suspend the enforcement of some Fundamental Rights.","he may extend National Emergency only to few parts of the country and not the entire country."],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-8","topic":"polity-transparency-accountability","q":"Who can become Chief Information Commissioner or Information Commissioners provided under the Right to Information, Act 2005?","options":["Persons of eminence in public life with wide knowledge and experience in science and technology.","Member of Parliament","Member of the Legislature of Union Territory","A person connected with any political party"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-9","topic":"polity-constitutional-evolution","q":"Consider the following statements regarding the Pitts India Act of 1784:\n1. It allowed the Court of Directors of East India Company to manage the political affairs in India.\n2. The Company's territories in India were for the first time called the 'British possessions in India'.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-10","topic":"environment-forest-laws-fra","q":"The term \"Paathara (or Khoni)\", often seen in the news, refers to a:","options":["traditional community-managed forest land system in parts of Northeast India","government scheme for afforestation under the Ministry of Environment","type of shifting cultivation practiced in hill regions of India","wildlife conservation programme for protecting endangered species"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-11","topic":"environment-fragile-ecosystems-eco-sensitive-zones","q":"Recently, the Kumbhalgarh Wildlife Sanctuary was declared an eco-sensitive zone. In this context, consider the following statements:\n1. It is located in the Aravalli hill ranges of Rajasthan.\n2. It is known for being one of the few protected areas in India where the Indian wolf is found.\n3. It forms part of the Gir landscape and is a key habitat for Asiatic lions.\nWhich of the statements given above is/are correct?","options":["1 and 2 only","2 and 3 only","1 only","1, 2 and 3"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-12","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to the Directive Principles of State Policy, consider the following:\n1. Article 38\n2. Article 40\n3. Article 39(b)\n4. Article 39(c)\nWhich of the above have been given precedence over Fundamental Rights under Articles 14 and 19?","options":["1 and 2 only","3 and 4 only","1, 3 and 4 only","2 and 4 only"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-13","topic":"polity-constitutional-evolution","q":"With reference to the Constituent Assembly of India, consider the following statements:\n1. It was a fully sovereign body that could frame any Constitution it deemed appropriate.\n2. It functioned as the first Parliament of independent India after the Constitution came into force.\n3. All members of the Assembly were indirectly elected.\nHow many of the above statements are correct?","options":["Only one","Only two","All three","None"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-14","topic":"scitech-isro-missions","q":"With reference to the PSLV-C62 mission launched by the Indian Space Research Organisation in January 2026, consider the following statements:\n1. The mission carried EOS-N1, an Earth observation satellite aimed at enhancing surveillance capabilities.\n2. It included multiple international and commercial satellite payloads along with the primary satellite.\n3. The mission was India's first human spaceflight mission under the Gaganyaan programme.\nWhich of the statements given above is/are correct?","options":["1 and 2 only","2 and 3 only","1 only","1, 2 and 3"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-15","topic":"polity-preamble-and-nature-of-state","q":"According to the Preamble of the Constitution, as adopted by the Constituent Assembly, how many of the following adjectives were used to define the Indian Republic?\n1. Socialist\n2. Sovereign\n3. Secular\n4. Democratic\nSelect the correct answer using the code given below.","options":["Only one","Only two","Only three","All four"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-16","topic":"polity-preamble-and-nature-of-state","q":"With reference to judicial interpretation of the Preamble of the Constitution of India, consider the following statements:\n1. In the Berubari Union Case (1960), the Supreme Court held that the Preamble is a source for interpreting the provisions of the Constitution.\n2. In the LIC of India Case (1995), the Supreme Court held that the Preamble is an integral part of the Constitution.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-17","topic":"security-legal-framework","q":"Recently, the National Investigation Agency (NIA) reported that it has achieved a conviction rate of more than 90%. In this context, under which of the following ministries does the NIA function?","options":["Ministry of Defence","Ministry of Home Affairs","Ministry of Law and Justice","Ministry of External Affairs"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-18","topic":"polity-constitutional-amendment","q":"With reference to constitutional amendments, consider the following provisions:\n1. Fundamental Rights\n2. Directive Principles of State Policy\n3. Election of the President and its manner\nWhich of the above can be amended by a special majority of Parliament without requiring ratification by States?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-19","topic":"polity-union-executive","q":"Consider the following statements regarding the Parliamentary form of government:\n1. The ministers operate on the principle of secrecy of procedure.\n2. A person who is not a member of the legislature cannot be appointed as a minister.\n3. The Prime Minister is the leader of the Council of Ministers.\nWhich of the statements given above is/are correct?","options":["1 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-20","topic":"economics-planning-and-niti-aayog","q":"Consider the following functionaries of NITI Aayog:\n1. Chairperson\n2. Vice-chairperson\n3. Special Invitees\n4. Chief Executive Officer\nWhich of the above are appointed by the Prime Minister?","options":["2, 3 and 4 only","1, 2 and 3 only","2 and 4 only","1, 3 and 4 only"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-21","topic":"polity-constitutional-evolution","q":"Consider the following statements regarding the Government of India Act of 1935:\n1. It provided for the establishment of an All-India Federation consisting of provinces and princely states as units.\n2. It introduced bicameralism in all the provinces.\n3. It introduced dyarchy at the Centre.\nWhich of the statements given above is/are correct?","options":["1 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-22","topic":"polity-constitutional-bodies","q":"With reference to Joint Public Service Commission (JPSC), consider the following statements:\n1. It can be created by President on the request of state legislatures concerned.\n2. Its members holds office for a term of six years or until they attain the age of 62 years, whichever is earlier.\n3. It presents its annual report to the President.\nWhich of the statement given above are not correct?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-23","topic":"polity-emergency-provisions","q":"With reference to the impact of a National Emergency on Fundamental Rights, consider the following statements:\n1. Article 19 is automatically suspended when a National Emergency is proclaimed on the grounds of armed rebellion.\n2. A presidential order suspending the enforcement of Fundamental Rights requires approval of Parliament.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-24","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to Fundamental Duties, consider the following statements:\n1. They can be implemented through appropriate legal provisions.\n2. They aid the courts in examining the constitutional validity of laws.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-25","topic":"polity-statutory-regulatory-bodies","q":"Which of the following issues can be taken up by the National Human Rights Commission (NHRC)?\n1. Issues of manual scavenging\n2. Problems faced by Notified and Denotified Tribes\n3. Issues related to the right to health\nSelect the correct answer using the codes given below.","options":["1 only","1 and 2 only","1, 2 and 3","3 only"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-26","topic":"polity-emergency-provisions","q":"Under Article 360 of the Constitution, the power to proclaim financial emergency is vested under","options":["Ministry of Finance","Parliament","President","Comptroller and Auditor General of India"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-27","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to judicial pronouncements on the relationship between Fundamental Rights and Directive Principles of State Policy, consider the following cases:\n1. Champakam Dorairajan vs State of Madras\n2. Minerva Mills vs Union of India\n3. Kesavananda Bharati vs State of Kerala\nIn which of the above cases did the Supreme Court describe the Constitution as being founded on a balance between Fundamental Rights and Directive Principles?","options":["1 only","2 only","2 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-28","topic":"polity-e-governance","q":"The \"LandStat\" dashboard and the \"Glossary of Revenue Terms\", recently seen in the news, are associated with which of the following initiatives of the Government of India?","options":["Pradhan Mantri Fasal Bima Yojana","National Rural Employment Guarantee Scheme","Digital India Land Records Modernization Programme (DILRMP)","SVAMITVA Scheme"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-29","topic":"polity-preamble-and-nature-of-state","q":"Consider the following statements:\n1. Article 1 describes India as a federation of states.\n2. Currently, India has 28 states and 8 union territories.\n3. The names of states and union territories and their territorial extent are mentioned in the third schedule of the Constitution.\n4. The consent of the concerned State Legislature is mandatory for altering its boundaries.\nHow many of the statements given above is/are correct?","options":["Only one","Only two","Only three","All four"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-30","topic":"polity-welfare-vulnerable-sections","q":"Swadesh Darshan 2.0, PRASHAD, and SASCI are initiatives of which of the following ministries?","options":["Ministry of Tourism","Ministry of Culture","Ministry of Finance","Ministry of External Affairs"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-31","topic":"environment-species-in-news-iucn","q":"With reference to Lepidagathis konkanensis, recently seen in the news, consider the following statements:\n1. It is a newly identified plant species endemic to the Konkan region of India.\n2. It belongs to the grass family (Poaceae) and is primarily found in desert ecosystems.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-32","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to the Directive Principles of State Policy, consider the following statements:\n1. Promoting cottage industries on an individual or cooperative basis in rural areas.\n2. Public assistance in cases of old age, sickness, and disablement, and right to work.\n3. Promoting the educational and economic interests of SCs, STs, and other weaker sections.\nWhich of the above are based on Gandhian ideology?","options":["1 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-33","topic":"economics-agri-marketing-msp","q":"With reference to the International Spice Conference (ISC) 2026, consider the following statements:\n1. It is organised by the Spices Board of India.\n2. It serves as a global platform for stakeholders involved in spice trade, sustainability, and value addition.\n3. It is conducted under the aegis of the Ministry of Agriculture and Farmers' Welfare.\nWhich of the statements given above is/are correct?","options":["1 and 2 only","2 and 3 only","1 only","1, 2 and 3"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-34","topic":"polity-federalism-centre-state","q":"Which of the following is essentially not a feature of a federal polity?","options":["Dual citizenship","Independent judiciary","Rigid Constitution","Bicameral legislature"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-35","topic":"polity-emergency-provisions","q":"Which of the following situations can be considered 'proper' for the imposition of President's Rule in a state?\n1. Maladministration in the state\n2. A government is deliberately acting against the Constitution.\n3. A constitutional direction of the Central government is disregarded by the state government\nSelect the correct answer using the code given below.","options":["3 only","1, 2 and 3","1 and 2 only","1 and 3 only"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-36","topic":"polity-preamble-and-nature-of-state","q":"Which of the following is/are the functions of a constitution in a democratic country?\n1. It checks the power of the government.\n2. It acts as an instrument of political self-determination.\n3. It guarantees absolute and unrestricted rights to citizens.\nSelect the correct answer using the code given below.","options":["1 only","1 and 2 only","1 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-37","topic":"polity-panchayati-raj","q":"With reference to State Election Commission, consider the following statements:\n1. It has been empowered to conduct elections to panchayats through 73rd Constitutional amendment.\n2. The functions of delimitation, reservation and rotation of Panchayats seats is vested in State Election Commission.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-38","topic":"polity-preamble-and-nature-of-state","q":"Consider the following words in the Preamble of the Indian Constitution:\n1. Dignity\n2. Unity\n3. Secular\nWhich of the above words were introduced by the 42nd Constitutional Amendment Act, 1976?","options":["2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-39","topic":"polity-statutory-regulatory-bodies","q":"Consider the following statements:\n1. Chairpersons of the National Human Rights Commission (NHRC) and State Human Rights Commission (SHRC) are appointed by the President of India.\n2. Only the President of India can remove the chairpersons of NHRC and SHRC.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-40","topic":"polity-emergency-provisions","q":"Consider the following statements.\n1. Revocation of President's rule in a state requires parliamentary approval.\n2. 44th Amendment Act of 1978 restrained the power of Parliament to extend a proclamation of President's Rule.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-41","topic":"environment-marine-coastal-ecosystems","q":"With reference to Sagar Island, consider the following statements:\n1. It is located at the mouth of the Hooghly River in the Bay of Bengal.\n2. It is known for hosting the annual Gangasagar Mela, one of the largest religious gatherings in India.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-42","topic":"polity-federalism-centre-state","q":"A new state can be formed by uniting two or more states through a bill passed by:","options":["A simple majority in Parliament","A simple majority in state assemblies of both the states","A Special majority in the parliament and ratification by half of the states","Presidential resolution"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-43","topic":"polity-statutory-regulatory-bodies","q":"Consider the following pairs:\nCommission/Body : Falls under\n1. National Commission for Minorities : Ministry of Social Justice & Empowerment\n2. National Commission for Women : Ministry of Women and Child Development\n3. National Commission for STs : Ministry of Tribal Affairs\nWhich of the pairs given above is/are correctly matched?","options":["3 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-44","topic":"economics-msme-and-startups","q":"Which of the following institutions recently released the report titled \"Achieving Efficiencies in MSME Sector through Convergence of Schemes\"?","options":["Reserve Bank of India","Small Industries Development Bank of India","NITI Aayog","Ministry of Micro, Small and Medium Enterprises"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-45","topic":"environment-waste-management","q":"The term 'Plasticosis', recently seen in environmental studies, refers to:","options":["the process of turning plastic waste into paving tiles.","a specialized bacteria that can digest plastic in the deep ocean.","the accumulation of microplastics in the leaves of agricultural crops.","a fibrotic disease in seabirds caused by the ingestion of small plastic fragments."],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-46","topic":"polity-statutory-regulatory-bodies","q":"Consider the following statements with respect to the National Commission on Minorities:\n1. It has been established by an act of Parliament.\n2. It has all the powers of a civil court while trying a suit related to complaints regarding deprivation of rights of minorities.\n3. It is required to make periodical reports to President on matters pertaining to minorities.\nWhich of the statements given above is/are correct?","options":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-47","topic":"polity-constitutional-evolution","q":"Who among the following first put forward the idea of the Constituent Assembly for India?","options":["B. R. Ambedkar","Subhas Chandra Bose","Bal Gangadhar Tilak","M.N. Roy"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-48","topic":"polity-constitutional-evolution","q":"In the context Constituent Assembly of India, consider the following pairs:\nCommittee : Chairman\n1. Union Powers Committee : Jawaharlal Nehru\n2. Steering Committee : Sardar Patel\n3. Provincial Constitution Committee : Dr. Rajendra Prasad\nWhich of the pairs given above is/are correctly matched?","options":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-49","topic":"polity-preamble-and-nature-of-state","q":"Which of the following best describes the concept of Constitutionalism?","options":["It is an ideology which promotes supremacy of a written Constitution.","It means the Constitution is necessary in a democratic country.","It denotes the principle that the government derives its authority from a body of fundamental law and is limited by it.","It means that the Constitution must provide certain inalienable rights to the citizens."],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-50","topic":"history-towards-independence-and-partition","q":"How many of the following were members of the Interim Government formed in 1946?\n1. Liaquat Ali Khan\n2. Sardar Patel\n3. Dr. John Mathai\nSelect the correct answer using the code given below.","options":["Only one","Only two","All three","None"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-51","topic":"polity-parliament","q":"Consider the following statements regarding the differences between the Indian and British polity:\n1. The Indian system is based on the doctrine of the sovereignty of Parliament, while Parliament is not supreme in Britain.\n2. In Britain, the Prime Minister must be a member of the lower house of Parliament (House of Commons).\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-52","topic":"polity-citizenship","q":"With reference to Overseas Citizen of India (OCI) cardholders, consider the following statements:\n1. They are entitled to long-term visa and free travel and stay in India.\n2. They are eligible to appear in all-India entrance examinations such as NEET and JEE.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-53","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to Directive Principles of State Policy, consider the following:\n1. To provide free legal aid to the poor.\n2. To protect and improve the environment and to safeguard forests and wildlife.\n3. To minimise inequalities in income, status, facilities, and opportunities.\nWhich of the above were added through constitutional amendments?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-54","topic":"polity-elections-and-reforms","q":"Who among the following are not members of the Selection Committee for the Chief Election Commissioner (CEC) and Election Commissioners (ECs) in India?\n1. Prime Minister of India\n2. Leader of Opposition in the Lok Sabha\n3. Chief Justice of India\n4. Leader of Opposition of the Rajya Sabha\nSelect the correct answer using the code given below.","options":["2 and 4 only","2 and 3 only","3 and 4 only","1 and 2 only"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-55","topic":"polity-emergency-provisions","q":"Consider the following statements:\n1. Since Independence, India has had a national emergency only once.\n2. Since Independence, India has never faced a financial emergency.\n3. President's Rule was imposed for the first time in Punjab in 1951.\nHow many of the above statements are correct?","options":["Only one","Only two","All three","None"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-56","topic":"polity-elections-and-reforms","q":"In the context of direct democracy, consider the following pairs:\nDevice : Description\n1. Referendum : Procedure whereby proposed legislation is referred to the electorate for settlement by their direct votes\n2. Recall : Method of obtaining the opinion of people on any issue of public importance\n3. Plebiscite : Method by means of which the voters can remove a representative before the expiry of his term\nWhich of the pairs given above is/are correctly matched?","options":["1 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-57","topic":"economics-survey-and-current-trends","q":"The Sukhatme National Award in Statistics is conferred by which of the following?","options":["Ministry of Statistics and Programme Implementation","Indian Society of Agricultural Statistics","NITI Aayog","Indian Statistical Institute"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-58","topic":"polity-statutory-regulatory-bodies","q":"With reference to the Central Vigilance Commission, consider the following statements:\n1. It is a constitutional body.\n2. Its Chairman and members are appointed by the President.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-59","topic":"polity-constitutional-bodies","q":"Consider the following statements regarding 'State Public Service Commission':\n1. One-half of the members of the commission should be persons from SC/ST and OBCs.\n2. Members of the SPSC can be removed by the Governor of the respective state.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-60","topic":"polity-fundamental-rights","q":"With reference to the Fundamental Rights of members of the armed forces, consider the following statements:\n1. Parliament can restrict but cannot abrogate their Fundamental Rights.\n2. The term 'members of the armed forces' also includes employees such as mechanics and cooks who are non-combatants.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-61","topic":"polity-fundamental-rights","q":"With reference to the Right to Freedom of Religion, consider the following statements:\n1. It covers only religious beliefs and not religious practices or rituals.\n2. No religious instruction shall be provided in any educational institution administered by the State.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-62","topic":"economics-planning-and-niti-aayog","q":"'Team India Wing' of the NITI Aayog comprises of:","options":["Prime Minister and the Chief Executive Officer","representatives from every state and central ministries.","top notch domain experts, specialists and scholars.","young scholars and student interns working with NITI Aayog."],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-63","topic":"polity-federalism-centre-state","q":"With reference to the settlement of a border dispute without ceding any Indian territory, consider the following statements:\n1. It can be effected through a law passed by the Parliament with a simple majority.\n2. It does not require a constitutional amendment.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-64","topic":"polity-constitutional-evolution","q":"In the context of the historical underpinnings of the Indian constitution, which of the following Acts introduced ordinances for the first time?","options":["Charter Act, 1833","Indian Councils Act of 1892","Indian Councils Act of 1861","Government of India Act of 1909"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-65","topic":"polity-basic-structure","q":"Which of the following has defined what constitutes the 'Doctrine of Basic Structure'?","options":["Parliament","Supreme Court","Constitution of India","None of the above"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-66","topic":"polity-federalism-centre-state","q":"Consider the following statements regarding the reorganization of the states:\n1. An Indian territory can be ceded to a foreign country by a constitutional amendment.\n2. A boundary dispute settlement between India and another country does not require a constitutional amendment.\nWhich of the statements given above is/are not correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-67","topic":"polity-constitutional-bodies","q":"With reference to the Special Officer for Linguistic Minorities, consider the following statements:\n1. It was constituted under Article 350-B of the Indian Constitution.\n2. It can investigate all matters relating to the safeguards provided for both linguistic and religious minorities under the Constitution.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-68","topic":"history-performing-arts","q":"Who is Alyssa Healy, often seen in the news?","options":["Australian cricketer and former captain of the women's national team","British tennis player associated with Wimbledon championships","American swimmer and Olympic gold medallist","New Zealand's footballer playing in international leagues"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-69","topic":"security-forces-and-agencies","q":"The Indian Army recently conducted Exercise 'Sanjha Shakti', a joint Military-Civil Fusion exercise. In this context, consider the following statements:\n1. The exercise aims to enhance coordination between military forces and civil administration during disaster response and crisis situations.\n2. It is conducted exclusively as a bilateral military exercise between India and a foreign country.\n3. It focuses on improving synergy in areas such as humanitarian assistance, disaster relief, and internal security management.\nWhich of the statements given above are correct?","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-70","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to Fundamental Duties under Part IVA of the Constitution of India, consider the following:\n1. To abide by the Constitution and respect its ideals and institutions\n2. To protect and improve the rivers and wildlife\n3. To promote the spirit of common brotherhood among all the people of India\nWhich of the above are Fundamental Duties?","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-71","topic":"polity-preamble-and-nature-of-state","q":"Consider the following statements regarding the expression 'Union of States' under Article 1:\n1. All the states and union territories are part of the expression 'Union of States'.\n2. A Union territory enjoys a similar relationship as states with the Union government.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-72","topic":"polity-constitutional-amendment","q":"With reference to the amendment of the Constitution under Article 368, consider the following statements:\n1. The amendment bill cannot be introduced by a private member.\n2. There is no provision for a joint sitting in case of disagreement between the Houses.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-73","topic":"polity-right-to-privacy-and-new-rights","q":"With reference to judicial interpretation of Article 21, consider the following:\n1. Right to travel abroad\n2. Right to reputation\n3. Right against public hanging\nWhich of the above rights have been derived from Article 21?","options":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-74","topic":"polity-citizenship","q":"With reference to citizenship provisions in India, consider the following statements:\n1. Only a citizen by birth is eligible for the office of the President of India.\n2. Indian citizenship is required to contest elections to Parliament and State Legislatures.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-75","topic":"polity-constitutional-bodies","q":"Which of the following functions is/are performed by the National Commission for Scheduled Tribes?\n1. To suggest measures to be taken over conferring ownership rights in respect of minor forest produce to STs living in forest areas.\n2. To inquire into specific complaints with respect to the deprivation of rights and safeguards of the STs.\n3. To suggest measures to be taken to ensure full implementation of the provisions of Panchayats (Extension to the Scheduled Areas) Act, 1996.\nSelect the correct answer using the code given below.","options":["2 only","1 and 3 only","1 and 2 only","1, 2 and 3"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-76","topic":"polity-union-executive","q":"How many of the following may be considered as the merits of the Presidential System?\n1. Wide representation\n2. Stable government\n3. Based on the separation of powers\n4. Responsible government\nSelect the correct answer using the code given below.","options":["Only one","Only two","Only three","All four"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-77","topic":"polity-dpsp-and-fundamental-duties","q":"With reference to Fundamental Duties, consider the following statements:\n1. They are inspired by the Constitution of the erstwhile USSR.\n2. The Constitution is silent regarding their enforcement.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-78","topic":"polity-panchayati-raj","q":"How many of the following institutions/bodies are established by the states as per the provisions of the 73rd Constitutional Amendment Act 1992?\n1. State Public Service Commission\n2. State Election Commission\n3. State Finance Commission\nSelect the correct answer using the code given below.","options":["Only one","Only two","All three","None"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-79","topic":"polity-constitutional-evolution","q":"In the context of evolution of Indian constitution, which of the following Acts, for the first time, separated provincial budgets from the Central budget and authorized the provincial legislatures to enact their budgets?","options":["Indian Councils Act of 1909","Government of India Act of 1919","Indian Councils Act of 1861","Government of India Act of 1935"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-80","topic":"history-towards-independence-and-partition","q":"Which of the following statements is/are correct with regard to the India Independence Act, 1947?\n1. It abolished the office of the Governor-General in India.\n2. Though it declared India to be independent, it did not proclaim the lapse of British Paramountcy over Indian Princely states.\nSelect the correct answer using the code given below.","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-81","topic":"environment-flagship-species-projects","q":"The '23 for 23 Initiative', recently seen in the news, is related to which of the following species?","options":["Snow Leopard","Lion","Nilgiri Thar","Great Indian Bustard"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-82","topic":"polity-federalism-centre-state","q":"The Indian form of government is described as a federation with a centralizing tendency. Which among the following provisions of the Constitution supports this tendency?\n1. A single and flexible constitution\n2. Provision of All India Services\n3. Single citizenship for the entire country\nSelect the correct answer using the code given below.","options":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-83","topic":"polity-e-governance","q":"The \"Payment and Security on Land Tax and Revenue\" (P-SLRT) programme, aimed at digitisation of land records and improving transparency in land revenue systems, is implemented under which of the following schemes of the Government of India?","options":["Digital India Programme","Digital India Land Records Modernization Programme (DILRMP)","Pradhan Mantri Awas Yojana","National Rural Livelihood Mission"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-84","topic":"history-integration-and-state-reorganisation","q":"Consider the following events:\n1. Goa was conferred full statehood\n2. Creation of the state of Haryana\n3. Inclusion of the state of Sikkim in the Indian Union\n4. Formation of the state of Nagaland\nArrange the above given events in the correct chronological order of their occurrence.","options":["1-3-4-2","4-2-3-1","2-4-1-3","1-2-3-4"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-85","topic":"polity-federalism-centre-state","q":"Which of the following countries have a federal system of government?\n1. India\n2. United Kingdom\n3. Brazil\n4. Mexico\nSelect the correct answer using the code given below.","options":["1, 2 and 3 only","1, 3 and 4 only","2 and 4 only","1 and 3 only"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-86","topic":"scitech-telecom-5g-6g","q":"Recently, Bharat Sanchar Nigam Limited (BSNL) launched Voice-over Wi-Fi (VoWiFi) services across India. In this context, consider the following statements:\n1. VoWiFi allows users to make voice calls over a Wi-Fi network using their existing mobile number without requiring third-party applications.\n2. VoWiFi services operate independently of telecom operators and rely solely on internet-based platforms.\n3. VoWiFi supports seamless switching between Wi-Fi and cellular networks during an ongoing call.\nWhich of the statements given above is/are correct?","options":["1 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-87","topic":"polity-constitutional-evolution","q":"Arrange the following events of the Constituent Assembly in the correct chronological sequence:\n1. Adoption of the Objectives Resolution\n2. Adoption of the National flag.\n3. Adoption of the National Anthem\nSelect the correct answer using the code given below.","options":["1-2-3","2-1-3","3-1-2","3-2-1"],"answer":0,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-88","topic":"polity-constitutional-evolution","q":"Which of
