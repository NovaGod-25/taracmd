t the correct answer using the code given below.","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-95","topic":"polity-citizenship","q":"With reference to the citizenship provisions in the original Constitution of India, consider the following:\n1. Modes of acquiring citizenship after the commencement of the Constitution\n2. Registration of persons of Indian origin residing outside India\n3. Grant of citizenship to persons migrated from Pakistan\nWhich of the above were provided in the original Constitution?","options":["1 and 2 only","2 and 3 only","3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-96","topic":"history-integration-and-state-reorganisation","q":"Consider the following statements with reference to the post-independence reorganization of states:\n1. The States Reorganisation Commission accepted the theory of 'one language one state'.\n2. Andhra Pradesh was the first state created after the acceptance of the recommendations of the state reorganization committee.\nWhich of the statements given above is/are correct?","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":3,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-97","topic":"polity-constitutional-bodies","q":"With reference to UPSC, which of the following statements is/are correct?\n1. It is mandated with the classification of services and cadre management of selected candidates.\n2. It presents its annual performance report to the Parliament.\n3. Its jurisdiction can be extended by an act made by the Parliament.\nSelect the correct answer using the code given below.","options":["1 and 2 only","2 and 3 only","3 only","None"],"answer":2,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"vision-ias-prelims-test-series-2027-test-01-15601-2027-98","topic":"polity-emergency-provisions","q":"If a National Emergency is declared on the ground of armed rebellion:\n1. Fundamental Rights under Article 19 are automatically suspended.\n2. President can suspend the right to move the Court for the enforcement of fundamental rights.\n3. the enforcement of the fundamental rights guaranteed by Articles 21 and 22 cannot be suspended.\nWhich of the statements given above is/are correct?","options":["1 and 3 only","2 only","2 and 3 only","1, 2 and 3"],"answer":1,"source":{"name":"Vision IAS","test":"Prelims Test Series 2027, Test 01 (15601)","year":2027}},{"id":"csp23-gs1-b-1","topic":"history-buddhism-jainism-heterodox-sects","q":"In which one of the following regions was Dhanyakataka, which flourished as a prominent Buddhist centre under the Mahasanghikas, located?","options":["Andhra","Gandhara","Kalinga","Magadha"],"answer":0,"paper":{"year":2023,"code":"gs1","set":"B","n":1}},{"id":"csp23-gs1-b-2","topic":"history-indian-architecture","q":"With reference to ancient India, consider the following statements : 1. The concept of Stupa is Buddhist in origin. 2. Stupa was generally a repository of relics. 3. Stupa was a votive and commemorative structure in Buddhist tradition. How many of the statements given above are correct?","options":["Only one","Only two","All three","None"],"answer":1,"paper":{"year":2023,"code":"gs1","set":"B","n":2}},{"id":"csp23-gs1-b-3","topic":"history-sangam-age","q":"With reference to ancient South India, Korkai, Poompuhar and Muchiri were well known as","options":["capital cities","ports","centres of iron-and-steel making","shrines of Jain Tirthankaras"],"answer":1,"paper":{"year":2023,"code":"gs1","set":"B","n":3}},{"id":"csp23-gs1-b-4","topic":"history-sangam-age","q":"Which one of the following explains the practice of Vattakirutal' as mentioned in Sangam poems?","options":["Kings employing women bodyguards.","Learned persons assembling in royal courts to discuss religious and philosophical matters","Young girls keeping watch over agricultural fields and driving away birds and animals","A king defeated in a battle committing ritual suicide by starving himself to death"],"answer":3,"paper":{"year":2023,"code":"gs1","set":"B","n":4}},{"id":"csp23-gs1-b-5","topic":"history-early-medieval-kingdoms","q":"Consider the following dynasties: 1. Hoysala 2. Gahadavala 3. Kakatiya 4. Yadava How many of the above dynasties established their kingdoms in early eighth century AD?","options":["Only one","Only two","Only three","None"],"answer":3,"paper":{"year":2023,"code":"gs1","set":"B","n":5}},{"id":"csp23-gs1-b-6","topic":"history-philosophy-religion-and-literature","q":"With reference to ancient Indian History, consider the following pairs: Literary work Author 1. Devichandragupta : Bilhana 2. Hammira-Mahakavya : Nayachandra Suri 3. Milinda-panha : Nagarjuna 4. Nitivakyamrita : Somadeva Suri How many of the above pairs are correctly matched?","options":["Only one","Only two","Only three","All four"],"answer":1,"paper":{"year":2023,"code":"gs1","set":"B","n":6}},{"id":"csp23-gs1-b-7","topic":"history-buddhism-jainism-heterodox-sects","q":"\"Souls are not only the property of animal and plant life, but also of rocks, running water and many other natural objects not looked on as living by other religious sects.\" The above statement reflects one of the core beliefs of which one of the following religious sects of ancient India?","options":["Buddhism","Jainism","Shaivism","Vaishnavism"],"answer":1,"paper":{"year":2023,"code":"gs1","set":"B","n":7}},{"id":"csp23-gs1-b-8","topic":"history-vijayanagara-and-bahmani","q":"Who among the following rulers of Vijayanagara Empire constructed a large dam across Tungabhadra River and canal- cum-aqueduct several a kilometres long from the river to the capital city?","options":["Devaraya I","Mallikarjuna","Vira Vijaya","Virupaksha"],"answer":0,"paper":{"year":2023,"code":"gs1","set":"B","n":8}},{"id":"csp23-gs1-b-9","topic":"history-advent-of-europeans-and-british-rule","q":"Who among the following rulers of medieval Gujarat surrendered Diu to Portuguese?","options":["Ahmad Shah","Mahmud Begarha","Bahadur Shah","Muhammad Shah"],"answer":2,"paper":{"year":2023,"code":"gs1","set":"B","n":9}},{"id":"csp23-gs1-b-10","topic":"polity-constitutional-evolution","q":"By which one of the following Acts was the Governor General of Bengal designated as the Governor General of India?","options":["The Regulating Act","The Pitt's India Act","The Charter Act of 1793","The Charter Act of 1833"],"answer":3,"paper":{"year":2023,"code":"gs1","set":"B","n":10}},{"id":"csp23-gs1-b-11","topic":"polity-fundamental-rights","q":"In essence, what does Due Process of Law' mean?","options":["The principle of natural justice","The procedure established by law","Fair application of law","Equality before law"],"answer":0,"paper":{"year":2023,"code":"gs1","set":"B","n":11}},{"id":"csp23-gs1-b-12","topic":"polity-federalism-centre-state","q":"Consider the following statements: Statement-I: In India, prisons are managed by State Governments with their own rules and regulations for the day-to-day administration of prisons. Statement-II: In India, prisons are governed by the Prisons Act, 1894 which expressly kept the subject of prisons in the control of Provincial Governments. Which one of the following is correct in respect of the above statements?","options":["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-I","Statement-I is correct but Statement-II is incorrect","Statement-I is incorrect but Statement-II is correct"],"answer":0,"paper":{"year":2023,"code":"gs1","set":"B","n":12}},{"id":"csp23-gs1-b-13","topic":"polity-preamble-and-nature-of-state","q":"Which one of the following statements best reflects the Chief purpose of the 'Constitution' of a country?","options":["It determines the objective for the making of necessary laws.","It enables the creation of political offices and a government.","It defines and limits the powers of government.","It secures social justice, social equality and social security."],"answer":2,"paper":{"year":2023,"code":"gs1","set":"B","n":13}},{"id":"csp23-gs1-b-15","topic":"polity-constitutional-bodies","q":"Consider the following organizations/bodies in India: 1. The National Commission for Backward Classes 2. The National Human Rights Commission 3. The National Law Commission 4. The National Consumer Disputes Redressal Commission How many of the above constitutional bodies?","options":["Only one","Only two","Only three","All four"],"answer":0,"paper":{"year":2023,"code":"gs1","set":"B","n":15}},{"id":"csp23-gs1-b-16","topic":"polity-union-executive","q":"Consider the following statements: 1. If the election of the President of India is declared void by the Supreme Court of India, all acts done by him/her in the performance of duties of his/her office of President before the date of decision become invalid. 2. Election for the post of the President of India can be postponed on the ground that some Legislative Assemblies have been dissolved and elections are yet to take place. 3. When a Bill is presented to the President of India, the Constitution prescribes time limits within which he/she has to declare his/her assent. How many of the above statements are correct?","options":["Only one","Only two","All three","None"],"answer":3,"paper":{"year":2023,"code":"gs1","set":"B","n":16}},{"id":"csp23-gs1-b-17","topic":"polity-parliament","q":"With reference to Finance Bill and Money Bill in the Indian Parliament, consider the following statements: 1. When the Lok Sabha transmits Finance Bill to the Rajya Sabha, it can amend or reject the Bill. 2. When the Lok Sabha transmits Money Bill to the Rajya Sabha, it cannot amend or reject the Bill, it can only make recommendations. 3. In the case of disagreement between the Lok Sabha and the Rajya Sabha, there is no joint sitting for Money Bill, but a joint sitting becomes necessary for Finance Bill. How many of the above statements are correct?","options":["Only one","Only two","All three","None"],"answer":1,"paper":{"year":2023,"code":"gs1","set":"B","n":17}},{"id":"csp23-gs1-b-18","topic":"environment-biosphere-reserves-community-conservation","q":"Consider the following statements: Once the Central Government notifies an area as a 'Community Reserve' 1. the Chief Wildlife Warden of the State becomes the governing authority of such forest 2. hunting is not allowed in such area 3. people of such area are allowed to collect non-timber forest produce 4. people of such area are allowed traditional agricultural practices How many of the above statements are correct?","options":["Only one","Only two","Only three","All four"],"answer":1,"paper":{"year":2023,"code":"gs1","set":"B","n":18}},{"id":"csp23-gs1-b-19","topic":"polity-special-provisions-schedules","q":"With reference to Scheduled Areas in India, consider the following statements: 1. Within a State, the notification of an area as Scheduled Area takes place through an Order of the President. 2. The largest administrative unit forming the Scheduled Area is the District and the lowest is the cluster of villages in the Block. 3. The Chief Ministers of the concerned States are required to submit annual reports to the Union Home Ministry on the administration of Scheduled Areas in the States. How many of the above statements are correct?","options":["Only one","Only two","All three","None"],"answer":1,"paper":{"year":2023,"code":"gs1","set":"B","n":19}},{"id":"csp23-gs1-b-20","topic":"polity-welfare-vulnerable-sections","q":"Consider the following statements: Statement-I: The Supreme Court of India has held in some judgements that the reservation policies made under Article 16(4) of the Constitution of India would be limited by Article 335 for maintenance of efficiency of administration. Statement-II: Article 335 of the Constitution of India defines the term 'efficiency of administration'. Which one of the following is correct in respect of the above statements?","options":["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-1","Statement-I is correct but Statement-II is incorrect","Statement-I is incorrect but Statement-II is correct"],"answer":2,"paper":{"year":2023,"code":"gs1","set":"B","n":20}},{"id":"csp23-gs1-b-21","topic":"scitech-nuclear-energy-programme","q":"Consider the following statements: Statement-I: India, despite having uranium deposits, depends on coal for most its electricity production. Statement-II: Uranium, enriched to the extent at of least 60%, is required for the production of electricity. Which one of the following is correct in respect of the above statements?","options":["Both Statement-I and Statement-II are correct and Statement-II is the correct explanation for Statement-I","Both Statement-I and Statement-II are correct and Statement-II is not the correct explanation for Statement-1","Statement-I is correct but Statement-II is incorrect","Statement-I is incorrect but Statement-II is correct"],"answer":2,"paper":{"year":2023,"code":"gs1","set":"B","n":21}},{"id":"csp23-gs1-b-22","topic":"environment-species-in-news-iucn","q":"Consider the following statements: Statement-1: Marsupials are not naturally found in India. Statement-II: Marsupials can thrive only in montane grasslands with no predators. Which one of the following is correct in respect of the above statements?","options":["Both Statement-I a y-parliament","q":"Which of the following is/are the exclusive power(s) of Lok Sabha ? 1.‘ To ratify the declaration of Emergency 2. To pass a motion of no-confidence against the Council of Ministers 3. To impeach the President of India Select the correct answer using the code given below :","options":["land2","2 only","land3","3 only"],"answer":1,"paper":{"year":2022,"code":"gs1","set":"A","n":15}},{"id":"csp22-gs1-a-16","topic":"polity-anti-defection","q":"With reference to anti-defection law in India, consider the following statements : 1. The law specifies that a nominated legislator cannot join any political party within six months of being appointed to the House. 2. The law does not provide any time-frame within which the presiding officer has to decide a defection case. Which of the statements given above is/are","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":1,"paper":{"year":2022,"code":"gs1","set":"A","n":16}},{"id":"csp22-gs1-a-17","topic":"polity-constitutional-bodies","q":"Consider the following statements : 1. Attorney General of India and Solicitor General of India are the only officers of the Government who are allowed to participate in the meetings of the Parliament of India. 2. According to the Constitution of India, the Attorney General of India submits his resignation when the Government which appointed him resigns. Which of the statements given above is/are","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":3,"paper":{"year":2022,"code":"gs1","set":"A","n":17}},{"id":"csp22-gs1-a-18","topic":"polity-judicial-review-activism","q":"With reference to the writs issued by the Courts in India, consider the following statements : 1. Mandamus will not lie against a private * organisation unless it is entrusted with a public duty. 2. Mandamus will not lie against a Company even though it may be a Government Company. 3. Any public minded person can be a petitioner to move the Court to obtain the writ of Quo W const DAILY = {"note":"Daily current-affairs quizzes. The app derives each day's URL from the date and links out — it does not copy the questions in. They are the publisher's editorial product, and the same reasoning that keeps toppers' booklets on their own sites applies here. `url` is expanded at runtime with {yyyy} {mm} {dd} {d} {month}: {dd} is zero-padded, {d} is not, {month} is the lowercase full month name.","sources":[{"id":"insights","name":"InsightsOnIndia","url":"https://www.insightsonindia.com/{yyyy}/{mm}/{dd}/upsc-current-affairs-quiz-{d}-{month}-{yyyy}-daily-prelims-quiz/","index":"https://www.insightsonindia.com/current-affairs-quiz/","questions":5,"skips":[0],"note":"Five questions, published most mornings. Nothing on Sundays, and the day's set can go up late — if the link misses, the index has it."}]};

/* ---------------- storage (best effort) ---------------- */
/* The key never changes: it is the only thing standing between a returning
   visitor and an empty app. Every field added since is additive and defaulted
   below, so a store written by an older build still loads. */
const KEY = "taracmd-v1";
const BLANK = {
  done:     {},   // topic id  -> [subtopic indices ticked]
  theme:    null, // "dark" | "light" | null for system
  attempts: {},   // "year-paper-set" -> {question: letter}   OMR sheets
  revised:  {},   // topic id  -> [epoch ms]                  revision history
  picks:    {},   // question id -> option index              practice answers
  writing:  {},   // "year-code" -> [{q,mins,words,score,of,note,on}]  Mains log
  daily:    {},   // "YYYY-MM-DD" -> {score,of,src}           daily quiz log
  focus:    [],   // [{on,mins,ran,kind,left}]                focus sessions
  focusRun: null, // the session in flight, so a reload cannot lose the clock
  seen:     {}    // "year-paper-set" -> {question: 1}       questions looked at
};
let store = Object.assign({}, BLANK);
try{ const r = localStorage.getItem(KEY); if(r) store = Object.assign(store, JSON.parse(r)); }catch(e){}
for(const k in BLANK){ if(store[k] === undefined || store[k] === null) store[k] = BLANK[k]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* Native bridge — present only inside the Android shell. Lets a single copy
   be saved to the app's own folder and reopened offline. Absent on the web,
   where the browser's own download handles it. */
const NATIVE = (typeof AndroidHost !== "undefined") ? AndroidHost : null;
function savedPath(url){
  if(!NATIVE) return null;
  try{ return NATIVE.savedPath(url) || null; }catch(e){ return null; }
}
const doneSet = id => new Set(store.done[id] || []);
function toggleSub(tid, i, total){
  const s = doneSet(tid);
  s.has(i) ? s.delete(i) : s.add(i);
  store.done[tid] = [...s];
  if(!store.done[tid].length) delete store.done[tid];
  /* Finishing a topic is itself a revision — and it is the only moment we can
     honestly timestamp, which is what starts the decay clock below. */
  if(total && s.size === total && !revisions(tid).length) markRevised(tid);
  else save();
}

/* ---------------- revision decay ----------------
   A tick says you have read something once. It does not say you still know it
   nine months later, and nine months is the shape of this exam. So each topic
   also carries the dates it was revised, and falls due again on widening
   intervals. Additive: a store with no `revised` simply has nothing due. */
const REVISE_DAYS = [3, 7, 21, 60, 120];
const DAY = 86400000;
const revisions = tid => store.revised[tid] || [];
const lastRevised = tid => { const r = revisions(tid); return r.length ? r[r.length - 1] : null; };

function markRevised(tid){
  const r = revisions(tid).slice();
  r.push(Date.now());
  if(r.length > 12) r.shift();           // the tail is what matters, not a diary
  store.revised[tid] = r;
  save();
}

const isComplete = tp => tp.subtopics.length > 0 &&
  (store.done[tp.id] || []).length >= tp.subtopics.length;

/* Days until this topic wants looking at again. <=0 is due, null means it is
   not a candidate yet — still part-ticked and never revised, so it belongs to
   "Not done" rather than to the decay schedule. */
function dueIn(tp){
  const last = lastRevised(tp.id);
  if(last === null) return isComplete(tp) ? 0 : null;
  const step = REVISE_DAYS[Math.min(revisions(tp.id).length - 1, REVISE_DAYS.length - 1)];
  return Math.ceil((last + step * DAY - Date.now()) / DAY);
}

const isDue = tp => { const d = dueIn(tp); return d !== null && d <= 0; };

/* ---------------- the clock ----------------
   Prelims sits on the last Sunday of May; Mains opens on 1 September. Worked
   out at runtime and never baked in: this page is built to be opened offline
   months later, and a date frozen at build time would quietly be a lie. */
function lastSundayOfMay(y){
  const d = new Date(y, 4, 31);
  d.setDate(31 - ((d.getDay() + 7) % 7));
  return d;
}
function nextExam(){
  const now = new Date(), y = now.getFullYear(), out = [];
  for(const yy of [y, y + 1]){
    out.push({name: "Prelims " + yy, on: lastSundayOfMay(yy)});
    out.push({name: "Mains " + yy, on: new Date(yy, 8, 1)});
  }
  return out.filter(c => c.on >= now).sort((a, b) => a.on - b.on)[0];
}

function agoWords(ms){
  const d = Math.floor((Date.now() - ms) / DAY);
  if(d <= 0) return "today";
  if(d === 1) return "yesterday";
  if(d < 30) return d + " days ago";
  const m = Math.floor(d / 30);
  return m === 1 ? "a month ago" : m + " months ago";
}

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAPER_LBL = {prelims:"P", "mains-gs1":"GS1", "mains-gs2":"GS2", "mains-gs3":"GS3", "mains-gs4":"GS4", essay:"Essay"};

   its segment control and puts this back afterwards. They all write to `view`

function subjProgress(s){
  let d=0, t=0;
  for(const tp of s.topics){ t += tp.subtopics.length; d += (store.done[tp.id]||[]).length; }
  return t ? d/t : 0;
}
function chipHtml(t){
  return t.papers.map(p=>{
    const cls = p==="prelims" ? "chip p" : p==="essay" ? "chip e" : "chip";
    return `<span class="${cls}">${PAPER_LBL[p]||p}</span>`;
  }).join("");
}
const CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
const LINKI = '<svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v7H3V3h7"/></svg>';

/* ---------------- state ---------------- */
let state = {
  tab: "syllabus", filter: "all", tfilter: "all",
  pset: "prelims",        // which paper index the Papers tab is showing
  qpaperId: null,         // the paper being sat, or null for the folder list
  qn: 1,                  // which question of it
  lens: "map",            // "map" | "subject" | "paper" — three shapes of one syllabus
  open: new Set(),        // expanded groups
  openTopics: new Set(),  // topics expanded in place
  shape: false,           // the size-and-progress bars, folded away by default
  read: false,            // the flat, printable read-it-all view

/* ---------------- renderers ---------------- */
/* ---------------- the syllabus ----------------
   This tab IS the syllabus, not a menu standing in front of it. Eight
   subjects, 242 topics and 1,723 subtopics, on one page that opens in place
   and reads all the way down. It used to be eight cards leading to a list
   leading to a modal, which meant the 1,723 lines — the actual syllabus —
   could only be seen eight at a time, one topic at a time, 242 modals deep.

   Two lenses over the same topics. BY SUBJECT is how the material is taught.
   BY PAPER is how the Commission actually sets it, and 240 of the 242 topics
   carry more than one paper tag, so the two are genuinely different shapes of
   one syllabus rather than the same list printed twice. */

const PAPER_ORDER = ["prelims", "mains-gs1", "mains-gs2", "mains-gs3", "mains-gs4", "essay"];
const PAPER_NAME = {
  prelims: "Prelims", "mains-gs1": "Mains GS-I", "mains-gs2": "Mains GS-II",
  "mains-gs3": "Mains GS-III", "mains-gs4": "Mains GS-IV", essay: "Essay",
};
const PAPER_ICON = {
  prelims: "◷", "mains-gs1": "🏛", "mains-gs2": "⚖", "mains-gs3": "📈",
  "mains-gs4": "🧭", essay: "✍",
};
const ALL_TOPICS = SUBJECTS.flatMap(s => s.topics.map(tp => ({tp, s})));
const OWNER = {};
ALL_TOPICS.forEach(x => { OWNER[x.tp.id] = x; });

const ticked = tp => (store.done[tp.id] || []).length;

/* Topics and subtopics counted separately. One percentage cannot say which it
   means, and "68% of topics" is a different claim from 68% of the reading. */
function tally(list){
  let tDone = 0, sTot = 0, sDone = 0;
  for(const tp of list){
    sTot += tp.subtopics.length;
    const d = ticked(tp);
    sDone += d;
    if(tp.subtopics.length && d >= tp.subtopics.length) tDone++;
  }
  return {tTot: list.length, tDone, sTot, sDone, pct: sTot ? sDone / sTot : 0};
}

function groups(){
  if(state.lens === "paper"){
    return PAPER_ORDER
      .map(p => ({id: p, icon: PAPER_ICON[p], name: PAPER_NAME[p], short: PAPER_NAME[p],
                  topics: ALL_TOPICS.filter(x => x.tp.papers.includes(p)).map(x => x.tp)}))
      .filter(g => g.topics.length);
  }
  return SUBJECTS.map(s => ({id: s.id, icon: s.icon, name: s.name, short: s.short, topics: s.topics}));
}

function passesFilter(tp){
  if(state.tfilter === "due") return isDue(tp);
  if(state.tfilter === "high") return tp.weight === "high";
  if(state.tfilter === "left") return ticked(tp) < tp.subtopics.length;
  return true;
}

const hl = (s, term) => !term ? esc(s)
  : esc(s).replace(new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>");

/* The shape of the whole thing in one strip: how big is this, and where does
   the mass sit? Nothing answered that before, and it is the first thing you
   want to know about a syllabus you have to finish by a date. */
/* The syllabus as a picture, which is the one thing a scrolling outline can
   never be. Eight subjects, 242 topics, one square each — the whole of what
   the Commission examines on a screen and a half, so "what is the UPSC
   syllabus" has an answer you can see rather than one you have to scroll.

   Colour is progress, never weight. Weight is an editorial claim and at the
   moment a weak one (145 of 242 are tagged high); where you have and have not
   been is a fact, and a fact is what a picture should be made of. */
function mapHtml(){
  const ex = nextExam();
  const days = ex ? Math.max(0, Math.ceil((ex.on - Date.now()) / DAY)) : null;
  const nSub = SUBJECTS.reduce((a, s) => a + s.topics.reduce((b, t) => b + t.subtopics.length, 0), 0);
  const t0 = tally(ALL_TOPICS.map(x => x.tp));

  return `<div class="mapwrap">
    <div class="mapline">
      <span><b class="mono">${SUBJECTS.length}</b> subjects</span>
      <span><b class="mono">${ALL_TOPICS.length}</b> topics</span>
      <span><b class="mono">${nSub.toLocaleString()}</b> subtopics</span>
      ${days !== null ? `<span><b class="mono">${days}</b> days to ${esc(ex.name)}</span>` : ""}
      <span><b class="mono">${t0.tDone}</b> finished</span>
    </div>
    ${SUBJECTS.map(s => {
      const t = tally(s.topics);
      return `<section class="mapsub">
        <button class="maph" data-mapsub="${s.id}">
          <span class="gi">${s.icon}</span>
          <span class="mn">${esc(s.name)}</span>
          <span class="mm mono">${t.tDone}/${t.tTot}</span>
          <span class="mbar"><i style="width:${(t.pct * 100).toFixed(1)}%"></i></span>
        </button>
        <div class="mtiles">
          ${s.topics.map(tp => {
            // due beats finished on purpose: a topic that has come round again
            // is work, and work is what the picture is for
            const st = isDue(tp) ? "due" : isComplete(tp) ? "done" : ticked(tp) ? "part" : "";
            return `<button class="mt ${st}" data-sheet="${tp.id}" title="${esc(tp.name)}"></button>`;
          }).join("")}
        </div>
      </section>`;
    }).join("")}
    <div class="plegend" style="margin-top:12px">
      <span><i class="mdone"></i>finished</span>
      <span><i class="mpart"></i>started</span>
      <span><i class="mdue"></i>due again</span>
      <span><i></i>not started</span>
    </div>
    <p class="note">Every square is one topic — tap it to open its subtopics and tick them off.
      Tap a subject's name to drop into the full outline at that subject.</p>
  </div>`;
}

function shapeHtml(){
  const gs = groups();
  const max = Math.max(...gs.map(g => g.topics.length));
  const t = tally(ALL_TOPICS.map(x => x.tp));
  const multi = ALL_TOPICS.filter(x => x.tp.papers.length > 1).length;
  /* The bars were worth seeing once and then occupied the top of the screen
     every time. The line of counts stays, because that is the part you read;
     the shape folds away behind it. */
  const open = !!state.shape;
  return `<div class="shape">
    <button class="shead" id="shapeToggle">
      <span><b class="mono">${t.tTot}</b> topics · <b class="mono">${t.sTot.toLocaleString()}</b> subtopics</span>
      <span class="n">${t.tDone} done · ${t.sDone.toLocaleString()} ticked <i>${open ? "−" : "+"}</i></span>
    </button>
    ${!open ? "" : `<div class="sbars">
      ${gs.map(g => {

          <span class="sb-l"><span class="sb-i">${g.icon}</span>${esc(g.short)}</span>
          <span class="sb-t"><i style="width:${(g.topics.length / max * 100).toFixed(1)}%"></i><b style="width:${(g.topics.length / max * gt.pct * 100).toFixed(1)}%"></b></span>

  </div>`;
}

/* A topic opened in place. The sheet still exists and still owns revision;
   this is for reading, and reading the whole of a topic should not cost a
   navigation. */
function subtopicsHtml(tp, term){
  const done = new Set(store.done[tp.id] || []);
  return `<div class="subs">
    ${tp.subtopics.map((x, i) => `
      <button class="sub ${done.has(i) ? "on" : ""}" data-tick="${tp.id}" data-i="${i}">

    <div class="subfoot">
      <span class="also">Counts for ${tp.papers.map(p => PAPER_NAME[p] || p).join(", ")}</span>
      <button class="linky" data-sheet="${tp.id}">Open · mark revised</button>
    </div>
  </div>`;
}

function topicHtml(tp, s, term){
  const open = state.openTopics.has(tp.id);
  const dn = ticked(tp), tot = tp.subtopics.length;
  const d = dueIn(tp);
  const dueChip = d === null ? "" : d <= 0 ? `<span class="chip due">due</span>` : `<span class="chip sched">${d}d</span>`;
  const matched = term ? tp.subtopics.filter(x => x.toLowerCase().includes(term)) : [];
  const teaser = (matched.length ? matched : tp.subtopics).slice(0, 2).join(" · ");
  return `<div class="tw ${open ? "open" : ""}">
    <button class="row" data-open="${tp.id}">
      <span class="stripe ${tp.weight}"></span>
      <span class="body">
        <span class="t">${hl(tp.name, term)}</span>
        <span class="s">${s ? esc(s.short) + " · " : ""}${hl(teaser, term)}</span>
        <span class="chips">${chipHtml(tp)}<span class="chip">${dn}/${tot}</span>${dueChip}${
          term && matched.length ? `<span class="chip m">${matched.length} match${matched.length > 1 ? "es" : ""}</span>` : ""}</span>
      </span>
      <span class="caret">${open ? "−" : "+"}</span>
    </button>
    ${open ? subtopicsHtml(tp, term) : ""}
  </div>`;
}

/* Everything, flat, no controls: for reading end to end and for printing. The

function readHtml(){
  const subs = ALL_TOPICS.reduce((a, x) => a + x.tp.subtopics.length, 0);

/* ---------------- today ----------------
   What to study, rather than what exists.

   The app already knew all of this and made you assemble it: which topics had
   fallen due, whether the daily quiz was logged, which practice answers you
   got wrong. That is a to-do list, and it was scattered across three tabs.

   Nothing here is a new obligation invented by the app. Every line is
   something already true of your own data, and every line is one tap from the

const PLAN_N = 6;

function planItems(){
  const out = [];
  const due = ALL_TOPICS.filter(x => isDue(x.tp)).sort((a, b) => dueIn(a.tp) - dueIn(b.tp));
  for(const {tp, s} of due.slice(0, PLAN_N)){
    const d = dueIn(tp);
    out.push({kind: "topic", id: tp.id, title: tp.name, sub: s.short,
              note: d < 0 ? `${-d}d overdue` : "due today"});
  }

  const today = new Date().toISOString().slice(0, 10);
  const dow = new Date().getDay();
  if(dow !== 0 && !(store.daily || {})[today])
    out.push({kind: "daily", title: "Today's current-affairs quiz", sub: "Practice",
              note: "not logged"});

  /* Wrong answers now come off finished papers rather than a practice pile:
     a paper is only marked once every question on it has been answered, so
     nothing here counts a question you are still in the middle of. */
  let wrong = 0;
  for(const pp of paperList()){
    if(pp.kind !== "typed") continue;
    const sheet = store.attempts[pp.id] || {};
    if(Object.keys(sheet).length < pp.questions.length) continue;
    pp.questions.forEach((q, i) => { if(sheet[i + 1] !== q.answer) wrong++; });
  }
  if(wrong) out.push({kind: "wrong", title: `${wrong} answer${wrong > 1 ? "s" : ""} to go back over`,
                      sub: "Papers", note: "got wrong"});
  return out;
}

function planHtml(){
  const items = planItems();
  const done = ALL_TOPICS.filter(x => isComplete(x.tp)).length;
  if(!items.length){
    return `<div class="plan">
      <div class="phead"><h2>Today</h2><span class="n">nothing due</span></div>
      <p class="note" style="margin:0">Nothing has fallen due and today's quiz is logged.
        ${done < ALL_TOPICS.length
          ? "Start something new below — the syllabus is sorted by how often it comes up."
          : "The whole syllabus is ticked off; the decay schedule will bring it back round."}</p>
    </div>`;
  }
  return `<div class="plan">
    <div class="phead"><h2>Today</h2><span class="n">${items.length} to do</span></div>
    <div class="plist">
      ${items.map(i => `<button class="pitem" data-plan="${i.kind}" data-id="${i.id || ""}">
        <span class="pdot ${i.kind}"></span>
        <span class="pbody"><span class="pt">${esc(i.title)}</span>
          <span class="ps">${esc(i.sub)} · ${esc(i.note)}</span></span>
        <span class="pgo">›</span>
      </button>`).join("")}
    </div>
  </div>`;
}

function bindPlan(root){
  root.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => {
    const k = b.dataset.plan;
    if(k === "topic"){ openTopic(b.dataset.id); return; }
    state.tab = "practice"; state.qmode = k === "daily" ? "daily" : "papers";
    markTab("practice"); render();
  });
}

/* Search reads the same 1,723 subtopics the outline does, and returns the same
   rows — so a hit expands, ticks and links exactly like the tree it came from,
   with the matched words marked. */
function runSearch(term){
  const res = document.getElementById("results"), home = document.getElementById("home");
  if(!res) return;
  if(!term || term.length < 2){ res.innerHTML = ""; home.classList.remove("hide"); return; }
  home.classList.add("hide");
  const t = term.toLowerCase();
  const hits = [];
  for(const {tp, s} of ALL_TOPICS){
    const inName = tp.name.toLowerCase().includes(t);
    const subs = tp.subtopics.filter(x => x.toLowerCase().includes(t));
    if(inName || subs.length) hits.push({tp, s, n: subs.length});
  }
  if(!hits.length){ res.innerHTML = `<div class="empty">Nothing matches “${esc(term)}”.</div>`; return; }
  const subHits = hits.reduce((a, h) => a + h.n, 0);
  res.innerHTML = `<div class="head"><h2>Results</h2><span class="n">${hits.length} topics · ${subHits} subtopics</span></div>
    <div class="tlist">${hits.slice(0, 80).map(h => topicHtml(h.tp, h.s, t)).join("")}</div>`;
  bindOutline(res);
}

/* Kept for the sheet and anywhere else that still wants a plain row. */
function rowHtml(tp, s, subline){
  const dn = ticked(tp), tot = tp.subtopics.length;
  const complete = dn === tot && tot > 0;
  const d = dueIn(tp);
  const dueChip = d === null ? "" : d <= 0 ? `<span class="chip due">due</span>` : `<span class="chip sched">${d}d</span>`;
  return `<button class="row" data-topic="${tp.id}">
    <span class="stripe ${tp.weight}"></span>
    <span class="body">
      <span class="t">${esc(tp.name)}</span>
      <span class="s">${esc(subline || (s ? s.short + " · " : "") + tp.subtopics.slice(0, 2).join(" · "))}</span>
      <span class="chips">${chipHtml(tp)}<span class="chip">${dn}/${tot}</span>${dueChip}</span>
    </span>
    <span class="tick ${complete ? "on" : ""}">${CHECK}</span>
  </button>`;
}

/* One place binds the outline, so search results behave exactly like the tree:
   same rows, same expansion, same ticking. */
function bindOutline(root){
  root.querySelectorAll("[data-grp]").forEach(b => b.onclick = () => {
    const id = b.dataset.grp;
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    refreshBehind();          // keeps your place; render() would jump to the top
  });
  root.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const id = b.dataset.open;
    state.openTopics.has(id) ? state.openTopics.delete(id) : state.openTopics.add(id);
    refreshBehind();
  });
  root.querySelectorAll("[data-tick]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const tp = OWNER[b.dataset.tick].tp;
    toggleSub(tp.id, +b.dataset.i, tp.subtopics.length);
    refreshBehind();
  });
  root.querySelectorAll("[data-sheet]").forEach(b => b.onclick = e => {
    e.stopPropagation(); openTopic(b.dataset.sheet);
  });
  root.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => openTopic(b.dataset.topic));
}

function bindRows(root){
  root.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => openTopic(b.dataset.topic));
}


/* What the exam calendar and your own ticks jointly imply.
   The daily rate is only shown when there is enough runway for it to mean
   anything. Inside the last month "35 topics a day" is not a plan, it is an
   insult, so the strip switches to plain counts instead. */
const PACE_HORIZON = 30;

function paceHtml(total){
  const ex = nextExam();
  if(!ex) return "";
  const days = Math.max(0, Math.ceil((ex.on - Date.now()) / DAY));
  const done = SUBJECTS.reduce((a, s) => a + s.topics.filter(isComplete).length, 0);
  const due = SUBJECTS.reduce((a, s) => a + s.topics.filter(isDue).length, 0);
  const left = total - done;
  const rate = left / Math.max(1, days);

  let second;
  if(!left) second = "whole syllabus ticked off";
  else if(days >= PACE_HORIZON)
    second = `<b class="mono">${rate < 10 ? rate.toFixed(1) : Math.round(rate)}</b> topics a day to cover the rest`;
  else
    second = `<b class="mono">${left}</b> still untouched — revision territory now, not first pass`;

  return `<div class="pace">
    <div class="pl"><span class="big mono">${days}</span><span class="lil">days to ${esc(ex.name)}</span></div>
    <div class="pr">
      <span><b class="mono">${done}</b> of ${total} topics finished</span>
      <span>${second}</span>
      ${due ? `<span><button class="linky" id="dueJump"><b class="mono">${due}</b> due for revision</button></span>` : ""}
    </div>
  </div>`;
}

/* ---------------- focus ----------------
   A clock you set by hand, from 1 to 60 minutes, and then do not touch.

   This does NOT try to control the phone. An earlier version pinned the screen
   with startLockTask(), and that was the wrong idea twice over: Android always
   leaves a way out of pinning anyway, and a study tool that fights the device
   is solving the wrong problem. What actually breaks a study hour is the
   reflex — the idle unlock, the glance at a notification — and you cannot
   engineer that away. You can only count it.

   So the rule is simple and unforgiving: LEAVE THE APP AND THE RUN IS VOID.
   The clock stops, the dial goes back to zero, and the streak of clean runs
   goes back to zero with it. Nothing is blocked and nothing is locked. The
   only thing at stake is whether the run counts, which is the whole point —
   a number you cannot fake is worth more than a cage you can escape.

   In-app navigation is not an interruption. Reading the syllabus during a
   focus hour is the activity, not a distraction from it. */

const FOCUS_MIN = 1, FOCUS_MAX = 60, FOCUS_DEFAULT = 25;

const focusRun = () => store.focusRun && store.focusRun.start ? store.focusRun : null;
const focusLeft = r => Math.max(0, r.start + r.mins * 60000 - Date.now());
const focusDone = r => focusLeft(r) <= 0;
const focusClamp = m => Math.max(FOCUS_MIN, Math.min(FOCUS_MAX, Math.round(m)));

function focusFmt(ms){
  const s = Math.ceil(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}

/* Streak of runs finished without leaving. Reset to zero by any interruption,
   which is the only consequence this feature has and so has to be the one it
   states plainly. */
const focusStreak = () => store.focusStreak || 0;

/* Keeping the screen awake is help, not control: the phone going dark
   mid-session and taking the run with it would be the tool's fault, not
   yours. It is the only thing the native side is asked for now. */
let wakeLock = null;
async function focusAwake(on){
  if(NATIVE && NATIVE.focusAwake){ try{ NATIVE.focusAwake(on); }catch(e){} }
  if(!on){
    if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
    return;
  }
  try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}

function focusStart(mins){
  store.focusRun = {start: Date.now(), mins: focusClamp(mins)};
  save();
  focusAwake(true);
  render();
}

/* Every run is written down, and the two endings are not the same thing:
   "done" is a run seen out, "void" is one interrupted. A log that quietly
   dropped the voided ones would make the streak meaningless. */
function focusEnd(kind){
  const r = focusRun();
  if(!r) return;
  store.focus = (store.focus || []).concat([{
    on: r.start, mins: r.mins, ran: Math.round((Date.now() - r.start) / 1000), kind,
  }]).slice(-60);
  store.focusStreak = kind === "done" ? focusStreak() + 1 : 0;
  store.focusRun = null;
  focusAwake(false);
  save();
  render();
}

/* The interruption. Whatever took you out of the app — the home button, a
   call, another app, the screen locking — lands here, and the run is void.
   No grace period and no partial credit: a minute of leniency is a minute you
   would spend on your phone. */
function focusInterrupt(){
  if(!focusRun()) return;
  focusEnd("void");
}
window.taracmdInterrupted = focusInterrupt;
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") focusInterrupt();
});
addEventListener("pagehide", focusInterrupt);

/* ---- the dial ----
   Sixty minutes round the face, one per tick, so the angle IS the number of
   minutes and setting it needs no instructions. Drag it, or tap a point on
   the rim. */
const FOCUS_R = 84, FOCUS_C = 2 * Math.PI * FOCUS_R;
const focusAngle = m => (m / 60) * 360 - 90;
const focusPoint = (m, r = FOCUS_R) => {
  const a = focusAngle(m) * Math.PI / 180;
  return [100 + r * Math.cos(a), 100 + r * Math.sin(a)];
};

function focusDialHtml(mins, frac, running){
  const [hx, hy] = focusPoint(mins);
  const ticks = Array.from({length: 60}, (_, i) => {
    const big = i % 5 === 0;
    const [x1, y1] = focusPoint(i, big ? 70 : 74);
    const [x2, y2] = focusPoint(i, 78);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      class="ftick${big ? " big" : ""}"/>`;
  }).join("");
  // The arc is drawn from twelve o'clock and shortened as the run is spent, so
  // what is left on the dial is literally what is left on the clock.
  const dash = FOCUS_C * (running ? frac : mins / 60);
  return `<svg viewBox="0 0 200 200" class="fdial" id="fdial">
    <circle cx="100" cy="100" r="${FOCUS_R}" class="ftrack"/>
    ${ticks}
    <circle cx="100" cy="100" r="${FOCUS_R}" class="farc"
      stroke-dasharray="${dash.toFixed(1)} ${(FOCUS_C - dash).toFixed(1)}"
      transform="rotate(-90 100 100)"/>
    ${running ? "" : `<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="9" class="fgrip"/>`}
    ${running ? `<line x1="100" y1="100" x2="100" y2="26" class="fhand" id="fhand"/>
    <circle cx="100" cy="100" r="3" class="fpin"/>` : ""}
  </svg>`;
}

let focusTick = null;
function focusClock(){
  clearInterval(focusTick);
  const r = focusRun();
  if(!r) return;
  const paint = () => {
    const run = focusRun();
    if(!run){ clearInterval(focusTick); return; }
    if(focusDone(run)){ clearInterval(focusTick); focusEnd("done"); return; }
    const left = focusLeft(run), total = run.mins * 60000;
    const el = document.getElementById("fread");
    if(el) el.textContent = focusFmt(left);
    const arc = document.querySelector(".farc");
    if(arc){
      const d = FOCUS_C * (left / total);
      arc.setAttribute("stroke-dasharray", `${d.toFixed(1)} ${(FOCUS_C - d).toFixed(1)}`);
    }
    // One sweep a minute, like a second hand, so the dial is visibly alive
    // even when the digits have not changed.
    const hand = document.getElementById("fhand");
    if(hand) hand.setAttribute("transform", `rotate(${((Date.now() - run.start) / 1000 % 60) * 6} 100 100)`);
  };
  paint();
  focusTick = setInterval(paint, 200);
}

/* Fourteen days of focused minutes.
   Only runs that were SEEN OUT count towards a day's total. A voided run is
   still drawn, as a hollow mark, because the point of the streak is that
   breaking it costs something visible — a chart that quietly forgot the runs
   you walked out of would be flattering rather than useful. */
const FOCUS_DAYS = 14;
function focusHistory(){
  const day = ms => new Date(ms).toDateString();
  const out = [];
  for(let i = FOCUS_DAYS - 1; i >= 0; i--){
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const key = d.toDateString();
    const runs = (store.focus || []).filter(x => day(x.on) === key);
    out.push({
      date: d,
      mins: Math.round(runs.filter(x => x.kind === "done").reduce((a, x) => a + x.ran / 60, 0)),
      voided: runs.filter(x => x.kind !== "done").length,
    });
  }
  return out;
}

function focusHistoryHtml(){
  const days = focusHistory();
  const best = Math.max(30, ...days.map(d => d.mins));
  const total = days.reduce((a, d) => a + d.mins, 0);
  const kept = days.filter(d => d.mins > 0).length;
  return `<div class="head"><h2>Last two weeks</h2><span class="n">${total}m over ${kept} day${kept === 1 ? "" : "s"}</span></div>
    <div class="fhist">
      ${days.map(d => `<div class="fbar" title="${d.date.toDateString()}">
        <span class="fbv">${d.mins ? `<i style="height:${Math.max(3, d.mins / best * 100)}%"></i>` : ""}${
          d.voided ? `<u>${d.voided > 1 ? d.voided : ""}</u>` : ""}</span>
        <span class="fbm mono">${d.mins || ""}</span>
        <span class="fbd">${["S","M","T","W","T","F","S"][d.date.getDay()]}</span>
      </div>`).join("")}
    </div>
    <p class="note">Height is minutes focused that day; a hollow mark is a run you walked out of.
      Only runs seen out count.</p>`;
}

function renderFocus(){
  document.getElementById("brandSub").textContent = "focus";
  const r = focusRun();
  const log = store.focus || [];
  const today = new Date().toDateString();
  const mins = log.filter(x => x.kind === "done" && new Date(x.on).toDateString() === today)
                  .reduce((a, x) => a + x.ran / 60, 0);

  if(r){
    view.innerHTML = `
      <div class="focuswrap">
        <div class="fdialwrap">
          ${focusDialHtml(r.mins, focusLeft(r) / (r.mins * 60000), true)}
          <div class="fcentre">
            <span class="fread mono" id="fread">${focusFmt(focusLeft(r))}</span>
            <span class="flil">of ${r.mins} min</span>
          </div>
        </div>
        <button class="prim fstop" id="fstop">Give up</button>
        <p class="note" style="text-align:center;max-width:32ch;margin:16px auto 0">
          Leave the app and this run is void — the clock resets to zero and the streak
          with it. Reading the syllabus in here is not leaving.</p>
      </div>`;
    document.getElementById("fstop").onclick = () => {
      if(confirm("Give up on this run? It counts as broken and the streak resets.")) focusEnd("void");
    };
    focusClock();
    return;
  }

  let pick = focusClamp(store.focusPick || FOCUS_DEFAULT);
  view.innerHTML = `
    <div class="focuswrap">
      <div class="fdialwrap">
        ${focusDialHtml(pick, 0, false)}
        <div class="fcentre">
          <span class="fread mono" id="fread">${pick}</span>
          <span class="flil">minutes</span>
        </div>
      </div>
      <div class="fsteps">
        <button class="fstep" data-step="-5">−5</button>
        <button class="fstep" data-step="-1">−1</button>
        <button class="fstep" data-step="1">+1</button>
        <button class="fstep" data-step="5">+5</button>
      </div>
      <button class="prim fgo" id="fgo">Start</button>
      <div class="sgrid" style="margin:18px 0 2px">
        <span>today <b class="mono">${Math.round(mins)}m</b></span>
        <span>clean runs in a row <b class="mono">${focusStreak()}</b></span>
        <span>runs <b class="mono">${log.length}</b></span>
      </div>
      <p class="note">Drag the dial, ${FOCUS_MIN} to ${FOCUS_MAX} minutes. Nothing here locks the
        phone — leaving the app simply voids the run and puts the streak back to zero.</p>
      ${log.length ? focusHistoryHtml() : ""}
    </div>`;

  /* Dragging has to be cheap, and the first version was not.
     Per pointermove it called save() — JSON.stringify of the whole store,
     every tick and every logged answer, synchronously — re-queried three
     elements, and measured the dial with getBoundingClientRect(), which
     forces layout. Worse, .farc carries a .25s transition, so the arc was
     animating TOWARDS the finger rather than following it, which is what the
     lag actually looked like.
     Now: measure once on pointerdown, hold the nodes, paint on a frame, kill
     the transition for the duration of the drag, and write to storage once
     when the finger lifts. */
  const dial = document.getElementById("fdial");
  const readEl = document.getElementById("fread");
  const arcEl = dial.querySelector(".farc");
  const gripEl = dial.querySelector(".fgrip");
  let box = null, frame = 0, pending = pick;

  const paint = () => {
    frame = 0;
    if(readEl) readEl.textContent = pending;
    if(arcEl){
      const d = FOCUS_C * (pending / 60);
      arcEl.setAttribute("stroke-dasharray", `${d.toFixed(1)} ${(FOCUS_C - d).toFixed(1)}`);
    }
    if(gripEl){
      const [x, y] = focusPoint(pending);
      gripEl.setAttribute("cx", x.toFixed(1)); gripEl.setAttribute("cy", y.toFixed(1));
    }
  };
  const set = (m, commit) => {
    pick = pending = focusClamp(m);
    if(!frame) frame = requestAnimationFrame(paint);
    if(commit){ store.focusPick = pick; save(); }
  };

  const fromEvent = e => {
    const b = box || (box = dial.getBoundingClientRect());
    const x = e.clientX - (b.left + b.width / 2), y = e.clientY - (b.top + b.height / 2);
    // atan2 measured from twelve o'clock, clockwise; 60 lands on 0 rather than
    // wrapping to a 0-minute run that cannot be started.
    const deg = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
    return focusClamp(deg / 6 || 60);
  };
  let dragging = false;
  dial.addEventListener("pointerdown", e => {
    dragging = true;
    box = dial.getBoundingClientRect();
    dial.classList.add("dragging");     // the arc must not lag behind the finger
    dial.setPointerCapture(e.pointerId);
    set(fromEvent(e));
  });
  dial.addEventListener("pointermove", e => { if(dragging) set(fromEvent(e)); });
  const drop = () => {
    if(!dragging) return;
    dragging = false; box = null;
    dial.classList.remove("dragging");
    set(pick, true);                    // one write, when the finger lifts
    if(frame){ cancelAnimationFrame(frame); frame = 0; }
    paint();                            // never leave the dial showing a stale number
  };
  dial.addEventListener("pointerup", drop);
  dial.addEventListener("pointercancel", drop);

  view.querySelectorAll("[data-step]").forEach(b => b.onclick = () => set(pick + +b.dataset.step, true));
  document.getElementById("fgo").onclick = () => focusStart(pick);
}

const sheet = document.getElementById("sheet"), sheetBg = document.getElementById("sheetBg"), sheetIn = document.getElementById("sheetIn");
let openId = null;
function openTopic(id){
  let tp=null, sj=null;
  for(const s of SUBJECTS){ const f = s.topics.find(t=>t.id===id); if(f){tp=f;sj=s;break;} }
  if(!tp) return;
  openId = id;
  drawSheet(tp, sj);

/* The revision footer of the sheet: when you last went through this, when it
   falls due again, and the one button that says you have just done it. */
function revBlock(tp){
  const last = lastRevised(tp.id), n = revisions(tp.id).length, d = dueIn(tp);
  const line = last === null
    ? (isComplete(tp) ? "Ticked off, but never dated — treat it as due."
                      : "Not revised yet.")
    : `Revised ${n === 1 ? "once" : n + " times"}, last ${agoWords(last)}.` +
      (d <= 0 ? " <b>Due now.</b>" : ` Due again in ${d} day${d === 1 ? "" : "s"}.`);
  return `<div class="revline">
    <span>${line}</span>
    <button class="revbtn" id="revNow">${last === null ? "Mark revised" : "Revised again"}</button>
  </div>`;
}

function drawSheet(tp, sj){
  const done = doneSet(tp.id);
  const pct = tp.subtopics.length ? done.size/tp.subtopics.length : 0;
  const weightWord = {high:"High frequency", medium:"Medium frequency", low:"Low frequency"}[tp.weight];
  const papers = tp.papers.map(p=>({prelims:"Prelims","mains-gs1":"Mains GS-I","mains-gs2":"Mains GS-II","mains-gs3":"Mains GS-III","mains-gs4":"Mains GS-IV",essay:"Essay"}[p]||p)).join(", ");
  sheetIn.innerHTML = `
    <div class="sheethead">
      <div>
        <div class="eyebrow">${esc(sj.short)}</div>
        <h3>${esc(tp.name)}</h3>
      </div>
      <button class="xbtn" id="sheetX" aria-label="Close">${XI}</button>
    </div>
    <div class="chips">${chipHtml(tp)}</div>
    <div class="why">
      <span class="stripe ${tp.weight}" style="width:3px;min-height:34px;border-radius:99px"></span>
      <span><b>${weightWord}</b> in the last ten years. Asked in ${esc(papers)}.</span>
    </div>
    <div class="eyebrow">Subtopics</div>
    <div class="progline"><span>${done.size}/${tp.subtopics.length}</span><span class="bar"><i style="width:${(pct*100).toFixed(1)}%"></i></span><span>${Math.round(pct*100)}%</span></div>
    <ul class="subtopics">
      ${tp.subtopics.map((x,i)=>`<li><button class="${done.has(i)?"done":""}" data-i="${i}">
        <span class="tick ${done.has(i)?"on":""}">${CHECK}</span><span class="lbl">${esc(x)}</span></button></li>`).join("")}
    </ul>
    ${revBlock(tp)}`;
  sheetIn.querySelector("#sheetX").onclick = closeSheet;
  const rev = sheetIn.querySelector("#revNow");
  if(rev) rev.onclick = ()=>{
    const y = sheet.scrollTop;
    markRevised(tp.id);
    drawSheet(tp, sj);
    sheet.scrollTop = y;
    refreshBehind();
  };
  sheetIn.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    const y = sheet.scrollTop;                 // redrawing the sheet used to jump you to the top
    toggleSub(tp.id, +b.dataset.i, tp.subtopics.length);
    drawSheet(tp, sj);
    sheet.scrollTop = y;
    refreshBehind();
  });
}

/* Re-render the syllabus without throwing away the user's place: a rebuild
   used to wipe an active search, and now it would also collapse whatever the
   reader had opened. The scroll position is held too, because ticking a
   subtopic halfway down a 242-topic outline should not send you back to the
   top of it. */
function refreshBehind(){
  if(state.tab !== "syllabus" || state.read) return;
  const q = document.getElementById("q");
  const term = q ? q.value : "";
  const y = window.scrollY;
  renderSyllabus();
  const q2 = document.getElementById("q");
  if(q2 && term){ q2.value = term; runSearch(term.trim()); }
  window.scrollTo(0, y);
}

/* ---------------- Mains answer log ----------------
   Prelims is a recognition test and the OMR scorer covers it. Mains is not:
   it is won by writing 20 answers in three hours, and no amount of ticking
   subtopics tells you whether you can. So each Mains paper gets a log — how
   long an answer took, how many words it ran to, what you would score it, and
   the one sentence about what went wrong that is the whole point of doing it.

   Lives inside the Mains tab on purpose. The tab bar is repeat(5,1fr) and a
   sixth would cramp the row on a phone. */
const writeKey = (year, code) => `${year}-${code}`;
const writeLog = (year, code) => store.writing[writeKey(year, code)] || [];

function writeStats(year, code){
  const log = writeLog(year, code);
  if(!log.length) return null;
  const pct = log.filter(a => a.of).map(a => a.score / a.of);
  const mins = log.filter(a => a.mins).map(a => a.mins);
  const words = log.filter(a => a.words).map(a => a.words);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return {n: log.length, pct: avg(pct), mins: avg(mins), words: avg(words)};
}

function openWriting(year, code, label){
  openId = "__write__";
  const draw = ()=>{
    const log = writeLog(year, code).slice().sort((a, b) => (b.on || 0) - (a.on || 0));
    const st = writeStats(year, code);
    const isEssay = code === "essay";
    /* What a single answer is marked out of. Essay is one of two at 125;
       a GS answer is a 10- or a 15-marker; an optional paper mixes in
       20-markers as well. */
    const isOpt = /-p[12]$/.test(code);
    const scales = isEssay ? [125, 250] : isOpt ? [10, 15, 20] : [10, 15];
    sheetIn.innerHTML = `
      <div class="sheethead">
        <div><div class="eyebrow">Mains ${year} &middot; ${esc(label)}</div><h3>Answer log</h3></div>
        <button class="xbtn" id="sheetX" aria-label="Close">${XI}</button>
      </div>
      ${st ? `<div class="sgrid" style="margin:12px 0 14px">
        <span>logged <b class="mono">${st.n}</b></span>
        ${st.pct !== null ? `<span>average <b class="mono">${Math.round(st.pct * 100)}%</b></span>` : ""}
        ${st.mins !== null ? `<span>time <b class="mono">${Math.round(st.mins)}</b> min</span>` : ""}
        ${st.words !== null ? `<span>length <b class="mono">${Math.round(st.words)}</b> words</span>` : ""}
      </div>` : `<p class="note" style="margin:10px 0 14px">Nothing logged for this paper yet. Write one answer under time, then record what it cost you.</p>`}

      <div class="eyebrow">Log an answer</div>
      <div class="wform">
        <label>Q<input id="wq" type="number" min="1" max="30" inputmode="numeric" placeholder="${isEssay ? "1" : "7"}"></label>
        <label>min<input id="wmin" type="number" min="1" max="240" inputmode="numeric" placeholder="${isEssay ? "75" : "9"}"></label>
        <label>words<input id="wwords" type="number" min="1" max="3000" inputmode="numeric" placeholder="${isEssay ? "1000" : "150"}"></label>
        <label>marks<input id="wscore" type="number" min="0" max="250" step="0.5" inputmode="decimal" placeholder="9"></label>
        <label>of<select id="wof">
          ${scales.map(v=>`<option value="${v}">${v}</option>`).join("")}
        </select></label>
      </div>
      <input class="wnote" id="wnote" maxlength="160" placeholder="What went wrong? Intro too long, no diagram, ran out of time…">
      <div class="act"><button class="prim" id="wadd">Log it</button></div>
      <p class="note" id="wmsg"></p>

      ${log.length ? `<div class="eyebrow" style="margin-top:18px">Logged</div>
      <div class="list" style="margin-top:8px">
        ${log.map((a, i)=>`<div class="wrow">
          <span class="wq mono">Q${a.q || "?"}</span>
          <span class="wbody">
            <span class="wmeta mono">${[a.mins ? a.mins + " min" : null, a.words ? a.words + " words" : null,
                (a.score !== undefined && a.of) ? a.score + "/" + a.of : null].filter(Boolean).join(" · ")}</span>
            ${a.note ? `<span class="wtext">${esc(a.note)}</span>` : ""}
            <span class="wdate">${a.on ? agoWords(a.on) : ""}</span>
          </span>
          <button class="wdel" data-del="${a.on}" aria-label="Remove">${XI}</button>
        </div>`).join("")}
      </div>` : ""}`;

    sheetIn.querySelector("#sheetX").onclick = closeSheet;
    sheetIn.querySelector("#wadd").onclick = ()=>{
      const num = id => { const v = sheetIn.querySelector(id).value.trim(); return v === "" ? undefined : +v; };
      const entry = {
        q: num("#wq"), mins: num("#wmin"), words: num("#wwords"),
        score: num("#wscore"), of: +sheetIn.querySelector("#wof").value,
        note: sheetIn.querySelector("#wnote").value.trim(), on: Date.now()
      };
      if(entry.q === undefined && entry.score === undefined && !entry.note){
        sheetIn.querySelector("#wmsg").textContent = "Give it at least a question number, a score or a note.";
        return;
      }
      const k = writeKey(year, code);
      store.writing[k] = writeLog(year, code).concat([entry]);
      save();
      draw();
      render();
    };
    sheetIn.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      const on = +b.dataset.del, k = writeKey(year, code);
      store.writing[k] = writeLog(year, code).filter(a => a.on !== on);
      if(!store.writing[k].length) delete store.writing[k];
      save();
      draw();
      render();
    });
  };
  draw();
  sheet.classList.add("on"); sheetBg.classList.add("on");
}

/* Everything falling due, across all eight subjects, oldest debt first. Rides
   on the same #results slot the search uses. */
function showDue(){
  const res = document.getElementById("results"), home = document.getElementById("home");
  if(!res) return;
  const rows = [];
  for(const s of SUBJECTS) for(const tp of s.topics) if(isDue(tp)) rows.push({s, tp});
  rows.sort((a, b) => dueIn(a.tp) - dueIn(b.tp));
  home.classList.add("hide");

    <p class="note">Longest-neglected first. Go back over one, then tap <b>Revised again</b> in the sheet — it returns at a wider interval each time: ${REVISE_DAYS.join(", ")} days, then every ${REVISE_DAYS[REVISE_DAYS.length - 1]}.</p>`;
  bindRows(res);
}

/* ---------------- backup ----------------
   All of this lives in one browser's localStorage and nowhere else. Clear site
   data, reinstall the APK or change phone and it is gone, so there has to be a
   way to get it out. Deliberately a copyable blob rather than a fifth bridge
   function: the JS↔native contract is four functions wide and widening it
   silently is how the two halves drift apart. */
function mergeStore(incoming){
  const uniqSort = (a, b) => [...new Set([...(a || []), ...(b || [])])].sort((x, y) => x - y);
  let touched = 0;

  for(const tid in incoming.done || {}){
    const before = (store.done[tid] || []).length;
    store.done[tid] = uniqSort(store.done[tid], incoming.done[tid]);
    if(store.done[tid].length !== before) touched++;
  }
  for(const tid in incoming.revised || {}){
    store.revised[tid] = uniqSort(store.revised[tid], incoming.revised[tid]).slice(-12);
  }
  // Maps of answers: what is already here wins, the backup only fills gaps.
  for(const k of ["attempts", "picks", "writing"]){
    for(const id in incoming[k] || {}){
      if(store[k][id] === undefined){ store[k][id] = incoming[k][id]; touched++; }
    }
  }
  save();
  return touched;
}

function openData(){
  openId = "__data__";
  const json = JSON.stringify(store);
  const n = o => Object.keys(o || {}).length;
  sheetIn.innerHTML = `
    <div class="sheethead">

      <button class="xbtn" id="sheetX" aria-label="Close">${XI}</button>
    </div>
    <p class="note" style="margin-top:2px">Nothing here leaves the device by itself. Clear site data, reinstall the app or move phone and the text below is the only copy of your progress.</p>
    <div class="sgrid" style="margin:14px 0 16px">
      <span>topics started <b class="mono">${n(store.done)}</b></span>

      <span>topics dated <b class="mono">${n(store.revised)}</b></span>

    </div>
    <div class="eyebrow">Backup</div>
    <textarea class="dump" id="dumpOut" rows="4" readonly>${esc(json)}</textarea>
    <div class="act">
      <button class="prim" id="copyOut">Copy</button>
      ${NATIVE ? "" : `<button id="fileOut">Save as file</button>`}
    </div>
    <div class="eyebrow" style="margin-top:20px">Restore</div>
    <p class="note" style="margin:4px 0 8px">Paste a backup. It is merged, not swapped in — ticks and dates are unioned, and anything already on this device wins.</p>
    <textarea class="dump" id="dumpIn" rows="3" placeholder='{"done":{ … }}'></textarea>
    <div class="act"><button id="doImport">Merge this in</button></div>
    <p class="note" id="ioMsg"></p>`;

  sheetIn.querySelector("#sheetX").onclick = closeSheet;
  const msg = t => { sheetIn.querySelector("#ioMsg").innerHTML = t; };

  sheetIn.querySelector("#copyOut").onclick = ()=>{
    const ta = sheetIn.querySelector("#dumpOut");
    ta.select();
    const done = ()=>msg("Copied. Paste it somewhere that survives this device.");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done, ()=>msg("Could not copy — select the text and copy it by hand."));
    } else {
      try{ document.execCommand("copy"); done(); }
      catch(e){ msg("Could not copy — select the text and copy it by hand."); }
    }
  };

  const fileBtn = sheetIn.querySelector("#fileOut");
  if(fileBtn) fileBtn.onclick = ()=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    a.download = "taracmd-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  };

  sheetIn.querySelector("#doImport").onclick = ()=>{
    const raw = sheetIn.querySelector("#dumpIn").value.trim();
    if(!raw) return msg("Nothing pasted.");
    let obj;
    try{ obj = JSON.parse(raw); }
    catch(e){ return msg("That is not valid JSON — paste the whole backup, braces and all."); }
    if(!obj || typeof obj !== "object" || (!obj.done && !obj.revised))
      return msg("That JSON does not look like a TaraCmd backup.");
    const touched = mergeStore(obj);
    msg(`Merged. ${touched} entr${touched === 1 ? "y" : "ies"} added. <b>${Object.values(store.done).reduce((a, v) => a + v.length, 0)}</b> subtopics ticked in total.`);
    refreshBehind();
  };

  sheet.classList.add("on"); sheetBg.classList.add("on");
}

/* Hardware back on Android, and swipe-down on the grip. */
window.taracmdBack = function(){
  if(drawerOpen()){ closeDrawer(); return true; }
  if(openId){ closeSheet(); return true; }
  if(state.tab==="syllabus" && state.read){ state.read=false; render(); return true; }
  if(state.tab==="syllabus" && (state.openTopics.size || state.open.size)){
    state.openTopics = new Set(); state.open = new Set(); render(); return true;
  }
  if(state.tab!=="syllabus"){ document.querySelector('.tab[data-tab="syllabus"]').click(); return true; }
  return false;
};
(function(){
  const grip = sheet.querySelector(".grip");
  let y0=null;
  grip.addEventListener("pointerdown", e=>{ y0=e.clientY; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener("pointermove", e=>{
    if(y0===null) return;
    const dy = Math.max(0, e.clientY - y0);
    sheet.style.transition="none";
    sheet.style.transform=`translateY(${dy}px)`;
  });
  grip.addEventListener("pointerup", e=>{
    if(y0===null) return;
    const dy = e.clientY - y0; y0=null;
    sheet.style.transition=""; sheet.style.transform="";

  });

})();

/* ---------------- PYQ ---------------- */
const keyYear = y => (KEYS.years || []).find(k=>k.year===y);
const keyPaper = (y,code) => { const k=keyYear(y); return k && k.papers.find(p=>p.code===code); };
const hasLetters = p => !!(p && p.keys && Object.keys(p.keys).length);

/* An exam year is only offered once its exam has actually been sat, so the app
   never shows a year with nothing behind it. Worked out here and not in
   build.py, for the reason nextExam() is: dropping the years at build time made
   build.py's output depend on the day it ran, and content.yml's drift check
   fail on nothing. The Commission puts each paper up the day it is sat, so the
   sitting date is also the publication date.

   Prelims deliberately uses the END OF MAY, not nextExam()'s last-Sunday rule.
   The exact Sunday moves and the exam does not track it: 2025 was sat on the
   26th when the last Sunday was the 25th, and 2026 on the 25th when it was the
   31st. Erring late only delays a year by days; erring early offers a paper
   that does not exist yet. */
const satOn = (kind, y) => kind === "prelims" ? new Date(y, 4, 31) : new Date(y, 8, 1);

function renderPYQ(kind){
  const now = new Date();
  const data = (PYQ[kind] || []).filter(y => satOn(kind, y.year) <= now);
  const label = kind==="prelims" ? "Prelims" : "Mains";
  document.getElementById("brandSub").textContent = "official papers";
  const found = data.reduce((a,y)=>a + y.papers.filter(p=>p.url).length, 0);
  const total = data.reduce((a,y)=>a + y.papers.length, 0);
  view.innerHTML = `
    <div class="head" style="margin-top:6px"><h2>PYQ ${label}</h2><span class="n">${found}/${total} linked</span></div>
    ${data.map(y=>{
      const ky = kind==="prelims" ? keyYear(y.year) : null;
      const keyBtns = !ky ? "" : ky.papers.map(kp=>{
        const nm = kp.code==="gs1" ? "Key GS-I" : "Key CSAT";
        return kp.url
          ? `<a class="pbtn key" href="${esc(kp.url)}" target="_blank" rel="noopener">${nm} ${LINKI}</a>`
          : `<a class="pbtn miss" href="${KEYINDEX}" target="_blank" rel="noopener">${nm} · find</a>`;
      }).join("") + (ky.papers.some(hasLetters)
          ? `<button class="pbtn score" data-score="${y.year}">Score me</button>` : "");
      /* Mains is written, not recognised — so every Mains paper carries a log
         of what your own answers cost you in time, length and marks. */
      const logBtns = kind !== "mains" ? "" : y.papers.map(p=>{
        const st = writeStats(y.year, p.code);
        return `<button class="pbtn log${st ? " has" : ""}" data-log="${y.year}|${p.code}|${esc(shortPaper(p))}">${shortPaper(p)} log${st ? ` <b>${st.n}</b>` : ""}</button>`;
      }).join("");
      return `
      <div class="year">
        <div class="yh"><span class="yn">${y.year}</span><span class="ys">${y.papers.filter(p=>p.url).length}/${y.papers.length}${ky && ky.status==="provisional" ? " · provisional key" : ""}</span></div>
        <div class="papers">
          ${y.papers.map(p=> p.url
            ? `<a class="pbtn" href="${esc(p.url)}" target="_blank" rel="noopener">${shortPaper(p)} ${LINKI}</a>`
            : `<a class="pbtn miss" href="${ARCHIVE}" target="_blank" rel="noopener">${shortPaper(p)} · find</a>`).join("")}
          ${keyBtns}
        </div>
        ${logBtns ? `<div class="papers logs">${logBtns}</div>` : ""}
      </div>`;}).join("")}
    <p class="note">Every link points at the paper on <a href="${ARCHIVE}" target="_blank" rel="noopener">upsc.gov.in</a> — nothing here is a mirror or a re-upload. Dashed buttons are years whose PDF the UPSC archive did not serve up; they open the archive so you can pull the paper yourself.${kind==="prelims" ? ` Answer keys come from the Commission's own <a href="${KEYINDEX}" target="_blank" rel="noopener">answer-key page</a>; there is no official key for Mains, and none has ever been published.` : ""}</p>`;
  view.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{

}
function shortPaper(p){
