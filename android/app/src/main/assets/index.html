/* ---------------- mode 2: papers ----------------
   A paper is a thing you sit, not a list you scroll.

   This replaced "Score a paper", which was a hundred rows of A B C D in one
   continuous column. Two things were wrong with it. It never ended — you
   scrolled through a hundred questions in one go with no sense of place — and
   once you skipped something it was gone, because nothing in the page knew
   you had skipped it.

   So: pick a paper, then one question at a time, with the palette above it
   showing which are answered and which are not. Skipping is a real move, and
   the palette is how you come back — tap the number, or take the next
   unanswered one, which is the button you actually want at the end.

   Papers come from two places and behave differently on purpose:

     typed     a test series whose questions are in the bank. Asked properly.
     key only  a UPSC paper where the Commission published a key but the
               questions are photographs, so there is nothing to ask. Still an
               answer sheet, because a sheet you can score is worth having.
*/

const paperKey = s => [s.name, s.test, s.year].filter(Boolean).join(" · ");
const paperSlug = s => paperKey(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/* Which Series of a paper actually have their questions typed in.
   A, B, C and D are the same hundred questions shuffled, so offering all four
   when only one can ask you anything is offering three empty grids. The other
   three still matter if you sat one of them and want your sheet marked, so
   they are put behind a link rather than removed. */
function setsWithQuestions(year, code){
  const out = new Set();
  for(const q of (QUIZ.questions || [])){
    if(q.paper && q.paper.year === year && q.paper.code === code) out.add(q.paper.set);
  }
  return out;
}

function paperList(){
  const out = [];

  // Test-series papers, grouped by where they came from.
  const bySource = new Map();
  for(const q of (QUIZ.questions || [])){
    if(!q.source) continue;
    const k = paperSlug(q.source);
    if(!bySource.has(k)) bySource.set(k, {id: k, kind: "typed", src: q.source,
                                          name: q.source.name, test: q.source.test || "",
                                          year: q.source.year, questions: []});
    bySource.get(k).questions.push(q);
  }
  const own = (QUIZ.questions || []).filter(q => !q.source && !q.paper);
  if(own.length) bySource.set("taracmd-own", {id: "taracmd-own", kind: "typed",
    name: "Written for this app", test: "", questions: own});

  for(const p of bySource.values()){
    p.questions.sort((a, b) => (a.paper?.n || 0) - (b.paper?.n || 0) || a.id.localeCompare(b.id, undefined, {numeric: true}));
    out.push(p);
  }

  /* UPSC papers the Commission has published a key for — ONE folder each, not
     one per Series. A/B/C/D are the same hundred questions shuffled, so four
     folders offered the same paper four times and made the list look full of
     content it did not have. The set still matters inside the sheet, because
     the answers and the dropped question move with it, so it stays a control
     there rather than a folder here. */
  /* Questions typed against a real UPSC cell, gathered by paper and by Series.
     A question typed for Series B cannot be shown under Series A: it is a
     different number there, with its options in a different order, so these
     never merge. */
  const typed = new Map();
  for(const q of (QUIZ.questions || [])){
    if(!q.paper) continue;
    const k = `${q.paper.year}-${q.paper.code}`;
    if(!typed.has(k)) typed.set(k, {});
    const bySet = typed.get(k);
    if(!bySet[q.paper.set]) bySet[q.paper.set] = new Map();
    bySet[q.paper.set].set(q.paper.n, q);
  }

  for(const y of (KEYS.years || [])){
    for(const pp of y.papers || []){
      const sets = Object.keys(pp.keys || {});
      if(!sets.length) continue;
      const t = typed.get(`${y.year}-${pp.code}`) || {};
      /* Open on a Series whose questions have actually been typed in. Series A
         is the habit, but opening a paper on the one Series that cannot ask you
         anything makes a paper full of questions look like an empty grid. */
      const withQs = sets.filter(s => t[s] && t[s].size);
      const set = withQs[0] || (sets.includes("A") ? "A" : sets[0]);
      out.push({id: `upsc-${y.year}-${pp.code}`, kind: "key", year: y.year,
                name: `UPSC ${y.year}`, test: (KEYS.marking[pp.code] || {}).name || pp.code,
                letters: pp.keys[set], keys: pp.keys, code: pp.code, set, sets, typed: t, url: pp.url});
    }
  }
  return out;
}

/* A UPSC paper is stored per Series, because the numbering, the option order
   and the dropped question all move between A, B, C and D — an answer sheet
   that outlived a change of Series would be marking you against a paper you
   did not sit. The scorer has always keyed on this; the folder did not, so it
   read an id nothing was ever written to and every UPSC paper reported none
   answered however much of it you had filled in. */
const paperId = p => p.kind === "key" ? `${p.year}-${p.code}-${p.set}` : p.id;
const paperTotal = p => p.kind === "typed" ? p.questions.length : p.letters.length;
const paperSheet = p => store.attempts[paperId(p)] || {};
const paperAsked = p => (p.kind === "key" && (p.typed || {})[p.set]) || null;
function paperAnswered(p){
  const s = paperSheet(p);
  return Object.keys(s).filter(k => s[k] !== undefined && s[k] !== null).length;
}

/* Right, wrong and left. A dropped question is not scored and is not counted
   in the total either, which is what the Commission itself does — its own
   pages print "Total Questions 100" and "taken for Scoring 99". */
function paperScore(p){
  const s = paperSheet(p);
  let right = 0, wrong = 0, of = 0;
  if(p.kind === "key"){
    p.letters.forEach((L, i) => {
      if(L === "X") return;
      of++;
      const a = s[i + 1];
      if(a === undefined || a === null) return;
      LET[a] === L ? right++ : wrong++;
    });
  } else {
    of = p.questions.length;
    p.questions.forEach((q, i) => {
      const a = s[i + 1];
      if(a === undefined || a === null) return;
      a === q.answer ? right++ : wrong++;
    });
  }
  return {right, wrong, left: of - right - wrong, of};
}

function renderPaperFolders(root){
  const papers = paperList();
  if(!papers.length){
    root.innerHTML = `<div class="empty">No papers yet. Add questions with a
      <span class="mono">source</span>, or an answer key with letters, and they appear here.</div>`;
    return;
  }
  const open = papers.find(p => p.id === state.qpaperId);
  if(open) return renderPaperRun(root, open);

  root.innerHTML = `
    <div class="head" style="margin-top:2px"><h2>Papers</h2><span class="n">${papers.length}</span></div>
    <div class="plist2">
      ${papers.map(p => {
        const tot = paperTotal(p), done = paperAnswered(p);
        const asked = paperAsked(p);
        /* Say which of the two a paper is, because they are not the same
           thing to sit: one asks you the questions, the other can only take
           the letters you marked somewhere else. */
        const how = p.kind === "typed" ? "asked in full"
          : asked ? `${asked.size} of ${tot} asked in full`
          : "answer sheet only";
        return `<button class="pcard" data-paper="${p.id}">
          <span class="pc-i">${p.kind === "typed" || asked ? "📄" : "🗒"}</span>
          <span class="pc-b">
            <span class="pc-t">${esc(p.name)}${p.test ? ` · ${esc(p.test)}` : ""}</span>
            <span class="pc-s">${tot} question${tot === 1 ? "" : "s"} · ${how}${
              done ? ` · ${done} answered` : ""}</span>
            <span class="pc-bar"><i style="width:${(done / tot * 100).toFixed(1)}%"></i></span>
          </span>
          <span class="pgo">›</span>
        </button>`;
      }).join("")}
    </div>
    <p class="note">A paper opens one question at a time. Skip what you cannot do and the
      palette will bring you back to it.</p>`;

  root.querySelectorAll("[data-paper]").forEach(b => b.onclick = () => {
    state.qpaperId = b.dataset.paper; state.qn = 1; state.qsheet = false; renderQuiz();
  });
}

function renderPaperRun(root, p){
  if(p.kind === "key"){
    state.qyear = p.year; state.qpaper = p.code;
    // Only seed the set. Forcing it on every render would snap the sheet back
    // to Series A the instant you picked another one, and which Series you sat
    // decides both the answers and where the dropped question falls.
    if(!state.qset || !(p.sets || [p.set]).includes(state.qset)) state.qset = p.set;
    // the letters have to follow the Series, or the sheet is marked against a
    // paper you did not sit -- the dropped question alone moves by fifty places
    p.set = state.qset;
    if(p.keys && p.keys[p.set]) p.letters = p.keys[p.set];
    /* A paper with none of its questions typed for this Series has nothing to
       ask, so it keeps the answer sheet — as does a paper you have explicitly
       asked to mark that way, which is what you want when the paper itself is
       open in front of you on paper. */
    if(!paperAsked(p) || state.qsheet){
      root.innerHTML = `<button class="fchip ghost" id="pback">← All papers</button><div id="omrbody"></div>`;
      document.getElementById("pback").onclick = () => {
        state.qpaperId = null; state.qsheet = false; renderQuiz();
      };
      renderScorer(document.getElementById("omrbody"));
      return;
    }
  }

  const key = p.kind === "key" ? p.letters : null;
  const asked = paperAsked(p);
  const withQs = p.kind === "key" ? setsWithQuestions(p.year, p.code) : new Set();
  const runSets = (state.qallsets || !(p.sets || []).some(x => withQs.has(x)))
    ? (p.sets || []) : (p.sets || []).filter(x => withQs.has(x) || x === p.set);
  const total = paperTotal(p);
  const n = Math.min(Math.max(1, state.qn || 1), total);
  const q = asked ? asked.get(n) : p.questions[n - 1];
  const dropped = !!key && key[n - 1] === "X";
  const sheet = paperSheet(p);
  const picked = sheet[n];
  const sc = paperScore(p);
  /* Looking at a question is itself a fact worth keeping: it is what separates
     one you could not do from one you have not reached. Written once, the first
     time a number is shown — not on every render, which would put a full
     stringify of the store behind every tap of the palette. */
  const seen = store.seen[paperId(p)] || (store.seen[paperId(p)] = {});
  if(!seen[n] && !dropped){ seen[n] = 1; save(); }
  /* The FIRST unanswered, not the next one forward. Searching forward from
     where you are walks you onto questions you have never seen and leaves the
     ones you actually skipped behind you — which is the thing this view exists
     to stop. Lowest number first returns you to what you passed over, and
     sweeps up the tail once you reach the end. */
  const firstUnanswered = (() => {
    for(let c = 1; c <= total; c++){
      if(key && key[c - 1] === "X") continue;
      if(c !== n && (sheet[c] === undefined || sheet[c] === null)) return c;
    }
    return null;
  })();

  /* Four blank lettered cells, for a number whose question nobody has typed
     in yet. The alternative is to hide the number, and then the palette stops
     being the paper — you would sit 95 questions and score out of 100. */
  const blanks = LET.map((L, i) => `<button class="opt lonly ${picked === i ? "pick" : ""}"
      data-pick="${i}"><span class="ol">${L}</span></button>`).join("");

  root.innerHTML = `
    <div class="prun-top">
      <button class="fchip ghost" id="pback">← All papers</button>
      <span class="prun-n mono">${n} / ${total}</span>
    </div>
    ${key && runSets.length > 1 ? `<div class="filters" style="margin:2px 0 8px">
      <span class="mut" style="align-self:center;font-size:12px">Series</span>
      ${runSets.map(s => `<button class="fchip ${s === p.set ? "on" : ""}" data-set="${s}">${s}</button>`).join("")}
    </div>` : ""}
    ${key && runSets.length < (p.sets || []).length ? `<p class="note" style="margin:-4px 0 10px">
      Showing Series ${esc(p.set)}, the one whose questions are typed in.
      <button class="linky" id="allsets2">I sat a different Series</button></p>` : ""}
    <div class="palette">
      ${Array.from({length: total}, (_, i) => {
        const k = i + 1, a = sheet[k];
        const drop = key && key[i] === "X";
        const answered = a !== undefined && a !== null;
        /* Three states, and the order matters: answered wins over seen, so a
           question you came back to and answered goes green and stays green. */
        const cls = [drop ? "drop" : answered ? "done" : seen[k] ? "left" : "",
                     k === n ? "here" : ""].filter(Boolean).join(" ");
        return `<button class="pq ${cls}" data-goq="${k}">${k}</button>`;
      }).join("")}
    </div>
    <div class="plegend">
      <span><i class="done"></i>answered</span>
      <span><i class="left"></i>not answered</span>
      <span><i></i>not visited</span>${key ? `
      <span><i></i><s>dropped</s></span>` : ""}
    </div>
    <div class="qcard run">
      <div class="eyebrow">Question ${n}${
        q && q.source ? `<span class="qfrom">${esc(q.source.name)}</span>` : ""}${
        key ? `<span class="qfrom">Set ${p.set}</span>` : ""}</div>
      ${dropped
        ? `<div class="qstem mut">The Commission dropped this question, so it is not asked and not scored. It is still in the paper because the numbering is.</div>`
        : q
          ? `<div class="qstem">${esc(q.q)}</div>
             <div class="opts">
               ${q.options.map((o, i) => `<button class="opt ${picked === i ? "pick" : ""}" data-pick="${i}">
                 <span class="ol">${LET[i]}</span><span>${esc(o)}</span></button>`).join("")}
             </div>`
          : `<div class="qstem mut">This one has not been typed in yet — the Commission publishes its papers as photographs. Mark what you chose and it still scores against the official key.</div>
             <div class="opts row4">${blanks}</div>`}
      <div class="runacts">
        <button class="fchip" id="pprev" ${n === 1 ? "disabled" : ""}>← Previous</button>
        ${picked !== undefined && picked !== null
          ? `<button class="fchip" id="pclear">Clear</button>` : ""}
        <button class="fchip" id="pnext" ${n === total ? "disabled" : ""}>Skip →</button>
      </div>
    </div>
    <div class="sgrid" style="margin:16px 0 6px">
      <span>answered <b class="mono">${sc.right + sc.wrong}</b></span>
      <span>left <b class="mono">${sc.left}</b></span>
      ${firstUnanswered ? `<span><button class="linky" id="pnextun">back to the first unanswered → ${firstUnanswered}</button></span>` : ""}
    </div>
    ${sc.left === 0
      ? `<div class="score"><span class="big">${sc.right}</span><span class="lil">right of ${sc.of}</span>
           <div class="sgrid"><span>right <b>${sc.right}</b></span><span>wrong <b>${sc.wrong}</b></span>
             <span>accuracy <b>${Math.round(sc.right / sc.of * 100)}%</b></span></div>
           <div class="act"><button class="prim" id="pclearall">Clear the sheet</button></div></div>
         <p class="note">Every question answered. The palette above is still there if you want to change one.</p>`
      : `<p class="note">Nothing is marked right or wrong until the paper is finished — this is a
           paper, not a flashcard. Skipped questions stay hollow in the palette.</p>`}
    ${key ? `<p class="note"><button class="linky" id="psheet">Mark it as a plain answer sheet
       instead</button> — the whole hundred on one grid, for when the paper is open in
       front of you.</p>` : ""}`;

  const rerender = () => { save(); renderQuiz(); };
  document.getElementById("pback").onclick = () => { state.qpaperId = null; renderQuiz(); };
  root.querySelectorAll("[data-goq]").forEach(b => b.onclick = () => { state.qn = +b.dataset.goq; renderQuiz(); });
  root.querySelectorAll("[data-set]").forEach(b => b.onclick = () => {
    // the sheet is per Series, so this changes which answers are on screen
    state.qset = b.dataset.set; renderQuiz();
  });
  root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    store.attempts[paperId(p)] = Object.assign({}, sheet, {[n]: +b.dataset.pick});
    // answering moves you on, because stopping to admire an answer is not what
    // sitting a paper feels like
    state.qn = Math.min(total, n + 1);
    rerender();
  });
  const clear = document.getElementById("pclear");
  if(clear) clear.onclick = () => {
    const s = Object.assign({}, sheet); delete s[n];
    store.attempts[paperId(p)] = s; rerender();
  };
  const prev = document.getElementById("pprev");
  if(prev) prev.onclick = () => { state.qn = n - 1; renderQuiz(); };
  const next = document.getElementById("pnext");
  if(next) next.onclick = () => { state.qn = n + 1; renderQuiz(); };
  const nu = document.getElementById("pnextun");
  if(nu) nu.onclick = () => { state.qn = firstUnanswered; renderQuiz(); };
  const as2 = document.getElementById("allsets2");
  if(as2) as2.onclick = () => { state.qallsets = true; renderQuiz(); };
  const sh = document.getElementById("psheet");

/* ---------------- the shelf ----------------
   Somewhere to keep your own documents, and the whole point of it is where
   they are kept rather than that they are listed.

   Every directory this app owns is deleted when the app is — getExternalFilesDir
   and filesDir both — so keeping the files there would lose them on the next
   uninstall, which is exactly what was asked not to happen. Instead the owner
   picks a folder once, anywhere in ordinary storage, and Android hands the app
   a persistable grant to it. The files live in the phone's own Documents (or
   wherever was picked), show up in the phone's Files app, and an uninstall
   cannot touch them.

   What an uninstall does take is the grant, not the files. After a reinstall
   the folder is pointed at once more and the shelf is back exactly as it was.
   The page says that plainly rather than implying the app is holding them. */

const docsOk = () => !!(NATIVE && NATIVE.docsList);

function docsAll(){
  if(!docsOk()) return [];
  try{ return JSON.parse(NATIVE.docsList() || "[]"); }catch(e){ return []; }
}

const KB = 1024;
function sizeOf(n){
  if(!n && n !== 0) return "";
  if(n < KB) return n + " B";
  if(n < KB * KB) return (n / KB).toFixed(0) + " KB";
  return (n / KB / KB).toFixed(n < 10 * KB * KB ? 1 : 0) + " MB";
}

const DOC_ICON = m => /pdf/i.test(m) ? "📕"
  : /image|png|jpe?g|webp|gif/i.test(m) ? "🖼"
  : /word|document|rtf|odt/i.test(m) ? "📘"
  : /sheet|excel|csv/i.test(m) ? "📗"
  : /presentation|powerpoint/i.test(m) ? "📙"
  : /text|plain|markdown/i.test(m) ? "📄" : "📎";

function renderDocs(){
  document.getElementById("brandSub").textContent = "your documents";

  if(!docsOk()){
    view.innerHTML = `
      <div class="head" style="margin-top:6px"><h2>Shelf</h2></div>
      <div class="empty">The shelf needs the Android app.<br><br>
        It keeps your documents in a folder you pick on the phone itself, which is
        something a web page is not allowed to do — a browser can hand you a file, but
        it cannot put one somewhere that outlives it.</div>
      <p class="note">Everything else in the app works here. Install the APK and this tab
        fills in.</p>`;
    return;
  }

  const folder = (() => { try{ return NATIVE.docsFolder(); }catch(e){ return null; } })();
  if(!folder){
    view.innerHTML = `
      <div class="head" style="margin-top:6px"><h2>Shelf</h2></div>
      <div class="qcard">
        <div class="qstem">Pick a folder for your documents.</div>

          <span class="mono">Documents</span> is the obvious one. Your files go there rather
          than inside the app, so <b>uninstalling TaraCmd will not delete them</b>. They stay
          visible in the phone's own Files app the whole time.</p>
        <p class="note">If you reinstall the app, point it at the same folder again and the
          whole shelf comes back. Android gives the permission to the app, and taking the app
          away takes the permission with it — never the files.</p>
        <div class="act" style="margin-top:12px"><button class="prim" id="dpick">Choose the folder</button></div>
      </div>`;
    document.getElementById("dpick").onclick = () => { try{ NATIVE.docsPick(); }catch(e){} };
    return;
  }

  const docs = docsAll();
  view.innerHTML = `
    <div class="head" style="margin-top:6px"><h2>Shelf</h2><span class="n">${docs.length}</span></div>
    <div class="dbar">
      <span class="dfolder mono">📁 ${esc(folder)}</span>
      <button class="fchip" id="dfold">Change</button>
      <button class="fchip on" id="dadd">Add documents</button>
    </div>
    ${docs.length ? `<div class="dlist">
      ${docs.map(d => `<div class="drow">
        <button class="dopen" data-doc="${esc(d.id)}">
          <span class="di">${DOC_ICON(d.mime || "")}</span>
          <span class="db">
            <span class="dn">${esc(d.name)}</span>
            <span class="ds mono">${sizeOf(d.size)}${d.on ? " · " + new Date(d.on).toLocaleDateString() : ""}</span>
          </span>
        </button>
        <button class="dx" data-del="${esc(d.id)}" title="Remove">×</button>
      </div>`).join("")}
    </div>` : `<div class="empty">Nothing on the shelf yet. <b>Add documents</b> copies them into
      <span class="mono">${esc(folder)}</span>, where they stay whatever happens to the app.</div>`}
    <p class="note">These are your files, kept outside the app on purpose. Removing one here
      deletes it from that folder too — the shelf is the folder, not a copy of it.</p>`;

  document.getElementById("dfold").onclick = () => { try{ NATIVE.docsPick(); }catch(e){} };
  document.getElementById("dadd").onclick = () => { try{ NATIVE.docsAdd(); }catch(e){} };
  view.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => {
    try{ NATIVE.docsOpen(b.dataset.doc); }catch(e){}
  });
  view.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const row = b.closest(".drow");
    const name = row ? row.querySelector(".dn").textContent : "this document";
    if(!confirm(`Delete ${name} from ${folder}?\n\nThis removes the file itself, not just the listing.`)) return;
    try{ NATIVE.docsRemove(b.dataset.del); }catch(e){}

  });

/* ---------------- mode 0: the daily current-affairs quiz ----------------
   The questions stay on the publisher's site. This derives each day's URL from
   the date, opens it, and keeps the score — the app indexes and it does not
   mirror, and a day's quiz is somebody's editorial product for that day.

   Deriving beats harvesting an index here: the URL falls out of the calendar,
   so a page built in September still knows March's address. Nothing to fetch,
   nothing to go stale. */
const MONTHS = ["january","february","march","april","may","june",
                "july","august","september","october","november","december"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function dailyUrl(src, d){
  return src.url
    .replace(/{yyyy}/g, d.getFullYear())
    .replace(/{mm}/g, String(d.getMonth()+1).padStart(2,"0"))
    .replace(/{dd}/g, String(d.getDate()).padStart(2,"0"))
    .replace(/{d}/g, d.getDate())
    .replace(/{month}/g, MONTHS[d.getMonth()]);
}
const publishesOn = (src, d) => !(src.skips || []).includes(d.getDay());

/* Consecutive logged days, walking back from today and stepping over the days
   the publisher does not publish on. */
function dailyStreak(src){
  let n = 0;
  const d = new Date();
  for(let i = 0; i < 400; i++){
    const key = isoDay(d);
    if(publishesOn(src, d)){
      if(store.daily[key]) n++;
      else if(i > 0) break;          // today not yet done is not a broken streak
    }
    d.setDate(d.getDate() - 1);
  }
  return n;
}

function renderDaily(root){
  const src = (DAILY.sources || [])[0];
  if(!src){ root.innerHTML = `<div class="empty">No daily quiz source configured.</div>`; return; }

  const today = new Date();
  const logged = Object.keys(store.daily).length;
  const scored = Object.values(store.daily).filter(a => a.of);
  const pct = scored.length
    ? Math.round(scored.reduce((a,x)=>a + x.score/x.of, 0) / scored.length * 100) : null;
  const streak = dailyStreak(src);

  const rows = [];
  for(let i = 0; i < 14; i++){
    const d = new Date(); d.setDate(today.getDate() - i);
    rows.push({d, key: isoDay(d), open: publishesOn(src, d)});
  }

  const tKey = isoDay(today), tMine = store.daily[tKey];
  root.innerHTML = `
    <div class="score">
      <span class="lil">${DAYS[today.getDay()]}, ${today.getDate()} ${MONTHS[today.getMonth()].replace(/^./,c=>c.toUpperCase())} ${today.getFullYear()}</span>
      ${publishesOn(src, today)
        ? `<span class="big">${tMine && tMine.of ? tMine.score + "/" + tMine.of : "—"}</span>
           <span class="lil">${tMine ? "logged for today" : "today's " + esc(src.name) + " quiz, " + src.questions + " questions"}</span>`
        : `<span class="big" style="font-size:19px">No quiz today</span>
           <span class="lil">${esc(src.name)} does not publish on ${DAYS[today.getDay()]}s</span>`}
      <div class="sgrid">
        <span>streak <b class="mono">${streak}</b></span>
        <span>logged <b class="mono">${logged}</b></span>
        ${pct !== null ? `<span>average <b class="mono">${pct}%</b></span>` : ""}
      </div>
      <div class="act">
        ${publishesOn(src, today)
          ? `<a class="prim" href="${esc(dailyUrl(src, today))}" target="_blank" rel="noopener">Open today's quiz ${LINKI}</a>` : ""}
        <a href="${esc(src.index)}" target="_blank" rel="noopener">All quizzes ${LINKI}</a>
      </div>
    </div>
    ${publishesOn(src, today) ? `<div class="wform" style="margin:0 0 4px">
      <label>scored<input id="dsc" type="number" min="0" max="100" inputmode="numeric" value="${tMine ? tMine.score : ""}" placeholder="4"></label>
      <label>of<input id="dof" type="number" min="1" max="100" inputmode="numeric" value="${tMine ? tMine.of : src.questions}"></label>
      <button class="revbtn" id="dlog">${tMine ? "Update" : "Log today"}</button>
      ${tMine ? `<button class="revbtn" id="ddel">Clear</button>` : ""}
    </div>` : ""}
    <p class="note">The questions live on <a href="${esc(src.index)}" target="_blank" rel="noopener">${esc(src.name)}</a> and stay there — this keeps the address and your score, nothing more. ${esc(src.note || "")}</p>

    <div class="head"><h2>Last two weeks</h2><span class="n">${rows.filter(r=>store.daily[r.key]).length}/${rows.filter(r=>r.open).length}</span></div>
    <div class="list">
      ${rows.map(r=>{
        const mine = store.daily[r.key];
        const label = `${DAYS[r.d.getDay()].slice(0,3)} ${r.d.getDate()} ${MONTHS[r.d.getMonth()].slice(0,3).replace(/^./,c=>c.toUpperCase())}`;
        if(!r.open) return `<div class="wrow" style="opacity:.45">
          <span class="wq mono" style="background:var(--sunk);color:var(--ink-3)">—</span>
          <span class="wbody"><span class="wmeta">${label}</span><span class="wdate">no quiz</span></span></div>`;
        return `<div class="wrow">
          <span class="wq mono" ${mine ? "" : 'style="background:var(--sunk);color:var(--ink-3)"'}>${mine && mine.of ? mine.score + "/" + mine.of : "·"}</span>
          <span class="wbody">
            <span class="wmeta">${label}</span>
            <span class="wdate">${mine ? (mine.of ? Math.round(mine.score/mine.of*100) + "%" : "logged") : "not logged"}</span>
          </span>
          <a class="ext" href="${esc(dailyUrl(src, r.d))}" target="_blank" rel="noopener" aria-label="Open ${label}">${LINKI}</a>
        </div>`;
      }).join("")}
    </div>
    <p class="note">A missing link is usually a day the set went up late or not at all — <a href="${esc(src.index)}" target="_blank" rel="noopener">the index</a> is the fallback. Add another source in <span class="mono">content/daily.json</span>; the date is substituted into whatever URL shape it uses.</p>`;

  const log = root.querySelector("#dlog");
  if(log) log.onclick = ()=>{
    const s = root.querySelector("#dsc").value.trim(), o = root.querySelector("#dof").value.trim();
    if(s === "") return;
    store.daily[tKey] = {score: +s, of: +o || src.questions, src: src.id};
    save(); renderQuiz();
  };
  const del = root.querySelector("#ddel");
  if(del) del.onclick = ()=>{ delete store.daily[tKey]; save(); renderQuiz(); };
}

/* --- mode 1: punch in your answers, score against the official key --- */
function renderScorer(root){
  const years = (KEYS.years||[]).filter(y=>y.papers.some(hasLetters));
  if(!years.length){
    root.innerHTML = `<div class="empty">No answer key has been loaded yet.<br><br>
      The Commission publishes its keys as scans — a photograph of a printed grid,
      with no text in the file — so they cannot simply be read out of the PDF.</div>
      <p class="note">Every key that has been published is linked on the Prelims tab, and
      opens the Commission's own PDF. Scoring here needs the letters typed in or read by
      OCR first; until then this tab stays empty rather than pretending otherwise.</p>`;
    return;
  }
  if(!state.qyear || !years.some(y=>y.year===state.qyear)) state.qyear = years[0].year;
  const yr = years.find(y=>y.year===state.qyear);
  const papers = yr.papers.filter(hasLetters);
  if(!state.qpaper || !papers.some(p=>p.code===state.qpaper)) state.qpaper = papers[0].code;
  const paper = papers.find(p=>p.code===state.qpaper);
  const sets = Object.keys(paper.keys);
  if(!state.qset || !sets.includes(state.qset)) state.qset = sets[0];

  const aid = `${yr.year}-${paper.code}-${state.qset}`;
  const mine = store.attempts[aid] || {};
  const mark = KEYS.marking[paper.code];
  const key = paper.keys[state.qset];
  /* A dropped question is marked X in the key, and lands at a different
     number in each Series — 2022 GS-I dropped one, at 61 in Set A but 11 in
     Set D. So it has to be read off the set you actually sat, not from a list
     hanging off the paper. */
  const dropped = new Set(key.reduce((a, k, i) => (k === "X" ? [...a, i + 1] : a), []));

  /* Questions typed in against this exact set, by question number. Nothing is
     scraped: the Commission publishes its papers as scans with no text layer,
     so these are typed by hand, and build.py marks each one against the
     official key before it ships. */
  const written = {};
  for(const w of (QUIZ.questions || [])){
    const t = w.paper;
    if(t && t.year === yr.year && t.code === paper.code && t.set === state.qset) written[t.n] = w;
  }
  const typed = Object.keys(written).length;

  let right=0, wrong=0, blank=0;
  key.forEach((k,i)=>{
    const q = i+1;
    if(dropped.has(q)) return;
    const a = mine[q];
    if(!a) blank++; else if(a===k) right++; else wrong++;
  });
  const marks = right*mark.correct + wrong*mark.wrong;
  const answered = right + wrong;
  /* Only the Series that can ask you something, unless you say otherwise —
     the other three are the same paper with the questions in another order,
     and shown as chips they read as three more papers than there are. */
  const asked = setsWithQuestions(yr.year, paper.code);
  const shownSets = (state.qallsets || !sets.some(x => asked.has(x)))
    ? sets : sets.filter(x => asked.has(x) || x === state.qset);

  root.innerHTML = `
    <div class="filters">
      ${years.map(y=>`<button class="fchip ${y.year===state.qyear?"on":""}" data-yr="${y.year}">${y.year}</button>`).join("")}
    </div>
    <div class="filters">
      ${papers.map(p=>`<button class="fchip ${p.code===state.qpaper?"on":""}" data-pp="${p.code}">${KEYS.marking[p.code].name}</button>`).join("")}
      ${shownSets.map(s=>`<button class="fchip ${s===state.qset?"on":""}" data-set="${s}">Set ${s}</button>`).join("")}
      ${shownSets.length < sets.length
        ? `<button class="fchip ghost" id="allsets">I sat a different Series</button>` : ""}
    </div>
    <div class="score">
      <span class="big">${answered ? marks.toFixed(2) : "—"}</span>
      <span class="lil">out of ${mark.total}${mark.qualifying ? ` · qualifying at ${mark.qualifying_pct}% (${(mark.total*mark.qualifying_pct/100).toFixed(0)})` : ""}</span>
      <div class="sgrid">
        <span>right <b>${right}</b></span><span>wrong <b>${wrong}</b></span>
        <span>left <b>${blank}</b></span>
        ${dropped.size ? `<span>dropped <b>${dropped.size}</b></span>` : ""}
        <span>accuracy <b>${answered ? Math.round(right/answered*100) : 0}%</b></span>
      </div>
      <div class="act">
        <button class="prim" data-clear="1">Clear sheet</button>
        ${paper.url ? `<a href="${esc(paper.url)}" target="_blank" rel="noopener">Official key ${LINKI}</a>` : ""}
      </div>
    </div>
    <p class="note">Open the paper on the Prelims tab, mark your answers here, and this scores them
      against the Commission's key using its own scheme — ${mark.correct} for a right answer,
      ${mark.wrong} for a wrong one${dropped.size ? `. ${dropped.size} question${dropped.size>1?"s were":" was"} dropped that year and ${dropped.size>1?"are":"is"} left out of the total` : ""}.</p>
    ${typed ? `<p class="note" style="margin-top:0"><b>${typed}</b> of ${key.length} questions on this
      set have been typed in, so they are asked properly below. The rest stay as letters until
      someone types them — the Commission publishes the paper as a scan, with no text to lift.</p>` : ""}
    <div class="omr">
      ${key.map((k,i)=>{
        const q=i+1, a=mine[q], out=dropped.has(q);
        const w = written[q];
        /* A question that has been typed in is asked properly: the stem, and
           four options you read and choose between. One that has not is still
           a lettered cell, because a blank row of A B C D is at least honest
           about being an answer sheet. The two live in the same grid so the
           paper fills in as it is typed rather than switching mode. */
        if(w && !out) return `<div class="cell wide">
          <span class="cq"><b class="mono">${q}</b> ${esc(w.q)}</span>
          <span class="copts">${w.options.map((o, oi) => `
            <button class="copt ${a === LET[oi] ? "on" : ""}" data-q="${q}" data-a="${LET[oi]}">
              <i>${LET[oi]}</i>${esc(o)}</button>`).join("")}</span>
          ${a ? `<span class="cwhy ${a === k ? "ok" : "no"}">${a === k ? "Right" : `Wrong — the key says ${k}`}${
            w.why ? ` · ${esc(w.why)}` : ""}</span>` : ""}
        </div>`;
        return `<div class="cell" ${out?'style="opacity:.4"':""}>
          <span class="cn">${q}${out?" ×":""}</span>
          <span class="cb">${LET.map(L=>`<button class="${a===L?"on":""}" data-q="${q}" data-a="${L}">${L}</button>`).join("")}</span>
        </div>`;
      }).join("")}
    </div>`;

  /* Inside a paper's folder these chips were dead: renderPaperRun pins
     state.qyear and state.qpaper to the folder on every render, so setting
     them here was overwritten before anything drew. Move the folder instead —
     the chips are how you cross from one year to another without going back
     to the list, and with ten years on the shelf that is worth having. */
  const goPaper = (year, code) => {
    if(state.qpaperId) state.qpaperId = `upsc-${year}-${code}`;
    state.qn = 1; state.qallsets = false; renderQuiz();
  };
  root.querySelectorAll("[data-yr]").forEach(b=>b.onclick=()=>{
    const y = +b.dataset.yr;
    state.qyear = y; state.qset = null;
    // keep the paper you were on if that year has it
    const yy = (KEYS.years||[]).find(x=>x.year===y);
    const has = (yy?.papers||[]).some(x=>x.code===state.qpaper && hasLetters(x));
    if(!has) state.qpaper = null;
    goPaper(y, state.qpaper || ((yy?.papers||[]).filter(hasLetters)[0]||{}).code);
  });
  root.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>{
    state.qpaper=b.dataset.pp; state.qset=null; goPaper(state.qyear, b.dataset.pp);
  });
  root.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{state.qset=b.dataset.set;renderQuiz();});
  const as = document.getElementById("allsets");
  if(as) as.onclick = () => { state.qallsets = true; renderQuiz(); };
  root.querySelector("[data-clear]").onclick=()=>{ delete store.attempts[aid]; save(); renderQuiz(); };
  root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const y = window.scrollY;
    const q = +b.dataset.q, a = b.dataset.a;
    const cur = store.attempts[aid] || (store.attempts[aid] = {});
    cur[q] === a ? delete cur[q] : cur[q] = a;
    save(); renderQuiz(); window.scrollTo(0,y);
  });
}

/* --- mode 2: the authored practice bank --- */

/* ---------------- shell ---------------- */
const backBtn = document.getElementById("backBtn"), brand = document.getElementById("brand");
/* Prelims, Mains and Optional were three of seven tabs and one idea: the
   Commission's question papers. They are one tab with a segment now, which is
   the same control the syllabus lens and the practice modes already use. */
const PAPER_SEGS = [["prelims", "Prelims"], ["mains", "Mains"], ["optional", "Optional"]];

function renderPapers(){
  view.innerHTML = `<div class="seg segwide" id="pseg">
      ${PAPER_SEGS.map(([k, l]) => `<button class="${state.pset === k ? "on" : ""}" data-pseg="${k}">${l}</button>`).join("")}
    </div><div id="papersview"></div>`;
  const into = document.getElementById("papersview");
  // The three renderers each write to `view`, so they are pointed at the panel
  // below the segment instead and put back afterwards.
  const real = view;
  try{
    view = into;
    if(state.pset === "optional") renderOptional(); else renderPYQ(state.pset);
  } finally { view = real; }
  document.querySelectorAll("[data-pseg]").forEach(b => b.onclick = () => {
    state.pset = b.dataset.pseg; render();
  });
}

function render(){
  backBtn.classList.add("hide");
  brand.classList.remove("hide");
  if(state.tab==="syllabus") renderSyllabus();
  else if(state.tab==="papers") renderPapers();
  else if(state.tab==="focus") renderFocus();
  else if(state.tab==="practice") renderQuiz();
  else if(state.tab==="docs") renderDocs();
  else renderToppers();
  window.scrollTo(0,0);
}
backBtn.onclick = ()=>{ render(); };
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  state.tab = b.dataset.tab; state.filter="all"; state.read=false;
  markTab(state.tab);
  render();
});

/* Toppers is reached from the drawer, so no tab is lit for it — but the bar
   must not keep the previous tab lit either, or it would claim you are
   somewhere you are not. */
function markTab(tab){
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.tab === tab));
}

/* ---------------- the drawer ----------------
   Button-opened, never edge-swiped: on Android 10+ a swipe in from either
   edge is the system Back gesture, and an app cannot reliably take that edge
   from the OS. Trying would make Back unreliable, which is worse than not
   having the gesture. */
const drawer = document.getElementById("drawer"), drawerBg = document.getElementById("drawerBg");
const drawerOpen = () => drawer.classList.contains("on");
function openDrawer(){
  drawer.classList.add("on"); drawerBg.classList.add("on");
  drawer.setAttribute("aria-hidden", "false");
  markTheme(); markVersion();
}
function closeDrawer(){
  drawer.classList.remove("on"); drawerBg.classList.remove("on");
  drawer.setAttribute("aria-hidden", "true");
}
document.getElementById("menuBtn").onclick = openDrawer;
document.getElementById("drawerX").onclick = closeDrawer;
drawerBg.onclick = closeDrawer;
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
  closeDrawer();
  state.tab = b.dataset.go; state.read = false;
  markTab(state.tab);
  render();
});
document.getElementById("dRead").onclick = () => {
  closeDrawer();
  state.tab = "syllabus"; state.read = true;
  markTab("syllabus");
  render();
};
document.getElementById("dData").onclick = () => { closeDrawer(); openData(); };

/* Updates.
   The app cannot check for itself: the repository is private, so any version
   check would need a token, and a token in a page that ships to a phone is a
   token you have given away. What it can do is say exactly what is installed
   and open the place the newer one lives, where you are already signed in.

   Installing over the top works from this build onwards. Every APK before it
   was signed by a different throwaway key, because a fresh CI runner makes a
   new debug keystore each run, and Android will not update an app whose
   signing key changed — which is why it kept asking to uninstall first. */
const RELEASES = "https://github.com/NovaGod-25/taracmd/actions/workflows/android.yml";
function appVersion(){
  if(NATIVE && NATIVE.appVersion){ try{ return NATIVE.appVersion() || null; }catch(e){} }
  return null;
}
function markVersion(){
  const el = document.getElementById("dVer");
  if(!el) return;
  const v = appVersion();
  el.textContent = v
    ? `Version ${v} installed · open the build page`
    : "Open the build page — version is only known inside the app";
}
document.getElementById("dUpdate").onclick = () => {
  closeDrawer();
  open(RELEASES, "_blank", "noopener");
};

/* Three states, not a toggle: the third is "follow the phone", which a
   two-way switch cannot express and which is the sensible default. */
function markTheme(){
  const cur = store.theme || "system";
  document.querySelectorAll("[data-theme-set]").forEach(b =>
    b.classList.toggle("on", b.dataset.themeSet === cur));
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => {
  store.theme = b.dataset.themeSet === "system" ? null : b.dataset.themeSet;
  save(); applyTheme(store.theme); markTheme();
});

/* theme toggle — remembered across launches */
const themeBtn = document.getElementById("themeBtn");
const MOON = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
const SUN  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>';
function systemDark(){
  return typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  const dark = t ? t==="dark" : systemDark();
  document.getElementById("themeIcon").innerHTML = dark ? SUN : MOON;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.remove());
  const m = document.createElement("meta");
  m.name = "theme-color"; m.content = dark ? "#0E131B" : "#EDEFF2";
  document.head.appendChild(m);
}
themeBtn.onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : systemDark();
  store.theme = dark ? "light" : "dark";
  save();
  applyTheme(store.theme);
};
applyTheme(store.theme);
/* A session in flight outranks whatever tab you were on. The app being killed
   and restarted mid-session is the normal case here, not an edge one: it is
   pinned to the screen for an hour and the OS may reclaim it at any point.
   Coming back to the syllabus with the clock still running would look like the
   session had been lost. */
if(store.focusRun && store.focusRun.start){
  // The pin does not survive the activity being recreated, but the session
  // does. Ask for it again, or the clock would run on with nothing holding
  // the phone — which is the one dishonesty this tab must not commit.
  if(!focusDone(store.focusRun) && NATIVE && NATIVE.focusStart){
    try{ NATIVE.focusStart(store.focusRun.mins); }catch(e){}
  }
  state.tab = "focus";
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.tab === "focus"));
}

addEventListener("scroll", ()=>document.getElementById("top").classList.toggle("scrolled", scrollY>4), {passive:true});

render();
</script>

</body>
