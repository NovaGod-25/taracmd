<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<meta name="description" content="Subject-wise revision desk for the Civil Services Examination.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TaraCmd">
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<!--/PWA-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232E3D97'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EU%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232E3D97'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EU%3C/text%3E%3C/svg%3E">
<title>TaraCmd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
:root{
  --paper:#EDEFF2; --card:#FFFFFF; --card-2:#F5F7F9; --sunk:#E4E8ED;
  --ink:#141C2B; --ink-2:#4A5769; --ink-3:#7A879A;
  --rule:#DBE0E8; --rule-2:#C7CFDA;
  --accent:#2E3D97; --accent-ink:#2E3D97; --accent-soft:#E6E9F8;
  --mark:#B32E1C; --mark-soft:#FAE7E4;
  --amber:#8A6009; --amber-soft:#F7EEDC;
  --shadow:0 1px 2px rgba(20,28,43,.06), 0 8px 24px -12px rgba(20,28,43,.18);
  --tab-h:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E131B; --card:#161D28; --card-2:#1C2531; --sunk:#111823;
    --ink:#E7ECF3; --ink-2:#A6B2C4; --ink-3:#73819A;
    --rule:#28313F; --rule-2:#374355;
    --accent:#93A8F7; --accent-ink:#B3C2FB; --accent-soft:#1E2743;
    --mark:#F0958A; --mark-soft:#3A231F;
    --amber:#DBAC55; --amber-soft:#33280F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0E131B; --card:#161D28; --card-2:#1C2531; --sunk:#111823;
  --ink:#E7ECF3; --ink-2:#A6B2C4; --ink-3:#73819A;
  --rule:#28313F; --rule-2:#374355;
  --accent:#93A8F7; --accent-ink:#B3C2FB; --accent-soft:#1E2743;
  --mark:#F0958A; --mark-soft:#3A231F;
  --amber:#DBAC55; --amber-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent-ink);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:780px;margin:0 auto;padding:0 14px calc(var(--tab-h) + 28px)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--paper);padding:12px 0 8px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--rule)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand h1{font-size:19px;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--rule);background:var(--card)}
.iconbtn:hover{color:var(--ink);border-color:var(--rule-2)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.back{margin-right:auto;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;font-weight:500;padding:6px 0}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- search ---------- */
.searchwrap{position:relative;margin:2px 0 14px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linecap:round}
#q{width:100%;padding:11px 12px 11px 36px;border-radius:11px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-size:14.5px}
#q::placeholder{color:var(--ink-3)}
#q:focus{border-color:var(--accent);outline:none}

/* ---------- subject grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.sub-card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:13px 13px 11px;
  text-align:left;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.sub-card:hover{transform:translateY(-1px);border-color:var(--rule-2)}
.sub-card .em{font-size:19px;line-height:1}
.sub-card .nm{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:15px;line-height:1.25}
.sub-card .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  display:flex;justify-content:space-between;align-items:center;letter-spacing:.02em}
.bar{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden}
/* Grid stretches every card in a row to the tallest. Without this the bar and
   the count stay top-aligned, so a subject whose name wraps to two lines
   ("International Relations") leaves its neighbour's footer floating. */
.sub-card .bar{margin-top:auto}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* ---------- section heads ---------- */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.head h2{font-size:16px}
.head .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.03em}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- topic rows ---------- */
.list{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;
  border-bottom:1px solid var(--rule);position:relative}
.row:last-child{border-bottom:none}
.row:hover{background:var(--card-2)}
.stripe{width:3px;align-self:stretch;border-radius:99px;flex:none;background:var(--rule-2)}
.stripe.high{background:var(--mark)}
.stripe.medium{background:var(--amber)}
.stripe.low{background:var(--rule-2)}
.row .body{flex:1;min-width:0;display:block}
.row .t,.row .s{display:block}
.row .t{font-weight:500;font-size:14.5px;line-height:1.35}
.row .s{color:var(--ink-3);font-size:12.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.03em;padding:2px 6px;border-radius:5px;
  background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.p{background:var(--accent-soft);color:var(--accent-ink)}
.chip.e{background:var(--amber-soft);color:var(--amber)}
.chip.due{background:var(--mark-soft);color:var(--mark)}
.chip.sched{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule)}
.tick{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--rule-2);display:grid;place-items:center;
  margin-top:1px;color:transparent}
.tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tick.on,
:root:not([data-theme="light"]) .tick.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tick.on{color:#fff}}
.tick svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:99px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-2);white-space:nowrap}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .fchip.on,
:root:not([data-theme="light"]) .fchip.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fchip.on{color:#fff}}

/* ---------- weight legend ---------- */
.legend{display:flex;gap:14px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  margin:0 0 10px;padding:0 2px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:3px;border-radius:99px;display:block}

/* ---------- year / paper cards ---------- */
.year{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.year .yh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.year .yn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;letter-spacing:-.01em}
.year .ys{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.papers{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:9px;
  border:1px solid var(--rule);background:var(--card-2);color:var(--ink)}
.pbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.pbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.pbtn.miss{color:var(--ink-3);border-style:dashed;background:transparent}
.pbtn.miss:hover{color:var(--ink-2);border-color:var(--rule-2)}

/* ---------- toppers ---------- */
.tcard{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--rule)}
.tcard:last-child{border-bottom:none}
.tcard{color:var(--ink)}
.tcard:hover{background:var(--card-2)}
.rank{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rank.top{background:var(--accent-soft);color:var(--accent-ink)}
.tcard .nm{font-weight:500;font-size:14.5px;display:block}
.tcard .mt{font-size:12px;color:var(--ink-3);margin-top:2px;display:block}
.ext{flex:none;color:var(--ink-3)}
.ext svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- detail sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,24,.45);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-radius:18px 18px 0 0;max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px -12px rgba(0,0,0,.4)}
.sheet.on{transform:translateY(0)}
@media(min-width:700px){.sheet{max-width:640px;margin:0 auto;border-radius:18px;bottom:24px;left:16px;right:16px;max-height:80vh}}
.sheet .grip{width:36px;height:4px;border-radius:99px;background:var(--rule-2);margin:9px auto 0}
.sheet .inner{padding:14px 18px 26px}
.sheet h3{font-size:19px;line-height:1.28;margin-bottom:8px}
.sheet .why{background:var(--card-2);border:1px solid var(--rule);border-radius:11px;padding:10px 12px;margin:12px 0 16px;
  font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start}
.sheet .why b{color:var(--ink);font-weight:600}
.sheet .why > span:last-child{display:block}
.subtopics{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.subtopics li{border-top:1px solid var(--rule)}
.subtopics button{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:11px 2px;font-size:14px;line-height:1.4}
.subtopics button.done .lbl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.progline{display:flex;align-items:center;gap:9px;margin:14px 0 4px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.progline .bar{flex:1}

/* ---------- revision footer ---------- */
.revline{display:flex;align-items:center;gap:11px;margin-top:16px;padding-top:13px;
  border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2);line-height:1.45}
.revline > span{flex:1}
.revline b{color:var(--mark)}
.revbtn{flex:none;padding:7px 12px;border-radius:9px;border:1px solid var(--rule-2);
  background:var(--card-2);font-size:12.5px;font-weight:500;color:var(--ink)}
.revbtn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
/* Six columns is 62px each on a 375px phone. The labels still fit at 9.5px,
   but only just — a seventh tab would not, and this is the reason to fold new
   surfaces into existing tabs instead. */
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 1px 8px;color:var(--ink-3);font-size:9.5px;font-weight:500;
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink)}

/* ---------- sheet close ---------- */
.sheet .grip{cursor:grab;touch-action:none;padding:0}
.sheethead{display:flex;align-items:flex-start;gap:10px}
.sheethead > div{flex:1;min-width:0}
.xbtn{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--rule);background:var(--card-2);margin-top:2px}
.xbtn:hover{color:var(--ink);border-color:var(--rule-2)}
.xbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ---------- answer keys ---------- */
.pbtn.key{border-style:solid;background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.pbtn.key:hover{border-color:var(--accent)}
.pbtn.score{background:transparent;border-color:var(--rule-2);color:var(--ink-2)}

/* ---------- quiz ---------- */
.modes{display:flex;gap:6px;margin:2px 0 14px}
.modes button{flex:1;font-size:12.5px;font-weight:500;padding:8px 4px;border-radius:10px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-2);white-space:nowrap}
.modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .modes button.on,
:root:not([data-theme="light"]) .modes button.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .modes button.on{color:#fff}}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.qstem{font-size:14.5px;line-height:1.45;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 11px;border-radius:10px;
  border:1px solid var(--rule);background:var(--card-2);font-size:13.5px;line-height:1.4}
.opt .ol{flex:none;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;color:var(--ink-3)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--amber);background:var(--amber-soft)}
.opt.wrong{border-color:var(--mark);background:var(--mark-soft)}
.why2{margin-top:11px;padding:10px 12px;border-radius:10px;background:var(--card-2);border:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-2);line-height:1.5}
.why2 b{color:var(--ink)}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:12px 0}
.omr .cell{border:1px solid var(--rule);border-radius:9px;padding:5px 4px;background:var(--card);text-align:center}
.omr .cn{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);display:block;margin-bottom:3px}
.omr .cb{display:flex;gap:2px;justify-content:center}
.omr .cb button{width:15px;height:17px;border-radius:4px;font-size:9.5px;font-weight:600;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;background:var(--sunk)}
.omr .cb button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .omr .cb button.on,
:root:not([data-theme="light"]) .omr .cb button.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .omr .cb button.on{color:#fff}}
.score{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.score .big{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;letter-spacing:-.02em;display:block}
.score .lil{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:block}
.sgrid{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.sgrid b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.act{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.act{align-items:center}
.act button,.act a{font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;border:1px solid var(--rule);
  background:var(--card-2);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
/* Without this an inline SVG in here has no width and no fill:none, so it
   renders as a huge black block. Latent since the scorer's "Official key"
   link was written — it just never had a loaded answer key to show it. */
.act svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.act .prim{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .act .prim,
:root:not([data-theme="light"]) .act .prim{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .act .prim{color:#fff}}

/* ---------- saved offline ---------- */
.saved{flex:none;color:var(--amber)}
.saved svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.savebtn{flex:none;padding:5px 9px;border-radius:8px;border:1px solid var(--rule-2);background:var(--card-2);
  font-size:11px;font-weight:500;color:var(--ink-2)}
.savebtn:hover{color:var(--ink);border-color:var(--accent)}

/* ---------- pace strip ---------- */
.pace{display:flex;gap:15px;align-items:center;background:var(--card);border:1px solid var(--rule);
  border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:4px}
.pace .pl{flex:none;text-align:center;padding-right:15px;border-right:1px solid var(--rule)}
.pace .pl .big{font-size:26px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.1}
.pace .pl .lil{font-size:10.5px;color:var(--ink-3);display:block;max-width:82px;line-height:1.3;margin-top:2px}

/* ---------- backup sheet ---------- */

  background:var(--card-2);color:var(--ink-2);resize:vertical}

.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
</style>
</head>
<body>


<div class="app">
  <div class="top" id="top">
    <button class="back hide" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="backLbl">Back</span></button>
    <div class="brand" id="brand">
      <h1>TaraCmd</h1>

    </button>

  <div id="view"></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div class="inner" id="sheetIn"></div></div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="subjects"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 016.5 18H19v3H6.5A2.5 2.5 0 014 20.5z"/></svg>Subjects</button>

  <button class="tab" data-tab="mains"><svg viewBox="0 0 24 24"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>Mains</button>
  <button class="tab" data-tab="optional"><svg viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M9 20h6"/><path d="M6 8h12"/><path d="M6 8l-3 5h6z"/><path d="M18 8l3 5h-6z"/></svg>Optional</button>
  <button class="tab" data-tab="quiz"><svg viewBox="0 0 24 24"><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>Quiz</button>
  <button class="tab" data-tab="toppers"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.4 6.7 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>Toppers</button>

<script>
const SUBJECTS = __SUBJECTS__;
const PYQ = __PYQ__;
const TOPPERS = __TOPPERS__;
const KEYS = __KEYS__;
const QUIZ = __QUIZ__;
const OPTIONALS = __OPTIONALS__;
const DAILY = __DAILY__;
const ARCHIVE = "https://www.upsc.gov.in/examinations/previous-question-papers/archives";
const KEYINDEX = "https://www.upsc.gov.in/examinations/answer-key";

/* ---------------- storage (best effort) ---------------- */
/* The key never changes: it is the only thing standing between a returning
   visitor and an empty app. Every field added since is additive and defaulted
   below, so a store written by an older build still loads. */
const KEY = "taracmd-v1";
const BLANK = {
  done:     {},   // topic id  -> [subtopic indices ticked]
  theme:    null, // "dark" | "light" | null for system
  attempts: {},   // "year-paper-set" -> {question: letter}   OMR sheets
  revised:  {},   // topic id  -> [epoch ms]                  revision history
  picks:    {},   // question id -> option index              practice answers
  writing:  {},   // "year-code" -> [{q,mins,words,score,of,note,on}]  Mains log
  daily:    {}    // "YYYY-MM-DD" -> {score,of,src}           daily quiz log
};
let store = Object.assign({}, BLANK);
try{ const r = localStorage.getItem(KEY); if(r) store = Object.assign(store, JSON.parse(r)); }catch(e){}
for(const k in BLANK){ if(store[k] === undefined || store[k] === null) store[k] = BLANK[k]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* Native bridge — present only inside the Android shell. Lets a single copy
   be saved to the app's own folder and reopened offline. Absent on the web,
   where the browser's own download handles it. */
const NATIVE = (typeof AndroidHost !== "undefined") ? AndroidHost : null;
function savedPath(url){
  if(!NATIVE) return null;
  try{ return NATIVE.savedPath(url) || null; }catch(e){ return null; }
}
const doneSet = id => new Set(store.done[id] || []);
function toggleSub(tid, i, total){
  const s = doneSet(tid);
  s.has(i) ? s.delete(i) : s.add(i);
  store.done[tid] = [...s];
  if(!store.done[tid].length) delete store.done[tid];
  /* Finishing a topic is itself a revision — and it is the only moment we can
     honestly timestamp, which is what starts the decay clock below. */
  if(total && s.size === total && !revisions(tid).length) markRevised(tid);
  else save();
}

/* ---------------- revision decay ----------------
   A tick says you have read something once. It does not say you still know it
   nine months later, and nine months is the shape of this exam. So each topic
   also carries the dates it was revised, and falls due again on widening
   intervals. Additive: a store with no `revised` simply has nothing due. */
const REVISE_DAYS = [3, 7, 21, 60, 120];
const DAY = 86400000;
const revisions = tid => store.revised[tid] || [];
const lastRevised = tid => { const r = revisions(tid); return r.length ? r[r.length - 1] : null; };

function markRevised(tid){
  const r = revisions(tid).slice();
  r.push(Date.now());
  if(r.length > 12) r.shift();           // the tail is what matters, not a diary
  store.revised[tid] = r;
  save();
}

const isComplete = tp => tp.subtopics.length > 0 &&
  (store.done[tp.id] || []).length >= tp.subtopics.length;

/* Days until this topic wants looking at again. <=0 is due, null means it is
   not a candidate yet — still part-ticked and never revised, so it belongs to
   "Not done" rather than to the decay schedule. */
function dueIn(tp){
  const last = lastRevised(tp.id);
  if(last === null) return isComplete(tp) ? 0 : null;
  const step = REVISE_DAYS[Math.min(revisions(tp.id).length - 1, REVISE_DAYS.length - 1)];
  return Math.ceil((last + step * DAY - Date.now()) / DAY);
}

const isDue = tp => { const d = dueIn(tp); return d !== null && d <= 0; };

/* ---------------- the clock ----------------
   Prelims sits on the last Sunday of May; Mains opens on 1 September. Worked
   out at runtime and never baked in: this page is built to be opened offline
   months later, and a date frozen at build time would quietly be a lie. */
function lastSundayOfMay(y){
  const d = new Date(y, 4, 31);
  d.setDate(31 - ((d.getDay() + 7) % 7));
  return d;
}
function nextExam(){
  const now = new Date(), y = now.getFullYear(), out = [];
  for(const yy of [y, y + 1]){
    out.push({name: "Prelims " + yy, on: lastSundayOfMay(yy)});
    out.push({name: "Mains " + yy, on: new Date(yy, 8, 1)});
  }
  return out.filter(c => c.on >= now).sort((a, b) => a.on - b.on)[0];
}

function agoWords(ms){
  const d = Math.floor((Date.now() - ms) / DAY);
  if(d <= 0) return "today";
  if(d === 1) return "yesterday";
  if(d < 30) return d + " days ago";
  const m = Math.floor(d / 30);
  return m === 1 ? "a month ago" : m + " months ago";
}

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAPER_LBL = {prelims:"P", "mains-gs1":"GS1", "mains-gs2":"GS2", "mains-gs3":"GS3", "mains-gs4":"GS4", essay:"Essay"};
const view = document.getElementById("view");
const topicCount = s => s.topics.length;
function subjProgress(s){
  let d=0, t=0;
  for(const tp of s.topics){ t += tp.subtopics.length; d += (store.done[tp.id]||[]).length; }
  return t ? d/t : 0;
}
function chipHtml(t){
  return t.papers.map(p=>{
    const cls = p==="prelims" ? "chip p" : p==="essay" ? "chip e" : "chip";
    return `<span class="${cls}">${PAPER_LBL[p]||p}</span>`;
  }).join("");
}
const CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
const LINKI = '<svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v7H3V3h7"/></svg>';
const XI    = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
const DOWNI = '<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>';

/* ---------------- state ---------------- */
let state = {tab:"subjects", subject:null, filter:"all", tfilter:"all"};

/* ---------------- renderers ---------------- */
function renderSubjects(){
  const total = SUBJECTS.reduce((a,s)=>a+s.topics.length,0);
  document.getElementById("brandSub").textContent = total + " topics";
  const cards = SUBJECTS.map(s=>{
    const p = subjProgress(s);
    return `<button class="sub-card" data-sub="${s.id}">
      <span class="em">${s.icon}</span>
      <span class="nm">${esc(s.short)}</span>
      <div class="bar"><i style="width:${(p*100).toFixed(1)}%"></i></div>
      <span class="meta"><span>${topicCount(s)} topics</span><span>${Math.round(p*100)}%</span></span>
    </button>`;
  }).join("");

  view.innerHTML = `
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search __N_TOPICS__ topics and __N_SUBTOPICS__ subtopics" autocomplete="off">
    </div>
    <div id="results"></div>
    <div id="home">
      ${paceHtml(total)}
      <div class="head"><h2>Subjects</h2><span class="n">${total} topics</span></div>
      <div class="grid">${cards}</div>
      <p class="note">Weight bands come from how often a topic has surfaced in the last ten years of papers. Tick subtopics as you revise, and mark a topic revised when you go back over it — everything is stored on this device only. <button class="linky" id="dataBtn">Back up or restore progress</button></p>
    </div>`;

  view.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{state.subject=b.dataset.sub;state.tfilter="all";render();});
  const q = document.getElementById("q");
  q.addEventListener("input", ()=>runSearch(q.value.trim()));
  const dj = document.getElementById("dueJump");
  if(dj) dj.onclick = showDue;
  document.getElementById("dataBtn").onclick = openData;
}

/* What the exam calendar and your own ticks jointly imply.
   The daily rate is only shown when there is enough runway for it to mean
   anything. Inside the last month "35 topics a day" is not a plan, it is an
   insult, so the strip switches to plain counts instead. */
const PACE_HORIZON = 30;

function paceHtml(total){
  const ex = nextExam();
  if(!ex) return "";
  const days = Math.max(0, Math.ceil((ex.on - Date.now()) / DAY));
  const done = SUBJECTS.reduce((a, s) => a + s.topics.filter(isComplete).length, 0);
  const due = SUBJECTS.reduce((a, s) => a + s.topics.filter(isDue).length, 0);
  const left = total - done;
  const rate = left / Math.max(1, days);

  let second;
  if(!left) second = "whole syllabus ticked off";
  else if(days >= PACE_HORIZON)
    second = `<b class="mono">${rate < 10 ? rate.toFixed(1) : Math.round(rate)}</b> topics a day to cover the rest`;
  else
    second = `<b class="mono">${left}</b> still untouched — revision territory now, not first pass`;

  return `<div class="pace">
    <div class="pl"><span class="big mono">${days}</span><span class="lil">days to ${esc(ex.name)}</span></div>
    <div class="pr">
      <span><b class="mono">${done}</b> of ${total} topics finished</span>
      <span>${second}</span>
      ${due ? `<span><button class="linky" id="dueJump"><b class="mono">${due}</b> due for revision</button></span>` : ""}
    </div>
  </div>`;
}

function runSearch(term){
  const res = document.getElementById("results"), home = document.getElementById("home");
  if(!term || term.length < 2){ res.innerHTML=""; home.classList.remove("hide"); return; }
  home.classList.add("hide");
  const t = term.toLowerCase();
  const hits = [];
  for(const s of SUBJECTS){
    for(const tp of s.topics){
      const inName = tp.name.toLowerCase().includes(t);
      const subs = tp.subtopics.filter(x=>x.toLowerCase().includes(t));
      if(inName || subs.length) hits.push({s, tp, subs: inName ? tp.subtopics.slice(0,2) : subs.slice(0,2)});
    }
  }
  if(!hits.length){ res.innerHTML = `<div class="empty">Nothing matches “${esc(term)}”.</div>`; return; }
  res.innerHTML = `<div class="head"><h2>Results</h2><span class="n">${hits.length} topics</span></div>
    <div class="list">${hits.slice(0,60).map(h=>rowHtml(h.tp, h.s, h.subs.join(" · "))).join("")}</div>`;
  bindRows(res);
}

function rowHtml(tp, s, subline){
  const dn = (store.done[tp.id]||[]).length, tot = tp.subtopics.length;
  const complete = dn === tot && tot > 0;
  const d = dueIn(tp);
  const dueChip = d === null ? ""
    : d <= 0 ? `<span class="chip due">due</span>`
             : `<span class="chip sched">${d}d</span>`;
  return `<button class="row" data-topic="${tp.id}">
    <span class="stripe ${tp.weight}"></span>
    <span class="body">
      <span class="t">${esc(tp.name)}</span>
      <span class="s">${esc(subline || (s ? s.short + " · " : "") + tp.subtopics.slice(0,2).join(" · "))}</span>
      <span class="chips">${chipHtml(tp)}<span class="chip">${dn}/${tot}</span>${dueChip}</span>
    </span>
    <span class="tick ${complete?"on":""}">${CHECK}</span>
  </button>`;
}

function renderSubject(){
  const s = SUBJECTS.find(x=>x.id===state.subject);
  document.getElementById("brandSub").textContent = "";
  let topics = s.topics.slice();
  if(state.tfilter==="high") topics = topics.filter(t=>t.weight==="high");
  else if(state.tfilter==="prelims") topics = topics.filter(t=>t.papers.includes("prelims"));
  else if(state.tfilter==="mains") topics = topics.filter(t=>t.papers.some(p=>p.startsWith("mains")));
  else if(state.tfilter==="left") topics = topics.filter(t=>(store.done[t.id]||[]).length < t.subtopics.length);
  else if(state.tfilter==="due") topics = topics.filter(isDue).sort((a,b)=>dueIn(a)-dueIn(b));

  const counts = {
    high: s.topics.filter(t=>t.weight==="high").length,
    medium: s.topics.filter(t=>t.weight==="medium").length,
    low: s.topics.filter(t=>t.weight==="low").length,
    due: s.topics.filter(isDue).length
  };
  const p = subjProgress(s);
  view.innerHTML = `
    <div class="head" style="margin-top:6px">
      <h2>${s.icon} ${esc(s.name)}</h2><span class="n">${Math.round(p*100)}% revised</span>
    </div>
    <div class="bar" style="margin-bottom:14px"><i style="width:${(p*100).toFixed(1)}%"></i></div>
    <div class="filters">
      ${[["all","All "+s.topics.length],["due","Due "+counts.due],["high","High weight "+counts.high],["prelims","Prelims"],["mains","Mains"],["left","Not done"]]
        .map(([k,l])=>`<button class="fchip ${state.tfilter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}
    </div>
    <div class="legend">
      <span><i style="background:var(--mark)"></i>high frequency ${counts.high}</span>
      <span><i style="background:var(--amber)"></i>medium ${counts.medium}</span>
      <span><i style="background:var(--rule-2)"></i>low ${counts.low}</span>
    </div>
    ${topics.length ? `<div class="list">${topics.map(t=>rowHtml(t,null,null)).join("")}</div>`
                    : `<div class="empty">${state.tfilter==="due" ? "Nothing due in " + esc(s.short) + " yet."
                                          : state.tfilter==="left" ? "Every topic here is ticked off."
                                          : "No topics in this filter."}</div>`}`;
  view.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{state.tfilter=b.dataset.f;renderSubject();});
  bindRows(view);
}

function bindRows(root){
  root.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>openTopic(b.dataset.topic));
}

/* ---------------- topic sheet ---------------- */
const sheet = document.getElementById("sheet"), sheetBg = document.getElementById("sheetBg"), sheetIn = document.getElementById("sheetIn");
let openId = null;
function openTopic(id){
  let tp=null, sj=null;
  for(const s of SUBJECTS){ const f = s.topics.find(t=>t.id===id); if(f){tp=f;sj=s;break;} }
  if(!tp) return;
  openId = id;
  drawSheet(tp, sj);
  sheet.classList.add("on"); sheetBg.classList.add("on");
}
/* The revision footer of the sheet: when you last went through this, when it
   falls due again, and the one button that says you have just done it. */
function revBlock(tp){
  const last = lastRevised(tp.id), n = revisions(tp.id).length, d = dueIn(tp);
  const line = last === null
    ? (isComplete(tp) ? "Ticked off, but never dated — treat it as due."
                      : "Not revised yet.")
    : `Revised ${n === 1 ? "once" : n + " times"}, last ${agoWords(last)}.` +
      (d <= 0 ? " <b>Due now.</b>" : ` Due again in ${d} day${d === 1 ? "" : "s"}.`);
  return `<div class="revline">
    <span>${line}</span>
    <button class="revbtn" id="revNow">${last === null ? "Mark revised" : "Revised again"}</button>
  </div>`;
}

function drawSheet(tp, sj){
  const done = doneSet(tp.id);
  const pct = tp.subtopics.length ? done.size/tp.subtopics.length : 0;
  const weightWord = {high:"High frequency", medium:"Medium frequency", low:"Low frequency"}[tp.weight];
  const papers = tp.papers.map(p=>({prelims:"Prelims","mains-gs1":"Mains GS-I","mains-gs2":"Mains GS-II","mains-gs3":"Mains GS-III","mains-gs4":"Mains GS-IV",essay:"Essay"}[p]||p)).join(", ");
  sheetIn.innerHTML = `
    <div class="sheethead">
      <div>
        <div class="eyebrow">${esc(sj.short)}</div>
        <h3>${esc(tp.name)}</h3>
      </div>
      <button class="xbtn" id="sheetX" aria-label="Close">${XI}</button>
    </div>
    <div class="chips">${chipHtml(tp)}</div>
    <div class="why">
      <span class="stripe ${tp.weight}" style="width:3px;min-height:34px;border-radius:99px"></span>
      <span><b>${weightWord}</b> in the last ten years. Asked in ${esc(papers)}.</span>
    </div>
    <div class="eyebrow">Subtopics</div>
    <div class="progline"><span>${done.size}/${tp.subtopics.length}</span><span class="bar"><i style="width:${(pct*100).toFixed(1)}%"></i></span><span>${Math.round(pct*100)}%</span></div>
    <ul class="subtopics">
      ${tp.subtopics.map((x,i)=>`<li><button class="${done.has(i)?"done":""}" data-i="${i}">
        <span class="tick ${done.has(i)?"on":""}">${CHECK}</span><span class="lbl">${esc(x)}</span></button></li>`).join("")}
    </ul>
    ${revBlock(tp)}`;
  sheetIn.querySelector("#sheetX").onclick = closeSheet;
  const rev = sheetIn.querySelector("#revNow");
  if(rev) rev.onclick = ()=>{
    const y = sheet.scrollTop;
    markRevised(tp.id);
    drawSheet(tp, sj);
    sheet.scrollTop = y;
    refreshBehind();
  };
  sheetIn.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    const y = sheet.scrollTop;                 // redrawing the sheet used to jump you to the top
    toggleSub(tp.id, +b.dataset.i, tp.subtopics.length);
    drawSheet(tp, sj);
    sheet.scrollTop = y;
    refreshBehind();
  });
}

/* Re-render whatever is behind the sheet without throwing away the user's
   place. Rebuilding renderSubjects() wholesale used to wipe an active search. */
function refreshBehind(){
  if(state.tab !== "subjects") return;
  if(state.subject) return renderSubject();
  const q = document.getElementById("q");
  const term = q ? q.value : "";
  renderSubjects();
  const q2 = document.getElementById("q");
  if(q2 && term){ q2.value = term; runSearch(term.trim()); }
}

/* ---------------- Mains answer log ----------------
   Prelims is a recognition test and the OMR scorer covers it. Mains is not:
   it is won by writing 20 answers in three hours, and no amount of ticking
   subtopics tells you whether you can. So each Mains paper gets a log — how
   long an answer took, how many words it ran to, what you would score it, and
   the one sentence about what went wrong that is the whole point of doing it.

   Lives inside the Mains tab on purpose. The tab bar is repeat(5,1fr) and a
   sixth would cramp the row on a phone. */
const writeKey = (year, code) => `${year}-${code}`;
const writeLog = (year, code) => store.writing[writeKey(year, code)] || [];

function writeStats(year, code){
  const log = writeLog(year, code);
  if(!log.length) return null;
  const pct = log.filter(a => a.of).map(a => a.score / a.of);
  const mins = log.filter(a => a.mins).map(a => a.mins);
  const words = log.filter(a => a.words).map(a => a.words);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return {n: log.length, pct: avg(pct), mins: avg(mins), words: avg(words)};
}

function openWriting(year, code, label){
  openId = "__write__";
  const draw = ()=>{
    const log = writeLog(year, code).slice().sort((a, b) => (b.on || 0) - (a.on || 0));
    const st = writeStats(year, code);
    const isEssay = code === "essay";
    /* What a single answer is marked out of. Essay is one of two at 125;
       a GS answer is a 10- or a 15-marker; an optional paper mixes in
       20-markers as well. */
    const isOpt = /-p[12]$/.test(code);
    const scales = isEssay ? [125, 250] : isOpt ? [10, 15, 20] : [10, 15];
    sheetIn.innerHTML = `
      <div class="sheethead">
        <div><div class="eyebrow">Mains ${year} &middot; ${esc(label)}</div><h3>Answer log</h3></div>
        <button class="xbtn" id="sheetX" aria-label="Close">${XI}</button>
      </div>
      ${st ? `<div class="sgrid" style="margin:12px 0 14px">
        <span>logged <b class="mono">${st.n}</b></span>
        ${st.pct !== null ? `<span>average <b class="mono">${Math.round(st.pct * 100)}%</b></span>` : ""}
        ${st.mins !== null ? `<span>time <b class="mono">${Math.round(st.mins)}</b> min</span>` : ""}
        ${st.words !== null ? `<span>length <b class="mono">${Math.round(st.words)}</b> words</span>` : ""}
      </div>` : `<p class="note" style="margin:10px 0 14px">Nothing logged for this paper yet. Write one answer under time, then record what it cost you.</p>`}

      <div class="eyebrow">Log an answer</div>
      <div class="wform">
        <label>Q<input id="wq" type="number" min="1" max="30" inputmode="numeric" placeholder="${isEssay ? "1" : "7"}"></label>
        <label>min<input id="wmin" type="number" min="1" max="240" inputmode="numeric" placeholder="${isEssay ? "75" : "9"}"></label>
        <label>words<input id="wwords" type="number" min="1" max="3000" inputmode="numeric" placeholder="${isEssay ? "1000" : "150"}"></label>
        <label>marks<input id="wscore" type="number" min="0" max="250" step="0.5" inputmode="decimal" placeholder="9"></label>
        <label>of<select id="wof">
          ${scales.map(v=>`<option value="${v}">${v}</option>`).join("")}
        </select></label>
      </div>
      <input class="wnote" id="wnote" maxlength="160" placeholder="What went wrong? Intro too long, no diagram, ran out of time…">
      <div class="act"><button class="prim" id="wadd">Log it</button></div>
      <p class="note" id="wmsg"></p>

      ${log.length ? `<div class="eyebrow" style="margin-top:18px">Logged</div>
      <div class="list" style="margin-top:8px">
        ${log.map((a, i)=>`<div class="wrow">
          <span class="wq mono">Q${a.q || "?"}</span>
          <span class="wbody">
            <span class="wmeta mono">${[a.mins ? a.mins + " min" : null, a.words ? a.words + " words" : null,
                (a.score !== undefined && a.of) ? a.score + "/" + a.of : null].filter(Boolean).join(" · ")}</span>
            ${a.note ? `<span class="wtext">${esc(a.note)}</span>` : ""}
            <span class="wdate">${a.on ? agoWords(a.on) : ""}</span>
          </span>
          <button class="wdel" data-del="${a.on}" aria-label="Remove">${XI}</button>
        </div>`).join("")}
      </div>` : ""}`;

    sheetIn.querySelector("#sheetX").onclick = closeSheet;
    sheetIn.querySelector("#wadd").onclick = ()=>{
      const num = id => { const v = sheetIn.querySelector(id).value.trim(); return v === "" ? undefined : +v; };
      const entry = {
        q: num("#wq"), mins: num("#wmin"), words: num("#wwords"),
        score: num("#wscore"), of: +sheetIn.querySelector("#wof").value,
        note: sheetIn.querySelector("#wnote").value.trim(), on: Date.now()
      };
      if(entry.q === undefined && entry.score === undefined && !entry.note){
        sheetIn.querySelector("#wmsg").textContent = "Give it at least a question number, a score or a note.";
        return;
      }
      const k = writeKey(year, code);
      store.writing[k] = writeLog(year, code).concat([entry]);
      save();
      draw();
      render();
    };
    sheetIn.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      const on = +b.dataset.del, k = writeKey(year, code);
      store.writing[k] = writeLog(year, code).filter(a => a.on !== on);
      if(!store.writing[k].length) delete store.writing[k];
      save();
      draw();
      render();
    });
  };
  draw();
  sheet.classList.add("on"); sheetBg.classList.add("on");
}

/* Everything falling due, across all eight subjects, oldest debt first. Rides
   on the same #results slot the search uses. */
function showDue(){
  const res = document.getElementById("results"), home = document.getElementById("home");
  if(!res) return;
  const rows = [];
  for(const s of SUBJECTS) for(const tp of s.topics) if(isDue(tp)) rows.push({s, tp});
  rows.sort((a, b) => dueIn(a.tp) - dueIn(b.tp));
  home.classList.add("hide");
  res.innerHTML = `<div class="head"><h2>Due for revision</h2><span class="n">${rows.length}</span></div>
    ${rows.length ? `<div class="list">${rows.map(r => rowHtml(r.tp, r.s, null)).join("")}</div>` : `<div class="empty">Nothing due. Come back tomorrow.</div>`}
    <p class="note">Longest-neglected first. Go back over one, then tap <b>Revised again</b> in the sheet — it returns at a wider interval each time: ${REVISE_DAYS.join(", ")} days, then every ${REVISE_DAYS[REVISE_DAYS.length - 1]}.</p>`;
  bindRows(res);

/* ---------------- backup ----------------
   All of this lives in one browser's localStorage and nowhere else. Clear site
   data, reinstall the APK or change phone and it is gone, so there has to be a
   way to get it out. Deliberately a copyable blob rather than a fifth bridge
   function: the JS↔native contract is four functions wide and widening it
   silently is how the two halves drift apart. */
function mergeStore(incoming){
  const uniqSort = (a, b) => [...new Set([...(a || []), ...(b || [])])].sort((x, y) => x - y);
  let touched = 0;

  for(const tid in incoming.done || {}){
    const before = (store.done[tid] || []).length;
    store.done[tid] = uniqSort(store.done[tid], incoming.done[tid]);
    if(store.done[tid].length !== before) touched++;
  }
  for(const tid in incoming.revised || {}){
    store.revised[tid] = uniqSort(store.revised[tid], incoming.revised[tid]).slice(-12);
  }
  // Maps of answers: what is already here wins, the backup only fills gaps.
  for(const k of ["attempts", "picks", "writing"]){
    for(const id in incoming[k] || {}){
      if(store[k][id] === undefined){ store[k][id] = incoming[k][id]; touched++; }
    }
  }
  save();
  return touched;
}

function openData(){
  openId = "__data__";
  const json = JSON.stringify(store);
  const n = o => Object.keys(o || {}).length;
  sheetIn.innerHTML = `
    <div class="sheethead">
      <div><div class="eyebrow">This device only</div><h3>Back up or restore</h3></div>
      <button class="xbtn" id="sheetX" aria-label="Close">${XI}</button>
    </div>
    <p class="note" style="margin-top:2px">Nothing here leaves the device by itself. Clear site data, reinstall the app or move phone and the text below is the only copy of your progress.</p>
    <div class="sgrid" style="margin:14px 0 16px">
      <span>topics started <b class="mono">${n(store.done)}</b></span>
      <span>subtopics ticked <b class="mono">${Object.values(store.done).reduce((a, v) => a + v.length, 0)}</b></span>
      <span>topics dated <b class="mono">${n(store.revised)}</b></span>
      <span>answer sheets <b class="mono">${n(store.attempts)}</b></span>
      <span>practice answers <b class="mono">${n(store.picks)}</b></span>
      <span>answers logged <b class="mono">${n(store.writing)}</b></span>
    </div>
    <div class="eyebrow">Backup</div>
    <textarea class="dump" id="dumpOut" rows="4" readonly>${esc(json)}</textarea>
    <div class="act">
      <button class="prim" id="copyOut">Copy</button>
      ${NATIVE ? "" : `<button id="fileOut">Save as file</button>`}
    </div>
    <div class="eyebrow" style="margin-top:20px">Restore</div>
    <p class="note" style="margin:4px 0 8px">Paste a backup. It is merged, not swapped in — ticks and dates are unioned, and anything already on this device wins.</p>
    <textarea class="dump" id="dumpIn" rows="3" placeholder='{"done":{ … }}'></textarea>
    <div class="act"><button id="doImport">Merge this in</button></div>
    <p class="note" id="ioMsg"></p>`;

  sheetIn.querySelector("#sheetX").onclick = closeSheet;
  const msg = t => { sheetIn.querySelector("#ioMsg").innerHTML = t; };

  sheetIn.querySelector("#copyOut").onclick = ()=>{
    const ta = sheetIn.querySelector("#dumpOut");
    ta.select();
    const done = ()=>msg("Copied. Paste it somewhere that survives this device.");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done, ()=>msg("Could not copy — select the text and copy it by hand."));
    } else {
      try{ document.execCommand("copy"); done(); }
      catch(e){ msg("Could not copy — select the text and copy it by hand."); }
    }
  };

  const fileBtn = sheetIn.querySelector("#fileOut");
  if(fileBtn) fileBtn.onclick = ()=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    a.download = "taracmd-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  };

  sheetIn.querySelector("#doImport").onclick = ()=>{
    const raw = sheetIn.querySelector("#dumpIn").value.trim();
    if(!raw) return msg("Nothing pasted.");
    let obj;
    try{ obj = JSON.parse(raw); }
    catch(e){ return msg("That is not valid JSON — paste the whole backup, braces and all."); }
    if(!obj || typeof obj !== "object" || (!obj.done && !obj.revised))
      return msg("That JSON does not look like a TaraCmd backup.");
    const touched = mergeStore(obj);
    msg(`Merged. ${touched} entr${touched === 1 ? "y" : "ies"} added. <b>${Object.values(store.done).reduce((a, v) => a + v.length, 0)}</b> subtopics ticked in total.`);
    refreshBehind();
  };

  sheet.classList.add("on"); sheetBg.classList.add("on");
}

/* Hardware back on Android, and swipe-down on the grip. */
window.taracmdBack = function(){
  if(openId){ closeSheet(); return true; }
  if(state.tab==="subjects" && state.subject){ state.subject=null; render(); return true; }
  if(state.tab!=="subjects"){ document.querySelector('.tab[data-tab="subjects"]').click(); return true; }
  return false;
};
(function(){
  const grip = sheet.querySelector(".grip");
  let y0=null;
  grip.addEventListener("pointerdown", e=>{ y0=e.clientY; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener("pointermove", e=>{
    if(y0===null) return;
    const dy = Math.max(0, e.clientY - y0);
    sheet.style.transition="none";
    sheet.style.transform=`translateY(${dy}px)`;
  });
  grip.addEventListener("pointerup", e=>{
    if(y0===null) return;
    const dy = e.clientY - y0; y0=null;
    sheet.style.transition=""; sheet.style.transform="";
    if(dy > 70) closeSheet();
  });
  grip.addEventListener("pointercancel", ()=>{ y0=null; sheet.style.transition=""; sheet.style.transform=""; });
})();

/* ---------------- PYQ ---------------- */
const keyYear = y => (KEYS.years || []).find(k=>k.year===y);
const keyPaper = (y,code) => { const k=keyYear(y); return k && k.papers.find(p=>p.code===code); };
const hasLetters = p => !!(p && p.keys && Object.keys(p.keys).length);

/* An exam year is only offered once its exam has actually been sat, so the app
   never shows a year with nothing behind it. Worked out here and not in
   build.py, for the reason nextExam() is: dropping the years at build time made
   build.py's output depend on the day it ran, and content.yml's drift check
   fail on nothing. The Commission puts each paper up the day it is sat, so the
   sitting date is also the publication date.

   Prelims deliberately uses the END OF MAY, not nextExam()'s last-Sunday rule.
   The exact Sunday moves and the exam does not track it: 2025 was sat on the
   26th when the last Sunday was the 25th, and 2026 on the 25th when it was the
   31st. Erring late only delays a year by days; erring early offers a paper
   that does not exist yet. */
const satOn = (kind, y) => kind === "prelims" ? new Date(y, 4, 31) : new Date(y, 8, 1);

function renderPYQ(kind){
  const now = new Date();
  const data = (PYQ[kind] || []).filter(y => satOn(kind, y.year) <= now);
  const label = kind==="prelims" ? "Prelims" : "Mains";
  document.getElementById("brandSub").textContent = "official papers";
  const found = data.reduce((a,y)=>a + y.papers.filter(p=>p.url).length, 0);
  const total = data.reduce((a,y)=>a + y.papers.length, 0);
  view.innerHTML = `
    <div class="head" style="margin-top:6px"><h2>PYQ ${label}</h2><span class="n">${found}/${total} linked</span></div>
    ${data.map(y=>{
      const ky = kind==="prelims" ? keyYear(y.year) : null;
      const keyBtns = !ky ? "" : ky.papers.map(kp=>{
        const nm = kp.code==="gs1" ? "Key GS-I" : "Key CSAT";
        return kp.url
          ? `<a class="pbtn key" href="${esc(kp.url)}" target="_blank" rel="noopener">${nm} ${LINKI}</a>`
          : `<a class="pbtn miss" href="${KEYINDEX}" target="_blank" rel="noopener">${nm} · find</a>`;
      }).join("") + (ky.papers.some(hasLetters)
          ? `<button class="pbtn score" data-score="${y.year}">Score me</button>` : "");
      /* Mains is written, not recognised — so every Mains paper carries a log
         of what your own answers cost you in time, length and marks. */
      const logBtns = kind !== "mains" ? "" : y.papers.map(p=>{
        const st = writeStats(y.year, p.code);
        return `<button class="pbtn log${st ? " has" : ""}" data-log="${y.year}|${p.code}|${esc(shortPaper(p))}">${shortPaper(p)} log${st ? ` <b>${st.n}</b>` : ""}</button>`;
      }).join("");
      return `
      <div class="year">
        <div class="yh"><span class="yn">${y.year}</span><span class="ys">${y.papers.filter(p=>p.url).length}/${y.papers.length}${ky && ky.status==="provisional" ? " · provisional key" : ""}</span></div>
        <div class="papers">
          ${y.papers.map(p=> p.url
            ? `<a class="pbtn" href="${esc(p.url)}" target="_blank" rel="noopener">${shortPaper(p)} ${LINKI}</a>`
            : `<a class="pbtn miss" href="${ARCHIVE}" target="_blank" rel="noopener">${shortPaper(p)} · find</a>`).join("")}
          ${keyBtns}
        </div>
        ${logBtns ? `<div class="papers logs">${logBtns}</div>` : ""}
      </div>`;}).join("")}
    <p class="note">Every link points at the paper on <a href="${ARCHIVE}" target="_blank" rel="noopener">upsc.gov.in</a> — nothing here is a mirror or a re-upload. Dashed buttons are years whose PDF the UPSC archive did not serve up; they open the archive so you can pull the paper yourself.${kind==="prelims" ? ` Answer keys come from the Commission's own <a href="${KEYINDEX}" target="_blank" rel="noopener">answer-key page</a>; there is no official key for Mains, and none has ever been published.` : ""}</p>`;
  view.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{
    state.tab="quiz"; state.qmode="score"; state.qyear=+b.dataset.score;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x.dataset.tab==="quiz"));
    render();
  });
  view.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{
    const [yr, code, label] = b.dataset.log.split("|");
    openWriting(+yr, code, label);
  });
}
function shortPaper(p){
  return {gs1:"GS-I", gs2:"GS-II", gs3:"GS-III", gs4:"GS-IV", essay:"Essay"}[p.code] || esc(p.name);
}

/* ---------------- optional subject ----------------
   500 of the 1,750 written marks sit in one optional, and none of it is on the
   Subjects tab, which only covers the GS syllabus. Two papers a year, eleven
   years of them, plus an answer log per paper on the same footing as Mains —
   an optional answer is written under the same clock.

   The toppers' copies here are curated by hand and the list is short. Not an
   oversight: no publisher indexes its copies by optional subject, so finding
   them means opening the section pages at the bottom of the tab and reading.
   Harvesting them automatically would need a crawler per site, which is the

      <span>${esc(s.why)}</span></div>` : ""}

    <div class="head"><h2>Question papers</h2><span class="n">${s.pyq.length} years${logged ? ` · ${logged} logged` : ""}</span></div>
    ${s.pyq.map(y=>`
      <div class="year">
        <div class="yh"><span class="yn">${y.year}</span><span class="ys">${y.papers.filter(p=>p.url).length}/${y.papers.length}</span></div>
        <div class="papers">
          ${y.papers.map(p=> p.url
            ? `<a class="pbtn" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)} ${LINKI}</a>`
            : `<a class="pbtn miss" href="${ARCHIVE}" target="_blank" rel="noopener">${esc(p.name)} · find</a>`).join("")}
        </div>
        <div class="papers logs">
          ${y.papers.map(p=>{
            const st = writeStats(y.year, s.id + "-" + p.code);
            return `<button class="pbtn log${st ? " has" : ""}" data-olog="${y.year}|${s.id}-${p.code}|${esc(s.short + " " + p.name)}">${esc(p.name)} log${st ? ` <b>${st.n}</b>` : ""}</button>`;

    <p class="note">Every paper opens on <a href="${ARCHIVE}" target="_blank" rel="noopener">upsc.gov.in</a> — the Commission publishes each one the day it is sat, ${s.pyq[0] ? `${s.pyq[0].year} included` : ""}. Log an answer against the paper you wrote it from; an optional answer is written under the same clock as a GS one, and the same 250 marks ride on the paper.</p>

    <div class="head"><h2>Toppers' copies</h2><span class="n">${s.copies.length}</span></div>
    ${s.copies.length ? `<div class="list">${s.copies.map(c=>{
        const isPdf = /\.pdf($|\?)/i.test(c.url || "");
        const local = isPdf ? savedPath(c.url) : null;
        return `<div class="tcard">
          <span class="rank ${c.rank===1?"top":""}">${c.rank ? "#"+c.rank : "—"}</span>
          <a style="flex:1;min-width:0;color:inherit" href="${esc(local || c.url || "#")}" target="_blank" rel="noopener">
            <span class="nm">${esc(c.name)}</span>

          </a>
          ${local ? `<span class="saved" title="Saved on this device">${DOWNI}</span>`
                  : (NATIVE && isPdf ? `<button class="savebtn" data-save="${esc(c.url)}">Save</button>` : `<span class="ext">${LINKI}</span>`)}
        </div>`;}).join("")}</div>`
      : `<div class="empty">None indexed yet for ${esc(s.short)}.<br><br>
          No publisher lists its copies by optional subject, so these have to be
          found by hand — open a section below, and add what you find to
          <span class="mono">content/optionals.json</span>.</div>`}

    <div class="head"><h2>Where to look</h2></div>
    <div class="list">
      ${(OPTIONALS.publishers||[]).map(p=>`<a class="tcard" href="${esc(p.url)}" target="_blank" rel="noopener">
        <span style="flex:1"><span class="nm">${esc(p.name)}</span><span class="mt">${esc(p.note || "toppers' copies section")}</span></span>
        <span class="ext">${LINKI}</span></a>`).join("")}
