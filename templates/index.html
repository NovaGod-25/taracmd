<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<meta name="description" content="Subject-wise revision desk for the Civil Services Examination.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TaraCmd">
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<!--/PWA-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232E3D97'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EU%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232E3D97'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif'%3EU%3C/text%3E%3C/svg%3E">
<title>TaraCmd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">

<style>
:root{
  --paper:#EDEFF2; --card:#FFFFFF; --card-2:#F5F7F9; --sunk:#E4E8ED;
  --ink:#141C2B; --ink-2:#4A5769; --ink-3:#7A879A;
  --rule:#DBE0E8; --rule-2:#C7CFDA;
  --accent:#2E3D97; --accent-ink:#2E3D97; --accent-soft:#E6E9F8;
  --mark:#B32E1C; --mark-soft:#FAE7E4;
  --amber:#8A6009; --amber-soft:#F7EEDC;
  --shadow:0 1px 2px rgba(20,28,43,.06), 0 8px 24px -12px rgba(20,28,43,.18);
  --tab-h:66px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E131B; --card:#161D28; --card-2:#1C2531; --sunk:#111823;
    --ink:#E7ECF3; --ink-2:#A6B2C4; --ink-3:#73819A;
    --rule:#28313F; --rule-2:#374355;
    --accent:#93A8F7; --accent-ink:#B3C2FB; --accent-soft:#1E2743;
    --mark:#F0958A; --mark-soft:#3A231F;
    --amber:#DBAC55; --amber-soft:#33280F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0E131B; --card:#161D28; --card-2:#1C2531; --sunk:#111823;
  --ink:#E7ECF3; --ink-2:#A6B2C4; --ink-3:#73819A;
  --rule:#28313F; --rule-2:#374355;
  --accent:#93A8F7; --accent-ink:#B3C2FB; --accent-soft:#1E2743;
  --mark:#F0958A; --mark-soft:#3A231F;
  --amber:#DBAC55; --amber-soft:#33280F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent-ink);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app{max-width:780px;margin:0 auto;padding:0 14px calc(var(--tab-h) + 28px)}

/* ---------- top bar ---------- */
/* env() is zero inside the Android build, where MainActivity pads the WebView
   by the real insets instead — this is for the PWA, installed to a home screen
   with viewport-fit=cover, where the page really does own the whole screen. */
.top{position:sticky;top:0;z-index:40;background:var(--paper);
  padding:calc(12px + env(safe-area-inset-top)) 0 8px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--rule)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand h1{font-size:19px;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--rule);background:var(--card)}
.iconbtn:hover{color:var(--ink);border-color:var(--rule-2)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.back{margin-right:auto;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;font-weight:500;padding:6px 0}
.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- search ---------- */
.searchwrap{position:relative;margin:2px 0 14px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linecap:round}
#q{width:100%;padding:11px 12px 11px 36px;border-radius:11px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);font-size:14.5px}
#q::placeholder{color:var(--ink-3)}
#q:focus{border-color:var(--accent);outline:none}

/* ---------- subject grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.sub-card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:13px 13px 11px;
  text-align:left;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.sub-card:hover{transform:translateY(-1px);border-color:var(--rule-2)}
.sub-card .em{font-size:19px;line-height:1}
.sub-card .nm{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:15px;line-height:1.25}
.sub-card .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  display:flex;justify-content:space-between;align-items:center;letter-spacing:.02em}
.bar{height:4px;border-radius:99px;background:var(--sunk);overflow:hidden}
/* Grid stretches every card in a row to the tallest. Without this the bar and
   the count stay top-aligned, so a subject whose name wraps to two lines
   ("International Relations") leaves its neighbour's footer floating. */
.sub-card .bar{margin-top:auto}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* ---------- section heads ---------- */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.head h2{font-size:16px}
.head .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.03em}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- topic rows ---------- */
.list{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;
  border-bottom:1px solid var(--rule);position:relative}
.row:last-child{border-bottom:none}
.row:hover{background:var(--card-2)}
.stripe{width:3px;align-self:stretch;border-radius:99px;flex:none;background:var(--rule-2)}
.stripe.high{background:var(--mark)}
.stripe.medium{background:var(--amber)}
.stripe.low{background:var(--rule-2)}
.row .body{flex:1;min-width:0;display:block}
.row .t,.row .s{display:block}
.row .t{font-weight:500;font-size:14.5px;line-height:1.35}
.row .s{color:var(--ink-3);font-size:12.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.03em;padding:2px 6px;border-radius:5px;
  background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.p{background:var(--accent-soft);color:var(--accent-ink)}
.chip.e{background:var(--amber-soft);color:var(--amber)}
.chip.due{background:var(--mark-soft);color:var(--mark)}
.chip.sched{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule)}
.tick{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--rule-2);display:grid;place-items:center;
  margin-top:1px;color:transparent}
.tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tick.on,
:root:not([data-theme="light"]) .tick.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .tick.on{color:#fff}}
.tick svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:99px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-2);white-space:nowrap}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .fchip.on,
:root:not([data-theme="light"]) .fchip.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fchip.on{color:#fff}}

/* ---------- weight legend ---------- */
.legend{display:flex;gap:14px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3);
  margin:0 0 10px;padding:0 2px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:3px;border-radius:99px;display:block}

/* ---------- year / paper cards ---------- */
.year{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.year .yh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.year .yn{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px;letter-spacing:-.01em}
.year .ys{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.papers{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:9px;
  border:1px solid var(--rule);background:var(--card-2);color:var(--ink)}
.pbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.pbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.pbtn.miss{color:var(--ink-3);border-style:dashed;background:transparent}
.pbtn.miss:hover{color:var(--ink-2);border-color:var(--rule-2)}

/* ---------- toppers ---------- */
.tcard{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:11px 13px;border-bottom:1px solid var(--rule)}
.tcard:last-child{border-bottom:none}
.tcard{color:var(--ink)}
.tcard:hover{background:var(--card-2)}
.rank{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rank.top{background:var(--accent-soft);color:var(--accent-ink)}
.tcard .nm{font-weight:500;font-size:14.5px;display:block}
.tcard .mt{font-size:12px;color:var(--ink-3);margin-top:2px;display:block}
.ext{flex:none;color:var(--ink-3)}
.ext svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- detail sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,24,.45);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
  border-radius:18px 18px 0 0;max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px -12px rgba(0,0,0,.4)}
.sheet.on{transform:translateY(0)}
@media(min-width:700px){.sheet{max-width:640px;margin:0 auto;border-radius:18px;bottom:24px;left:16px;right:16px;max-height:80vh}}
.sheet .grip{width:36px;height:4px;border-radius:99px;background:var(--rule-2);margin:9px auto 0}
.sheet .inner{padding:14px 18px 26px}
.sheet h3{font-size:19px;line-height:1.28;margin-bottom:8px}
.sheet .why{background:var(--card-2);border:1px solid var(--rule);border-radius:11px;padding:10px 12px;margin:12px 0 16px;
  font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;align-items:flex-start}
.sheet .why b{color:var(--ink);font-weight:600}
.sheet .why > span:last-child{display:block}
.subtopics{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.subtopics li{border-top:1px solid var(--rule)}
.subtopics button{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:11px 2px;font-size:14px;line-height:1.4}
.subtopics button.done .lbl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.progline{display:flex;align-items:center;gap:9px;margin:14px 0 4px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3)}
.progline .bar{flex:1}

/* ---------- revision footer ---------- */
.revline{display:flex;align-items:center;gap:11px;margin-top:16px;padding-top:13px;
  border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2);line-height:1.45}
.revline > span{flex:1}
.revline b{color:var(--mark)}
.revbtn{flex:none;padding:7px 12px;border-radius:9px;border:1px solid var(--rule-2);
  background:var(--card-2);font-size:12.5px;font-weight:500;color:var(--ink)}
.revbtn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--rule);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
/* Four columns is 93px each on a 375px phone, which is room for an 11px label
   and air around it. It got to seven once — Prelims, Mains and Optional are
   one idea and were three of them — and the row lost its shape long before it
   ran out of pixels. Rare destinations go in the drawer instead, so this
   number should not need to change again. */
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;
  color:var(--ink-3);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden}
/* The active tab was marked by colour alone, which is the one cue a
   colour-blind reader does not get and the first to wash out in sunlight. */
.tab.on::before{content:"";position:absolute;top:0;width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab.on svg{stroke-width:2.1}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent-ink)}

/* ---------- sheet close ---------- */
.sheet .grip{cursor:grab;touch-action:none;padding:0}
.sheethead{display:flex;align-items:flex-start;gap:10px}
.sheethead > div{flex:1;min-width:0}
.xbtn{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--rule);background:var(--card-2);margin-top:2px}
.xbtn:hover{color:var(--ink);border-color:var(--rule-2)}
.xbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ---------- answer keys ---------- */
.pbtn.key{border-style:solid;background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.pbtn.key:hover{border-color:var(--accent)}
.pbtn.score{background:transparent;border-color:var(--rule-2);color:var(--ink-2)}

/* ---------- quiz ---------- */
.modes{display:flex;gap:6px;margin:2px 0 14px}
.modes button{flex:1;font-size:12.5px;font-weight:500;padding:8px 4px;border-radius:10px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink-2);white-space:nowrap}
.modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .modes button.on,
:root:not([data-theme="light"]) .modes button.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .modes button.on{color:#fff}}
.qcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.qstem{font-size:14.5px;line-height:1.45;margin:6px 0 12px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 11px;border-radius:10px;
  border:1px solid var(--rule);background:var(--card-2);font-size:13.5px;line-height:1.4}
.opt .ol{flex:none;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;color:var(--ink-3)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--amber);background:var(--amber-soft)}
.opt.wrong{border-color:var(--mark);background:var(--mark-soft)}
.why2{margin-top:11px;padding:10px 12px;border-radius:10px;background:var(--card-2);border:1px solid var(--rule);
  font-size:12.5px;color:var(--ink-2);line-height:1.5}
.why2 b{color:var(--ink)}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:12px 0}
.omr .cell{border:1px solid var(--rule);border-radius:9px;padding:5px 4px;background:var(--card);text-align:center}
.omr .cn{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);display:block;margin-bottom:3px}
.omr .cb{display:flex;gap:2px;justify-content:center}
.omr .cb button{width:15px;height:17px;border-radius:4px;font-size:9.5px;font-weight:600;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace;background:var(--sunk)}
.omr .cb button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .omr .cb button.on,
:root:not([data-theme="light"]) .omr .cb button.on{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .omr .cb button.on{color:#fff}}
.score{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.score .big{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:600;letter-spacing:-.02em;display:block}
.score .lil{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:block}
.sgrid{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.sgrid b{font-family:"IBM Plex Mono",monospace;color:var(--ink)}
.act{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.act{align-items:center}
.act button,.act a{font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;border:1px solid var(--rule);
  background:var(--card-2);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
/* Without this an inline SVG in here has no width and no fill:none, so it
   renders as a huge black block. Latent since the scorer's "Official key"
   link was written — it just never had a loaded answer key to show it. */
.act svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.act .prim{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .act .prim,
:root:not([data-theme="light"]) .act .prim{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .act .prim{color:#fff}}

/* ---------- saved offline ---------- */
.saved{flex:none;color:var(--amber)}
.saved svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.savebtn{flex:none;padding:5px 9px;border-radius:8px;border:1px solid var(--rule-2);background:var(--card-2);
  font-size:11px;font-weight:500;color:var(--ink-2)}
.savebtn:hover{color:var(--ink);border-color:var(--accent)}

/* ---------- pace strip ---------- */
.pace{display:flex;gap:15px;align-items:center;background:var(--card);border:1px solid var(--rule);
  border-radius:14px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:4px}
.pace .pl{flex:none;text-align:center;padding-right:15px;border-right:1px solid var(--rule)}
.pace .pl .big{font-size:26px;font-weight:600;letter-spacing:-.02em;display:block;line-height:1.1}
.pace .pl .lil{font-size:10.5px;color:var(--ink-3);display:block;max-width:82px;line-height:1.3;margin-top:2px}
.pace .pr{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2);min-width:0}
.pace .pr b{color:var(--ink)}

/* ---------- Mains answer log ---------- */
.papers.logs{margin-top:7px;padding-top:7px;border-top:1px dashed var(--rule)}
.pbtn.log{background:transparent;border-style:dashed;color:var(--ink-3);font-size:12px;padding:5px 9px}
.pbtn.log:hover{color:var(--accent-ink);border-color:var(--accent);border-style:solid}
.pbtn.log.has{border-style:solid;background:var(--card-2);color:var(--ink-2)}
.pbtn.log b{font-family:"IBM Plex Mono",monospace;color:var(--accent-ink)}

.wform{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.wform label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}
.wform input,.wform select{width:62px;padding:7px 8px;border-radius:8px;border:1px solid var(--rule);
  background:var(--card-2);color:var(--ink);font-size:13px;font-family:"IBM Plex Mono",monospace}
.wform select{width:auto}
.wform input:focus,.wform select:focus{border-color:var(--accent);outline:none}
.wnote{width:100%;box-sizing:border-box;padding:9px 10px;border-radius:9px;border:1px solid var(--rule);
  background:var(--card-2);color:var(--ink);font-size:13px}
.wnote:focus{border-color:var(--accent);outline:none}

.wrow{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--rule)}
.wrow:last-child{border-bottom:none}
.wq{flex:none;width:34px;height:26px;border-radius:7px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-ink);font-size:11.5px;font-weight:600}
.wbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wmeta{font-size:11px;color:var(--ink-2)}
.wtext{font-size:12.5px;color:var(--ink);line-height:1.4}
.wdate{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.wdel{flex:none;color:var(--ink-3);padding:2px}
.wdel:hover{color:var(--mark)}
.wdel svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ---------- backup sheet ---------- */
.dump{width:100%;box-sizing:border-box;font-family:"IBM Plex Mono",monospace;font-size:11px;
  line-height:1.45;padding:9px 10px;border-radius:10px;border:1px solid var(--rule);
  background:var(--card-2);color:var(--ink-2);resize:vertical}
.dump:focus{border-color:var(--accent);outline:none}
.linky{color:var(--accent-ink);font-weight:500;padding:0;font-size:inherit;text-align:left}
.linky:hover{text-decoration:underline}

/* ---------- misc ---------- */
.note{font-size:12.5px;color:var(--ink-3);line-height:1.55;padding:0 2px;margin:10px 0 0}
.note a{border-bottom:1px solid var(--rule-2)}
.empty{text-align:center;color:var(--ink-3);font-size:13.5px;padding:38px 20px}
.hide{display:none!important}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* ---------------- the syllabus outline ---------------- */
/* The shape strip: how big the syllabus is and where the mass sits. The bar
   is drawn twice — the pale track is how many topics that group holds, the
   solid overlay is how much of it is ticked — so size and progress read off
   the same line instead of competing for space. */
.shape{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 13px;margin-bottom:14px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;margin-bottom:10px}
.shead .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.sbars{display:flex;flex-direction:column;gap:5px}
.sbar{display:grid;grid-template-columns:minmax(78px,1fr) 2.4fr auto;align-items:center;gap:9px;
  width:100%;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;color:inherit}
.sbar:hover .sb-l{color:var(--ink)}
.sb-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-i{font-size:13px;line-height:1}
.sb-t{position:relative;height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sb-t > i{position:absolute;left:0;top:0;height:100%;background:var(--rule-2);border-radius:99px}
.sb-t > b{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:99px}
.sb-n{font-size:10.5px;color:var(--ink-3);min-width:26px;text-align:right}

/* Lens switch. Two shapes of one syllabus, so it is a segmented control and
   not a filter chip — picking one is not narrowing, it is re-grouping. */
.lens{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:500;padding:6px 13px;border-radius:99px;border:0;
  background:none;color:var(--ink-3);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.lens-r{display:flex;gap:12px}

/* The eight (or six) group icons, for getting down the page without scrolling
   past everything in between. */
.jump{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--rule);
  background:var(--card);font-size:15px;line-height:1;cursor:pointer}
.jump button:hover{border-color:var(--accent);transform:translateY(-1px)}

.grp{margin-bottom:10px;scroll-margin-top:8px}
/* Sticky, so you always know which subject or paper you are reading inside a
   242-topic scroll. */
.ghead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 13px;border:1px solid var(--rule);border-radius:12px;background:var(--card);
  cursor:pointer;color:inherit}
.ghead.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.ghead:hover{border-color:var(--rule-2)}
.gi{font-size:17px;line-height:1;flex:none}
.gt{flex:1;min-width:0}
.gn{display:block;font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:14.5px;line-height:1.25}
.gm{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px}
.gbar{flex:none;width:56px;height:4px;border-radius:99px;background:var(--sunk);overflow:hidden}
.gbar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.caret{flex:none;width:20px;text-align:center;font-size:16px;color:var(--ink-3);line-height:1}

.tlist{background:var(--card);border:1px solid var(--rule);border-top:0;
  border-radius:0 0 12px 12px;overflow:hidden}
.tw{border-bottom:1px solid var(--rule)}
.tw:last-child{border-bottom:none}
.tw.open{background:var(--card-2)}
.tw .row{border-bottom:none}

/* Subtopics in place. This is the syllabus itself — all of a topic, not two
   of seven — and each line is the tick target, so reading and marking are the
   same gesture. */
.subs{padding:2px 13px 12px 27px}
.sub{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:7px 8px;
  border:0;border-radius:8px;background:none;cursor:pointer;color:var(--ink-2);font-size:13px;line-height:1.45}
.sub:hover{background:var(--sunk)}
.sub .box{flex:none;width:16px;height:16px;margin-top:1px;border:1.5px solid var(--rule-2);border-radius:5px;
  display:grid;place-items:center;color:transparent}
.sub .box svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none}
.sub.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.sub.on .stxt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule-2)}
.subfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:9px 8px 2px;border-top:1px dashed var(--rule);margin-top:6px}
.also{font-size:11.5px;color:var(--ink-3)}
.chip.m{background:var(--amber-soft);color:var(--amber)}
mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 1px}

/* Read it all: the flat document. No chrome, no checkboxes, and it is what
   prints — the app is one file, so printing is a stylesheet, not an export. */
.readbar{display:flex;gap:8px;margin:4px 0 14px}
.readdoc{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 22px}
.readdoc h1{font-size:19px;margin:0 0 4px}
.readdoc h2{font-size:15.5px;margin:22px 0 2px;padding-top:12px;border-top:1px solid var(--rule)}
.readdoc h3{font-size:13.5px;font-weight:600;margin:13px 0 4px;color:var(--ink-2);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.readdoc .rp{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);
  font-weight:400;flex:none;letter-spacing:.03em}
.readdoc ul{margin:0;padding-left:19px}
.readdoc li{font-size:12.5px;line-height:1.6;color:var(--ink-2)}

@media print{
  .tabs,.topbar,.readbar,.searchwrap,.sheet,.sheetbg{display:none!important}
  body{background:#fff;color:#000}
  .readdoc{border:0;padding:0;background:#fff}
  .readdoc h2{break-after:avoid}
  .readdoc h3{break-after:avoid;break-inside:avoid}
  .readdoc ul{break-inside:avoid}
  .readdoc li,.readdoc .rp{color:#000}
}

/* ---------------- focus ---------------- */
/* Sixty ticks, one per minute, so the angle round the face IS the number of
   minutes — the dial needs no legend and no instructions. */
.focuswrap{display:flex;flex-direction:column;align-items:center;padding:18px 0 6px}
.fdialwrap{position:relative;width:min(78vw,300px);aspect-ratio:1}
.fdial{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.ftrack{fill:none;stroke:var(--sunk);stroke-width:10}
.farc{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .25s linear}
/* While a finger is on the dial the arc must be where the finger is, not
   easing towards it a quarter-second later. */
.fdial.dragging .farc{transition:none}
.ftick{stroke:var(--rule-2);stroke-width:1}
.ftick.big{stroke:var(--ink-3);stroke-width:1.6}
.fgrip{fill:var(--accent);stroke:var(--card);stroke-width:3}
/* No transform-origin here. The hand is rotated by the SVG attribute
   rotate(deg 100 100), which already carries its own centre; adding a CSS
   origin applies the offset twice and swings the hand off the face. */
.fhand{stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.fpin{fill:var(--ink-3)}
/* Run outcomes get their own two colours. The weight-band stripes next door
   mean how often a topic has come up in the papers, and borrowing them here
   painted a finished run in the high-frequency red — which reads as a fault. */
.stripe.ran{background:var(--accent)}
.stripe.gone{background:var(--rule-2)}
.fcentre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;gap:2px}
.fread{font-size:clamp(30px,10vw,44px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.flil{font-size:12.5px;color:var(--ink-3)}
.fsteps{display:flex;gap:8px;margin:18px 0 4px}
.fstep{font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:46px;padding:8px 0;border-radius:10px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer}
.fstep:hover{border-color:var(--accent);color:var(--ink)}
.prim{background:var(--accent);border:1px solid var(--accent);color:#fff;font-size:14px;font-weight:600;
  padding:12px 20px;border-radius:11px;cursor:pointer}
:root[data-theme="dark"] .prim,:root:not([data-theme="light"]) .prim{color:#0E131B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .prim{color:#fff}}
.fgo{width:100%;max-width:300px;margin:10px 0 2px}
/* .prim's theme overrides are :root-scoped and out-specify a bare class, which
   once painted this label dark-on-dark inside a visible border. Match it. */
:root .prim.fstop{margin-top:22px;background:none;border-color:var(--rule-2);color:var(--ink-2);font-weight:500}

/* ---------------- drawer ---------------- */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:60}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(84vw,330px);z-index:61;
  background:var(--card);border-left:1px solid var(--rule);box-shadow:var(--shadow);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.3,1);
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto;
  display:flex;flex-direction:column;gap:4px}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.deyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.ditem{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:11px 10px;
  border-radius:11px;color:inherit;cursor:pointer}
.ditem:hover{background:var(--sunk)}
.ditem svg{width:19px;height:19px;flex:none;margin-top:1px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3)}
.ditem b{display:block;font-size:14px;font-weight:500}
.ditem i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.dsplit{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);margin:14px 10px 7px}
.seg.dtheme{margin:0 10px}
.seg.dtheme button{flex:1}
.dnote{margin:16px 10px 0}
.segwide{display:flex;margin:6px 0 4px}
.segwide button{flex:1}

/* Fourteen days of focus, as a strip you can read at a glance rather than a
   list you have to add up. */
.fhist{display:flex;align-items:flex-end;gap:4px;padding:6px 2px 0}
.fbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.fbv{position:relative;width:100%;height:74px;border-radius:5px;background:var(--sunk);
  display:flex;align-items:flex-end;overflow:hidden}
.fbv > i{display:block;width:100%;background:var(--accent);border-radius:5px}
.fbv > u{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:9px;height:9px;
  border:1.5px solid var(--rule-2);border-radius:99px;text-decoration:none;font-size:7px;
  line-height:6px;text-align:center;color:var(--ink-3)}
.fbm{font-size:9.5px;color:var(--ink-3);height:11px}
.fbd{font-size:9.5px;color:var(--ink-3)}

/* ---------------- today's plan ---------------- */
.plan{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 13px 10px;margin-bottom:14px}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.phead h2{font-size:15px}
.phead .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.plist{display:flex;flex-direction:column}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 2px;
  border-bottom:1px solid var(--rule);color:inherit;cursor:pointer}
.pitem:last-child{border-bottom:none}
.pitem:hover .pt{color:var(--accent-ink)}
.pdot{flex:none;width:7px;height:7px;border-radius:99px;background:var(--accent)}
.pdot.daily{background:var(--amber)}
.pdot.wrong{background:var(--mark)}
.pbody{flex:1;min-width:0}
.pt{display:block;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.pgo{flex:none;color:var(--ink-3);font-size:17px;line-height:1}
</style>
</head>
<body>


<div class="app">
  <div class="top" id="top">
    <button class="back hide" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="backLbl">Back</span></button>
    <div class="brand" id="brand">
      <h1>TaraCmd</h1>
      <span class="sub" id="brandSub"></span>
    </div>
    <button class="iconbtn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <button class="iconbtn" id="menuBtn" title="More" aria-label="More">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>

  <div id="view"></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div class="inner" id="sheetIn"></div></div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="syllabus"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 016.5 18H19v3H6.5A2.5 2.5 0 014 20.5z"/></svg>Syllabus</button>
  <button class="tab" data-tab="papers"><svg viewBox="0 0 24 24"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>Papers</button>
  <button class="tab" data-tab="practice"><svg viewBox="0 0 24 24"><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>Practice</button>
  <button class="tab" data-tab="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>Focus</button>
</nav>

<!-- The long tail. Everything rare or settings-shaped lives here rather than
     competing for a slot in a row of four, which is what keeps the bar from
     creeping back to seven. Opened by the button, never by an edge swipe: on
     Android 10+ a swipe from either edge is the system Back gesture, and an
     app that fights the OS for that edge loses. -->
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dhead">
    <span class="deyebrow">TaraCmd</span>
    <button class="xbtn" id="drawerX" aria-label="Close">&#215;</button>
  </div>
  <button class="ditem" data-go="toppers">
    <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.4 6.7 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>
    <span><b>Toppers' copies</b><i>Published answer booklets, by rank and by subject</i></span>
  </button>
  <button class="ditem" id="dRead">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    <span><b>Read the whole syllabus</b><i>All 1,723 subtopics, flat — and what prints</i></span>
  </button>
  <button class="ditem" id="dData">
    <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
    <span><b>Back up or restore</b><i>This device is the only copy of your progress</i></span>
  </button>
  <button class="ditem" id="dUpdate">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-2.3 5.6"/><path d="M20 6v6h-6"/></svg>
    <span><b>Updates</b><i id="dVer">Checking what is installed…</i></span>
  </button>
  <div class="dsplit">Theme</div>
  <div class="seg dtheme" id="dTheme">
    <button data-theme-set="light">Light</button>
    <button data-theme-set="dark">Dark</button>
    <button data-theme-set="system">System</button>
  </div>
  <p class="note dnote">Everything you tick, log and score is stored on this device only, under
    <span class="mono">taracmd-v1</span>. Nothing is sent anywhere, and clearing site data or
    moving phone loses it unless you have backed it up.</p>
</aside>

<script>
const SUBJECTS = __SUBJECTS__;
const PYQ = __PYQ__;
const TOPPERS = __TOPPERS__;
const KEYS = __KEYS__;
const QUIZ = __QUIZ__;
const OPTIONALS = __OPTIONALS__;
const DAILY = __DAILY__;
const ARCHIVE = "https://www.upsc.gov.in/examinations/previous-question-papers/archives";
const KEYINDEX = "https://www.upsc.gov.in/examinations/answer-key";

/* ---------------- storage (best effort) ---------------- */
/* The key never changes: it is the only thing standing between a returning
   visitor and an empty app. Every field added since is additive and defaulted
   below, so a store written by an older build still loads. */
const KEY = "taracmd-v1";
const BLANK = {
  done:     {},   // topic id  -> [subtopic indices ticked]
  theme:    null, // "dark" | "light" | null for system
  attempts: {},   // "year-paper-set" -> {question: letter}   OMR sheets
  revised:  {},   // topic id  -> [epoch ms]                  revision history
  picks:    {},   // question id -> option index              practice answers
  writing:  {},   // "year-code" -> [{q,mins,words,score,of,note,on}]  Mains log
  daily:    {},   // "YYYY-MM-DD" -> {score,of,src}           daily quiz log
  focus:    [],   // [{on,mins,ran,kind,left}]                focus sessions
  focusRun: null  // the session in flight, so a reload cannot lose the clock
};
let store = Object.assign({}, BLANK);
try{ const r = localStorage.getItem(KEY); if(r) store = Object.assign(store, JSON.parse(r)); }catch(e){}
for(const k in BLANK){ if(store[k] === undefined || store[k] === null) store[k] = BLANK[k]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

/* Native bridge — present only inside the Android shell. Lets a single copy
   be saved to the app's own folder and reopened offline. Absent on the web,
   where the browser's own download handles it. */
const NATIVE = (typeof AndroidHost !== "undefined") ? AndroidHost : null;
function savedPath(url){
  if(!NATIVE) return null;
  try{ return NATIVE.savedPath(url) || null; }catch(e){ return null; }
}
const doneSet = id => new Set(store.done[id] || []);
function toggleSub(tid, i, total){
  const s = doneSet(tid);
  s.has(i) ? s.delete(i) : s.add(i);
  store.done[tid] = [...s];
  if(!store.done[tid].length) delete store.done[tid];
  /* Finishing a topic is itself a revision — and it is the only moment we can
     honestly timestamp, which is what starts the decay clock below. */
  if(total && s.size === total && !revisions(tid).length) markRevised(tid);
  else save();
}

/* ---------------- revision decay ----------------
   A tick says you have read something once. It does not say you still know it
   nine months later, and nine months is the shape of this exam. So each topic
   also carries the dates it was revised, and falls due again on widening
   intervals. Additive: a store with no `revised` simply has nothing due. */
const REVISE_DAYS = [3, 7, 21, 60, 120];
const DAY = 86400000;
const revisions = tid => store.revised[tid] || [];
const lastRevised = tid => { const r = revisions(tid); return r.length ? r[r.length - 1] : null; };

function markRevised(tid){
  const r = revisions(tid).slice();
  r.push(Date.now());
  if(r.length > 12) r.shift();           // the tail is what matters, not a diary
  store.revised[tid] = r;
  save();
}

const isComplete = tp => tp.subtopics.length > 0 &&
  (store.done[tp.id] || []).length >= tp.subtopics.length;

/* Days until this topic wants looking at again. <=0 is due, null means it is
   not a candidate yet — still part-ticked and never revised, so it belongs to
   "Not done" rather than to the decay schedule. */
function dueIn(tp){
  const last = lastRevised(tp.id);
  if(last === null) return isComplete(tp) ? 0 : null;
  const step = REVISE_DAYS[Math.min(revisions(tp.id).length - 1, REVISE_DAYS.length - 1)];
  return Math.ceil((last + step * DAY - Date.now()) / DAY);
}

const isDue = tp => { const d = dueIn(tp); return d !== null && d <= 0; };

/* ---------------- the clock ----------------
   Prelims sits on the last Sunday of May; Mains opens on 1 September. Worked
   out at runtime and never baked in: this page is built to be opened offline
   months later, and a date frozen at build time would quietly be a lie. */
function lastSundayOfMay(y){
  const d = new Date(y, 4, 31);
  d.setDate(31 - ((d.getDay() + 7) % 7));
  return d;
}
function nextExam(){
  const now = new Date(), y = now.getFullYear(), out = [];
  for(const yy of [y, y + 1]){
    out.push({name: "Prelims " + yy, on: lastSundayOfMay(yy)});
    out.push({name: "Mains " + yy, on: new Date(yy, 8, 1)});
  }
  return out.filter(c => c.on >= now).sort((a, b) => a.on - b.on)[0];
}

function agoWords(ms){
  const d = Math.floor((Date.now() - ms) / DAY);
  if(d <= 0) return "today";
  if(d === 1) return "yesterday";
  if(d < 30) return d + " days ago";
  const m = Math.floor(d / 30);
  return m === 1 ? "a month ago" : m + " months ago";
}

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAPER_LBL = {prelims:"P", "mains-gs1":"GS1", "mains-gs2":"GS2", "mains-gs3":"GS3", "mains-gs4":"GS4", essay:"Essay"};
/* Not const: renderPapers points the three paper renderers at a panel below
   its segment control and puts this back afterwards. They all write to `view`
   and none of them takes a target, so this is the seam. */
let view = document.getElementById("view");
const topicCount = s => s.topics.length;
function subjProgress(s){
  let d=0, t=0;
  for(const tp of s.topics){ t += tp.subtopics.length; d += (store.done[tp.id]||[]).length; }
  return t ? d/t : 0;
}
function chipHtml(t){
  return t.papers.map(p=>{
    const cls = p==="prelims" ? "chip p" : p==="essay" ? "chip e" : "chip";
    return `<span class="${cls}">${PAPER_LBL[p]||p}</span>`;
  }).join("");
}
const CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
const LINKI = '<svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v7H3V3h7"/></svg>';
const XI    = '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>';
const DOWNI = '<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>';

/* ---------------- state ---------------- */
let state = {
  tab: "syllabus", filter: "all", tfilter: "all",
  pset: "prelims",        // which paper index the Papers tab is showing
  lens: "subject",        // "subject" | "paper" — two shapes of one syllabus
  open: new Set(),        // expanded groups
  openTopics: new Set(),  // topics expanded in place
  read: false,            // the flat, printable read-it-all view
};

/* ---------------- renderers ---------------- */
/* ---------------- the syllabus ----------------
   This tab IS the syllabus, not a menu standing in front of it. Eight
   subjects, 242 topics and 1,723 subtopics, on one page that opens in place
   and reads all the way down. It used to be eight cards leading to a list
   leading to a modal, which meant the 1,723 lines — the actual syllabus —
   could only be seen eight at a time, one topic at a time, 242 modals deep.

   Two lenses over the same topics. BY SUBJECT is how the material is taught.
   BY PAPER is how the Commission actually sets it, and 240 of the 242 topics
   carry more than one paper tag, so the two are genuinely different shapes of
   one syllabus rather than the same list printed twice. */

const PAPER_ORDER = ["prelims", "mains-gs1", "mains-gs2", "mains-gs3", "mains-gs4", "essay"];
const PAPER_NAME = {
  prelims: "Prelims", "mains-gs1": "Mains GS-I", "mains-gs2": "Mains GS-II",
  "mains-gs3": "Mains GS-III", "mains-gs4": "Mains GS-IV", essay: "Essay",
};
const PAPER_ICON = {
  prelims: "◷", "mains-gs1": "🏛", "mains-gs2": "⚖", "mains-gs3": "📈",
  "mains-gs4": "🧭", essay: "✍",
};
const ALL_TOPICS = SUBJECTS.flatMap(s => s.topics.map(tp => ({tp, s})));
const OWNER = {};
ALL_TOPICS.forEach(x => { OWNER[x.tp.id] = x; });

const ticked = tp => (store.done[tp.id] || []).length;

/* Topics and subtopics counted separately. One percentage cannot say which it
   means, and "68% of topics" is a different claim from 68% of the reading. */
function tally(list){
  let tDone = 0, sTot = 0, sDone = 0;
  for(const tp of list){
    sTot += tp.subtopics.length;
    const d = ticked(tp);
    sDone += d;
    if(tp.subtopics.length && d >= tp.subtopics.length) tDone++;
  }
  return {tTot: list.length, tDone, sTot, sDone, pct: sTot ? sDone / sTot : 0};
}

function groups(){
  if(state.lens === "paper"){
    return PAPER_ORDER
      .map(p => ({id: p, icon: PAPER_ICON[p], name: PAPER_NAME[p], short: PAPER_NAME[p],
                  topics: ALL_TOPICS.filter(x => x.tp.papers.includes(p)).map(x => x.tp)}))
      .filter(g => g.topics.length);
  }
  return SUBJECTS.map(s => ({id: s.id, icon: s.icon, name: s.name, short: s.short, topics: s.topics}));
}

function passesFilter(tp){
  if(state.tfilter === "due") return isDue(tp);
  if(state.tfilter === "high") return tp.weight === "high";
  if(state.tfilter === "left") return ticked(tp) < tp.subtopics.length;
  return true;
}

const hl = (s, term) => !term ? esc(s)
  : esc(s).replace(new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>");

/* The shape of the whole thing in one strip: how big is this, and where does
   the mass sit? Nothing answered that before, and it is the first thing you
   want to know about a syllabus you have to finish by a date. */
function shapeHtml(){
  const gs = groups();
  const max = Math.max(...gs.map(g => g.topics.length));
  const t = tally(ALL_TOPICS.map(x => x.tp));
  const multi = ALL_TOPICS.filter(x => x.tp.papers.length > 1).length;
  return `<div class="shape">
    <div class="shead">
      <span><b class="mono">${t.tTot}</b> topics · <b class="mono">${t.sTot.toLocaleString()}</b> subtopics</span>
      <span class="n">${t.tDone} done · ${t.sDone.toLocaleString()} ticked</span>
    </div>
    <div class="sbars">
      ${gs.map(g => {
        const gt = tally(g.topics);
        return `<button class="sbar" data-jump="${g.id}">
          <span class="sb-l"><span class="sb-i">${g.icon}</span>${esc(g.short)}</span>
          <span class="sb-t"><i style="width:${(g.topics.length / max * 100).toFixed(1)}%"></i><b style="width:${(g.topics.length / max * gt.pct * 100).toFixed(1)}%"></b></span>
          <span class="sb-n mono">${g.topics.length}</span>
        </button>`;
      }).join("")}
    </div>
    <p class="note" style="margin-top:9px">${multi} of ${t.tTot} topics count for more than one paper — revising once
      serves Prelims and Mains together. <b>By paper</b> shows the syllabus the way the Commission sets it.</p>
  </div>`;
}

/* A topic opened in place. The sheet still exists and still owns revision;
   this is for reading, and reading the whole of a topic should not cost a
   navigation. */
function subtopicsHtml(tp, term){
  const done = new Set(store.done[tp.id] || []);
  return `<div class="subs">
    ${tp.subtopics.map((x, i) => `
      <button class="sub ${done.has(i) ? "on" : ""}" data-tick="${tp.id}" data-i="${i}">
        <span class="box">${CHECK}</span><span class="stxt">${hl(x, term)}</span>
      </button>`).join("")}
    <div class="subfoot">
      <span class="also">Counts for ${tp.papers.map(p => PAPER_NAME[p] || p).join(", ")}</span>
      <button class="linky" data-sheet="${tp.id}">Open · mark revised</button>
    </div>
  </div>`;
}

function topicHtml(tp, s, term){
  const open = state.openTopics.has(tp.id);
  const dn = ticked(tp), tot = tp.subtopics.length;
  const d = dueIn(tp);
  const dueChip = d === null ? "" : d <= 0 ? `<span class="chip due">due</span>` : `<span class="chip sched">${d}d</span>`;
  const matched = term ? tp.subtopics.filter(x => x.toLowerCase().includes(term)) : [];
  const teaser = (matched.length ? matched : tp.subtopics).slice(0, 2).join(" · ");
  return `<div class="tw ${open ? "open" : ""}">
    <button class="row" data-open="${tp.id}">
      <span class="stripe ${tp.weight}"></span>
      <span class="body">
        <span class="t">${hl(tp.name, term)}</span>
        <span class="s">${s ? esc(s.short) + " · " : ""}${hl(teaser, term)}</span>
        <span class="chips">${chipHtml(tp)}<span class="chip">${dn}/${tot}</span>${dueChip}${
          term && matched.length ? `<span class="chip m">${matched.length} match${matched.length > 1 ? "es" : ""}</span>` : ""}</span>
      </span>
      <span class="caret">${open ? "−" : "+"}</span>
    </button>
    ${open ? subtopicsHtml(tp, term) : ""}
  </div>`;
}

/* Everything, flat, no controls: for reading end to end and for printing. The
   app is one file and prints as one document, so this costs a stylesheet
   rather than an export. */
function readHtml(){
  const subs = ALL_TOPICS.reduce((a, x) => a + x.tp.subtopics.length, 0);
  return `<div class="readdoc">
    <h1>UPSC Civil Services — the syllabus</h1>
    <p class="note">${ALL_TOPICS.length} topics, ${subs.toLocaleString()} subtopics. Ticks are
      left out on purpose: this view is for reading.</p>
    ${SUBJECTS.map(s => `
      <h2>${s.icon} ${esc(s.name)}</h2>
      ${s.topics.map(tp => `
        <h3>${esc(tp.name)}<span class="rp">${tp.papers.map(p => PAPER_NAME[p]).join(" · ")}</span></h3>
        <ul>${tp.subtopics.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}`).join("")}
  </div>`;
}

/* ---------------- today ----------------
   What to study, rather than what exists.

   The app already knew all of this and made you assemble it: which topics had
   fallen due, whether the daily quiz was logged, which practice answers you
   got wrong. That is a to-do list, and it was scattered across three tabs.

   Nothing here is a new obligation invented by the app. Every line is
   something already true of your own data, and every line is one tap from the
   thing it is about. */
const PLAN_N = 6;

function planItems(){
  const out = [];
  const due = ALL_TOPICS.filter(x => isDue(x.tp)).sort((a, b) => dueIn(a.tp) - dueIn(b.tp));
  for(const {tp, s} of due.slice(0, PLAN_N)){
    const d = dueIn(tp);
    out.push({kind: "topic", id: tp.id, title: tp.name, sub: s.short,
              note: d < 0 ? `${-d}d overdue` : "due today"});
  }

  const today = new Date().toISOString().slice(0, 10);
  const dow = new Date().getDay();
  if(dow !== 0 && !(store.daily || {})[today])
    out.push({kind: "daily", title: "Today's current-affairs quiz", sub: "Practice",
              note: "not logged"});

  const wrong = (QUIZ.questions || []).filter(q =>
    store.picks[q.id] !== undefined && store.picks[q.id] !== q.answer).length;
  if(wrong) out.push({kind: "wrong", title: `${wrong} practice answer${wrong > 1 ? "s" : ""} to go back over`,
                      sub: "Practice", note: "got wrong"});
  return out;
}

function planHtml(){
  const items = planItems();
  const done = ALL_TOPICS.filter(x => isComplete(x.tp)).length;
  if(!items.length){
    return `<div class="plan">
      <div class="phead"><h2>Today</h2><span class="n">nothing due</span></div>
      <p class="note" style="margin:0">Nothing has fallen due and today's quiz is logged.
        ${done < ALL_TOPICS.length
          ? "Start something new below — the syllabus is sorted by how often it comes up."
          : "The whole syllabus is ticked off; the decay schedule will bring it back round."}</p>
    </div>`;
  }
  return `<div class="plan">
    <div class="phead"><h2>Today</h2><span class="n">${items.length} to do</span></div>
    <div class="plist">
      ${items.map(i => `<button class="pitem" data-plan="${i.kind}" data-id="${i.id || ""}">
        <span class="pdot ${i.kind}"></span>
        <span class="pbody"><span class="pt">${esc(i.title)}</span>
          <span class="ps">${esc(i.sub)} · ${esc(i.note)}</span></span>
        <span class="pgo">›</span>
      </button>`).join("")}
    </div>
  </div>`;
}

function bindPlan(root){
  root.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => {
    const k = b.dataset.plan;
    if(k === "topic"){ openTopic(b.dataset.id); return; }
    state.tab = "practice"; state.qmode = k === "daily" ? "daily" : "practice";
    markTab("practice"); render();
  });
}

    <div class="searchwrap">

      </div>

            </span>

    render();

    state.lens = b.dataset.lens; state.open = new Set(); render();
  });
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { state.tfilter = b.dataset.f; render(); });
  view.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
    const id = b.dataset.jump;
    state.open.add(id);
    render();
    const el = document.getElementById("g-" + id);
    if(el) el.scrollIntoView({behavior: "smooth", block: "start"});

  bindPlan(view);
  bindOutline(view);
